<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>蕈時間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: one calm phone-width column in a night forest, views swapped in place, a fixed bottom tab bar (海月時間シリーズと同じ骨組み) */
:root{
  --bg:#EEF2EA; --bg-top:#D9E5D2; --surface:#FFFFFF; --sunk:#E3EADD; --ink:#16231A; --muted:#55665A; --line:#C9D5C3;
  --teal:#2E6A45; --teal-soft:#DCEBDF; --accent:#B98A3E; --accent-soft:#F5EAD6; --accent-ink:#4A3410; --red:#C23B2E;
  --good:#23845A; --good-bg:#DCF1E6; --bad:#B9503A; --bad-bg:#F8E1DA;
  --night1:#1F3A2A; --night2:#122219; --night3:#07100B; --star:#C6F28A; --night-ink:#E7F0DC; --night-muted:#A9BFAE;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A120D; --bg-top:#142319; --surface:#111C15; --sunk:#0D1711; --ink:#E4EFE0; --muted:#9DB2A1; --line:#22342A;
  --teal:#9DD3A9; --teal-soft:#1A2F22; --accent:#D9A86C; --accent-soft:#3A2B14; --accent-ink:#F4DDB5; --red:#FF8B7B;
  --good:#6CCB94; --good-bg:#14332A; --bad:#E8826A; --bad-bg:#3A201A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A120D; --bg-top:#142319; --surface:#111C15; --sunk:#0D1711; --ink:#E4EFE0; --muted:#9DB2A1; --line:#22342A;
  --teal:#9DD3A9; --teal-soft:#1A2F22; --accent:#D9A86C; --accent-soft:#3A2B14; --accent-ink:#F4DDB5; --red:#FF8B7B;
  --good:#6CCB94; --good-bg:#14332A; --bad:#E8826A; --bad-bg:#3A201A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg) linear-gradient(180deg,var(--bg-top) 0,var(--bg) 360px) no-repeat;min-height:100%;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:1.6rem;font-weight:900}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;gap:10px;min-height:52px}
.back{border:0;background:none;padding:8px 10px 8px 0;font-size:1rem;color:var(--teal);font-weight:700;white-space:nowrap;flex:none}
.top .ttl{font-family:var(--f-display);font-weight:700;font-size:1.05rem;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.hello{padding-block:10px 4px}
.hello .eyebrow{font-size:.8rem;letter-spacing:.08em;color:var(--teal);font-weight:700}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.78rem;color:var(--muted)}

.continue{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(120deg,var(--night1),var(--night2));color:var(--night-ink);border:0;border-radius:14px;padding:16px 18px}
.continue small{display:block;opacity:.85;font-size:.8rem}
.continue strong{font-family:var(--f-display);font-size:1.1rem}
.continue .go{font-size:1.4rem;color:var(--star)}

.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.subjects .subj:last-child:nth-child(odd){grid-column:1/-1}
.subj{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:92px}
.subj .k{font-family:var(--f-display);font-size:1.6rem;font-weight:900;line-height:1;color:var(--teal)}
.subj b{font-family:var(--f-display);font-size:1.05rem}
.subj .small{line-height:1.45}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item[disabled]{opacity:.5;cursor:default}
.item .body{flex:1;min-width:0}
.item .chev{color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.done{background:var(--good-bg);color:var(--good)}
.tag.mid{background:var(--accent-soft);color:var(--accent-ink)}
.lid{flex:none;min-width:44px;height:30px;padding:0 8px;border-radius:99px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal);font-weight:700;font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:.9rem}
.lid.col{background:var(--accent-soft);color:var(--accent-ink);font-size:.78rem}
.lid.done{background:var(--teal);color:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:var(--teal);color:var(--surface)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.warm{background:var(--accent);color:#2B1F00}
.btn.wide{width:100%}
.btn.again{background:var(--teal-soft);color:var(--teal);border:2px solid var(--teal)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.item:focus-visible,.subj:focus-visible,.choice:focus-visible,.card:focus-visible,.tab:focus-visible,.rflip:focus-visible,.continue:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* lesson */
.lesson section{display:flex;flex-direction:column;gap:10px}
.rule{background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:12px 14px;font-weight:700;line-height:1.75}
.ex{font-family:var(--f-display);font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums}
.fx{background:var(--sunk);border-radius:10px;padding:10px 14px;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.8}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chain span{background:var(--teal-soft);color:var(--teal);border-radius:8px;padding:4px 10px;font-weight:700;font-size:.92rem}
.chain i{font-style:normal;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-top:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.tbl th{font-weight:700;color:var(--muted);font-size:.8rem}
.tbl td:first-child{min-width:6.5em}
.tbl tr:first-child th,.tbl tr:first-child td{border-top:0}
.scroll{overflow-x:auto}
.fig{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}svg.fig{background:#fff;border-radius:10px;color:#16231A;--bg:#EEF2EA;--surface:#FFFFFF;--sunk:#E3EADD;--ink:#16231A;--muted:#55665A;--line:#C9D5C3;--teal:#2E6A45;--teal-soft:#DCEBDF;--accent:#B98A3E;--accent-soft:#F5EAD6;--accent-ink:#4A3410;--red:#C23B2E;--good:#23845A;--good-bg:#DCF1E6;--bad:#B9503A;--bad-bg:#F8E1DA}
.fig text{font-family:var(--f-body);font-size:12px;fill:var(--ink)}
.fig .lb{font-weight:700}
.fig .ch{fill:var(--teal-soft);stroke:var(--teal);stroke-width:1.5}
.fig .chL{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.fig .wl{fill:none;stroke:var(--teal);stroke-width:2}
.fig .mu{fill:var(--muted);font-size:10.5px}
.fig .ac{fill:var(--accent)}
.fig .bd{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}.fig .at{font-size:11px;font-weight:700}.fig .bg{fill:var(--surface)}.fig .sg{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}.fig .cell{fill:var(--teal-soft);stroke:var(--teal);stroke-width:2}.fig .tp{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}.fig .xx{stroke:var(--red);stroke-width:3;stroke-linecap:round}.fig .ar{fill:none;stroke:var(--muted);stroke-width:1.6;marker-end:url(#ah)}.dg{color:var(--red);font-weight:700}.mk{background:rgba(240,140,70,.42);border-radius:3px;padding:0 2px}.kgrp{font-size:.8rem;color:var(--muted);margin:2px 0 2px}.kgrp:not(:first-child){margin-top:8px}.fig .sm2{font-size:10.5px;fill:var(--ink)}.sgt{font-size:.72rem;white-space:nowrap}.sgt th,.sgt td{padding:5px 6px;text-align:center}.sgt td.sgd,.sgt th.sgd{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}.sgt tr.sgtop td{border-top:2px solid var(--line,#ccc)}.sgt td.sgc{font-weight:700}.fig.apf{max-width:240px;margin:8px 0}.fig.dev{max-width:180px;margin:6px 0}.fig.ftu{max-width:220px;margin:6px 0 0;display:block;height:auto}.stt td{vertical-align:middle}.stt td.stc{text-align:center;color:#3A2210;white-space:nowrap;width:6.5em}.band{padding:10px 16px 6px;font-weight:700;font-size:.85rem;color:var(--accent-ink);background:var(--accent-soft);border-bottom:1px solid var(--line,#ddd)}.figwip{border:1.5px dashed var(--line,#ccc);border-radius:12px;padding:22px 10px;text-align:center;color:var(--muted);font-size:.85rem;margin:6px 0 12px}.pfl{display:flex;flex-direction:column;gap:6px;margin:8px 0}.pfa{background:#DCEFD9;color:#24451F;border-radius:10px;padding:8px;text-align:center;font-weight:700}.pfd{text-align:center;font-weight:700;font-size:.9rem}.pfr{display:flex;align-items:stretch;gap:6px}.pfb{flex:1;background:#F6E3C6;color:#4A3410;border-radius:10px;padding:8px;font-size:.85rem;display:flex;align-items:center}.pfx{display:flex;align-items:center;font-weight:700}.pfc{flex:1.2;background:#E6DDF0;color:#3A2A55;border-radius:10px;padding:8px;font-size:.85rem}.sigfig{line-height:1.9}.sigfig ruby rt{font-size:.6em;color:var(--muted)}.sfn{font-size:1.1em;font-weight:700;letter-spacing:.05em}.cm{color:#222;border-radius:4px;padding:0 3px;white-space:nowrap}.fgs{display:block;width:104px;height:auto;margin-top:4px}.fgs[viewBox^="0 0 170"]{width:180px}.fpt{font-size:.9rem}.fpt3{table-layout:fixed;width:100%;font-size:.85rem}.fpt3 td,.fpt3 th{vertical-align:top;padding:6px 4px}.eq3 th{width:33.3%!important}.fpt3 th:nth-child(1){width:36%}.fpt3 th:nth-child(2){width:30%}.fpt td{vertical-align:top;padding-left:5px;padding-right:5px}.fpt td:first-child{white-space:nowrap}.fpt td:last-child{min-width:7.5em}.radt{font-size:.8rem;min-width:560px}.dmt{table-layout:fixed;min-width:560px;font-size:.8rem}.dmt td,.dmt th{vertical-align:top;padding:6px 4px;text-align:center}.dmt td:first-child{text-align:left}.dmt th:first-child{width:22%}.ksd{table-layout:fixed;min-width:620px;font-size:.82rem}.ksd td,.ksd th{vertical-align:top;padding:6px}.ksd th:nth-child(1){width:30%!important}.ksd th:nth-child(2){width:40%!important}.radt td,.radt th{vertical-align:top;padding:6px 6px}.radt td:first-child,.radt th:first-child{white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1}.goro-img{display:block;width:100%;height:auto;border-radius:12px;background:#fff;margin-bottom:10px}.fig .dg{fill:var(--red);font-weight:700}
.ktbl td:first-child{white-space:nowrap;font-weight:700;width:4.6em}sup.iso{font-size:.62em;vertical-align:.5em;line-height:0;letter-spacing:0}.knum{table-layout:fixed;width:100%}.kw td:first-child{white-space:normal;width:44%}.knum td:first-child{width:2em}.kdrug{display:flex;flex-direction:column;margin-bottom:8px;line-height:1.45}.kdrug .kp{font-size:.72rem;color:var(--muted);font-weight:400}.kdrug:last-child{margin-bottom:0}.fig .nm{font-size:8.5px;fill:var(--muted)}.fig .ah{fill:var(--muted)}.fig .tl{fill:none;stroke:var(--muted);stroke-width:1.6}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.note-box{background:var(--sunk);border-color:transparent;display:flex;flex-direction:column;gap:10px}
.ptypes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ptypes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--sunk);border-radius:12px;padding:10px 8px;min-width:0}
.ptypes svg{width:84px;height:84px}.ptypes .pb{fill:var(--teal)}
.ptypes figcaption{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}.ptypes figcaption span{font-size:.76rem;line-height:1.5;color:var(--muted)}
.fig .pm,.legend i.pm{fill:#7FBF6E;background:#7FBF6E}.fig .pw,.legend i.pw{fill:#3F7FB0;background:#3F7FB0}.fig .po,.legend i.po{fill:#D9A86C;background:#D9A86C}
.frac{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle;line-height:1.35;font-size:.92em}
.frac>span{display:block;text-align:center;padding:0 .3em;white-space:nowrap}.frac>span:first-child{border-bottom:1.5px solid currentColor}
.fxs{display:flex;flex-direction:column;gap:12px;font-size:.92rem;overflow-x:auto}.fxs>div{display:flex;align-items:center;gap:5px;white-space:nowrap}.fxs .fn{min-width:6em}
.rule.steps{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}.rule.steps b{margin-bottom:4px}.rule.steps i{font-style:normal;line-height:1.2}
.idx{margin:0;display:flex;flex-direction:column;gap:4px}.idx dt{font-weight:700;color:var(--teal);margin-top:8px}.idx dt:first-child{margin-top:0}.idx dd{margin:0;line-height:1.75}
.fxl{background:var(--sunk);border-radius:10px;padding:8px 10px;margin-top:6px;font-weight:700;overflow-x:auto;font-size:.92rem;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.fig .wa{stroke:var(--accent);stroke-width:2}.fig .wm{stroke:var(--muted);stroke-width:2}.fig path.ah{stroke:none;fill:var(--teal)}.fig path.ah.wa{fill:var(--accent)}.fig path.ah.wm{fill:var(--muted)}
.fig.period{max-width:420px}
.fig .grid{stroke:var(--line);stroke-width:1}
.note{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:.9rem}

/* cards */
.card{position:relative;width:100%;min-height:230px;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:24px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center}
.card .side{font-size:.75rem;letter-spacing:.1em;color:var(--teal);font-weight:700}
.card .term{font-family:var(--f-display);font-size:1.7rem;font-weight:900}
.card .def{font-size:1.02rem;line-height:1.8;max-width:30em}
.card.flipped{background:var(--teal-soft)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px;text-align:center}
.qbox .prompt{color:var(--muted);font-size:.92rem}
.qbox .expr{font-family:var(--f-display);font-size:1.6rem;font-weight:900;margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.5}
.qbox .expr.long{font-size:1.12rem;font-weight:700;line-height:1.7;text-align:left}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 8px;font-family:var(--f-display);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.choices.words{grid-template-columns:1fr}
.choices.words .choice{font-size:1.02rem;padding:12px;text-align:left}
.choice .frac{font-size:.95em}
.choice.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.choice.ng{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.choice[disabled]{cursor:default}
.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feedback.ok{background:var(--good-bg)}
.feedback.ng{background:var(--bad-bg)}
.feedback .verdict{font-family:var(--f-display);font-weight:900;font-size:1.15rem}
.feedback.ok .verdict{color:var(--good)} .feedback.ng .verdict{color:var(--bad)}
.hint{background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:12px 14px;font-size:.95rem}
.linkbtn{border:0;background:none;color:var(--teal);font-weight:700;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.result{text-align:center;padding:24px 16px}
.result .big{font-family:var(--f-display);font-size:3rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--teal);line-height:1.1}

/* record */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.day.on{background:var(--teal);color:var(--surface);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input[type=text]:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok::before{background:var(--good)}
.status.wait::before{background:var(--accent)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted);font-weight:700}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}

<script>
(() => {
/* ===== 設定（GitHubに置くときにここを書きかえます） ===== */

function numChoices(ans, cands, unit=''){

  { id:'1-3', t:'放射線の分類', sub:'分類・基本的性質', plan:['radc','radc','radc','radc','radc'], body:()=>`

    <p class="small muted">γ線とX線は波長ではなく発生場所で区別する（γ線：原子核内、X線：原子核外）。</p>

    <section class="panel"><h3>〇 各放射線の基本的性質</h3>
    <p>放射線は、物質相互作用（電離作用、励起（蛍光）作用、写真作用）と透過作用をもつ。</p>
    <p class="small muted">表は横にスクロールできる。</p>
    <div class="scroll"><table class="tbl radt"><tr><th></th><th>α線</th><th>β線（β⁻線）</th><th>γ線（核内）・X線（核外）</th></tr><tr><td><b>本体</b></td><td><span class="mk">陽子2個、中性子2個</span><br>（He原子核）</td><td><span class="mk">（陰）電子</span></td><td><span class="mk">電磁波</span></td></tr><tr><td><b>物質相互作用<br><span class="small muted">（電離作用）</span></b></td><td>大</td><td>中</td><td>小</td></tr><tr><td><b>透過力</b></td><td>小</td><td>中</td><td>大</td></tr><tr><td><b>飛程<br><span class="small muted">（空気中）</span></b></td><td>小さい（直線）</td><td>α線より大きい（ジグザグ）</td><td>—</td></tr><tr><td><b>遮蔽</b></td><td><span class="mk">紙</span></td><td><span class="mk">厚いプラスチック板</span><br>（アクリル板）</td><td><span class="mk">鉛板、コンクリート</span></td></tr><tr><td><b>スペクトル</b></td><td><span class="mk">線</span>スペクトル</td><td><span class="mk">連続</span>スペクトル</td><td>γ線：線スペクトル<br>特性X線：線スペクトル<br>制動X線：連続スペクトル</td></tr><tr><td><b>代表的な放出核種</b></td><td>²²²Rn、²²⁶Ra、²³⁹Pu<br><span class="small muted">（質量数が大きい）</span></td><td>³H、¹⁴C、³²P、³⁵S、⁴⁰K、⁶⁰Co、⁹⁰Sr、¹³¹I、¹³⁷Cs</td><td>α壊変時：²²²Rn、²²⁶Ra<br>β⁻壊変時：⁴⁰K、⁶⁰Co、¹³¹I<br>EC時：¹²³I、¹²⁵I、²⁰¹Tl<br>IT時：⁹⁹ᵐTc</td></tr></table></div>
    <p class="small muted">β線にはβ⁺線もある。β⁺線の本体は陽電子（ポジトロン）1個。物質中で電子と結合して消滅し、180°方向に消滅放射線を出す。放出核種：¹¹C、¹³N、¹⁵O、¹⁸F、²²Na（半減期が短い：超小型サイクロトロンで製造）。</p>
    <p class="small muted">特性X線：空の電子軌道に外側の軌道電子が移るとき、その差のエネルギーが電磁波として出たもの。<br>制動X線：運動している電子が原子核の正電荷で強く制動を受け、運動エネルギーの一部が電磁波に変わったもの。</p>
    <p class="small muted">※放射線加重係数：等価線量を算定する際、ヒトに対する放射線の影響を評価するために、吸収線量を補正する数値<br>α線（20）＞β線・γ線・X線（1）</p>

  { id:'1-5', t:'放射線に関する単位', sub:'Bq・Gy・Sv', plan:['radu','radu','radu','radu','radu'], body:()=>`
    <section class="panel"><h3>〇 放射線と放射能</h3>
    <p><span class="mk">放射線</span>：放射性物質から出る粒子線・電磁波。<br><span class="mk">放射能</span>：放射線を出す能力。<br><span class="mk">放射性物質</span>：放射能をもつ物質。</p>

    <section class="panel"><h3>〇 放射線に関する単位</h3>
    <p class="small muted">表は横にスクロールできる。</p>
    <div class="scroll"><table class="tbl radt"><tr><th></th><th>単位</th><th>内容</th><th>その他</th></tr><tr><td><b>放射線の<br>エネルギー</b></td><td>eV</td><td>電子1個が1 Vの電圧で加速されて得るエネルギー</td><td></td></tr><tr><td><b>放射能</b></td><td><span class="mk">Bq</span></td><td><span class="mk">1秒間</span>あたりの壊変数</td><td></td></tr><tr><td><b>壊変率</b></td><td>dps<br>dpm</td><td>1秒間あたりの壊変数（壊変/秒）<br>1分間あたりの壊変数（壊変/分）</td><td>Bq＝dps<br>1 dps＝60 dpm</td></tr><tr><td><b>照射線量</b></td><td>C/kg</td><td><span class="mk">空気</span>1 kg中にγ線・X線がどれくらいのイオンをつくるかを表す単位</td><td>電磁波のみに使用</td></tr><tr><td><b>吸収線量</b></td><td><span class="mk">Gy</span></td><td><span class="mk">物質</span>1 kgに放射線がどれくらいエネルギーを与えたかを表す単位</td><td></td></tr><tr><td><b>等価線量</b><br><span class="small muted">（線量当量）</span></td><td><span class="mk">Sv</span></td><td><span class="mk">人体</span>に放射線がどれくらいダメージを与えたかを表す単位<br>【等価線量】＝【組織・臓器の平均吸収線量】×【放射線加重係数<sup>※1</sup>】</td><td rowspan="2">人体の放射線防護の指標として用いる</td></tr><tr><td><b>実効線量</b></td><td><span class="mk">Sv</span></td><td><span class="mk">人体</span>に放射線がどれくらいダメージを与えたかを表す単位<br>【実効線量】＝各組織・臓器の実効線量の和<br>【組織・臓器の実効線量】＝【組織・臓器の等価線量】×【組織加重係数<sup>※2</sup>】</td></tr><tr><td><b>計数率</b></td><td>cps<br>cpm</td><td>1秒間あたりの計数（計数/秒）<br>1分間あたりの計数（計数/分）</td><td>測定器がとらえた電離粒子の数＝計数<br>1 cps＝60 cpm</td></tr></table></div>

  { id:'1-6', t:'放射性核種', sub:'天然・人工・応用', plan:['nucl','nucl','nucl','nucl','nucl'], body:()=>`
    <section class="panel"><h3>〇 天然放射性核種</h3>
    <p>天然に存在する核種。</p>
    ${ktbl([
      ['①', '²³⁸U、²³⁵U、²³²Thを出発点とする壊変系列に属する核種<br>例）²²⁶Ra、²²²Rn<br><span class="small muted">α線放出核種で呼吸により被ばくするため、内部被ばくが問題となる。</span>'],
      ['②', '半減期が非常に長く（13億年）、その核種のみが放射性のもの<br>例）⁴⁰K<br><span class="small muted">天然存在比が大きく、地殻などによる自然放射線の主要因子の1つ</span>'],
      ['③', '宇宙線と大気中物質との反応により生成（誘導天然型放射性核種）<br>例）³H、¹⁴C']
    ]).replace('tbl ktbl','tbl ktbl knum')}
    <p><b>覚え方</b></p><img class="goro-img" src="goro/natnuc.png" alt="天然放射性核種の覚え方。天然！再試40個！天然＝天然放射性核種、再＝3H、試＝14C、40個＝40K" loading="lazy"></section>
    <section class="panel"><h3>〇 人工放射性核種</h3>
    <p>人工的に産生される核種。</p>
    ${ktbl([
      ['①', '原子炉を利用した方法<br>例）³H、¹⁴C、³²P、¹³¹I'],
      ['②', '加速器を利用した方法<br>例）¹¹C、¹³N、¹⁵O、¹⁸F<br><span class="small muted">β⁺壊変核種。半減期が短いため、超小型サイクロトロンで生成する。</span>']
    ]).replace('tbl ktbl','tbl ktbl knum')}</section>
    <section class="panel"><h3>〇 応用</h3>
    ${ktbl([
      ['<span class="mk">ミルキング</span>', '放射平衡（主に過渡平衡）を利用して、親核種から短半減期の娘核種を化学分離して得る方法。<br>その装置をジェネレーターという。<br><span class="small muted">例）⁹⁹ᵐTcの生成</span>'],
      ['<span class="mk">ラジオイムノアッセイ</span>', '<span class="mk">抗原抗体反応</span>を利用した生体内微量成分の<span class="mk">定量法</span>。<br>放射性核種で標識した抗体などを用いる。<br><span class="small muted">例）¹²⁵I</span>'],
      ['<span class="mk">ポジトロンCT</span><br>（PET）', 'β⁺線から放出される<span class="mk">消滅放射線</span>を体外で測定することにより、<span class="mk">断層像</span>を得る方法。<br>消滅放射線（γ線）は180°方向に2本出る<br>→ 2本あるので空間分解能が高い。<br><span class="small muted">例）¹¹C、¹³N、¹⁵O、¹⁸F、²²Na</span>'],
      ['サイクロトロン', '荷電粒子を加速して、原子核にぶつけることにより、放射性核種をつくり出す装置。<br>短寿命の放射性核種を院内で得るのに用いられている。'],
      ['トレーサー法', '物質に放射性核種を混ぜ、その放射線を追跡することで物質の挙動を知る方法。<br>特にβ⁻線放射性核種が用いられる。<br><span class="small muted">例）³H、¹⁴C、³²P</span>'],
      ['シンチグラフィー', '放射性核種を投与し、目的とする臓器あるいは全身に分布させ、その放射線を測定し、画像処理により分布図を得る方法。']
    ])}</section>` },
  { id:'1-7', t:'代表的な放射性核種', sub:'放出放射線・半減期・集積性', plan:['repn','repn','repn','repn','repn'], body:()=>`
    <section class="panel"><h3>〇 代表的な放射性核種</h3>

    <div class="scroll"><table class="tbl radt" style="min-width:720px"><tr><th>核種</th><th>放出放射線<br>（エネルギー）</th><th>半減期</th><th>天然 or 人工</th><th>集積性</th><th>その他</th></tr><tr><td><b>① ³H</b></td><td>β⁻線（低）</td><td>約12.3年</td><td>天然＆人工<br>（誘導天然）</td><td>全身</td><td>トレーサー実験に使用</td></tr><tr><td><b>② ¹⁴C</b></td><td>β⁻線（低）</td><td>約5730年</td><td>天然＆人工<br>（誘導天然）</td><td>全身</td><td>トレーサー実験に使用</td></tr><tr><td><b>③ ³²P</b></td><td>β⁻線（高）</td><td>約14.3日</td><td>人工</td><td>骨</td><td>トレーサー実験に使用</td></tr><tr><td><b>④ ¹¹C</b></td><td>β⁺線</td><td>約20.4分</td><td>人工</td><td>—</td><td>PET（ポジトロンCT）に使用</td></tr><tr><td><b>⑤ ¹³N</b></td><td>β⁺線</td><td>約9.97分</td><td>人工</td><td>—</td><td>PET（ポジトロンCT）に使用</td></tr><tr><td><b>⑥ ¹⁵O</b></td><td>β⁺線</td><td>約2.04分</td><td>人工</td><td>—</td><td>PET（ポジトロンCT）に使用</td></tr><tr><td><b>⑦ ¹⁸F</b></td><td>β⁺線</td><td>約1.83時間</td><td>人工</td><td>—</td><td>PET（ポジトロンCT）に使用</td></tr><tr><td><b>⑧ ⁴⁰K</b></td><td>β⁻線（高）<br>＆γ線</td><td>約13億年</td><td>天然</td><td>—</td><td>バックグラウンドに影響</td></tr><tr><td><b>⑨ ⁶⁰Co</b></td><td>β⁻線（低）<br>＆γ線</td><td>約5.27年</td><td>人工</td><td>—</td><td>照射用γ線源に使用<br>バレイショの発芽防止</td></tr><tr><td><b>⑩ ⁹⁰Sr</b></td><td>β⁻線</td><td>約29年</td><td>人工</td><td>骨</td><td>永続平衡が成立<br>⁹⁰Sr → ⁹⁰Y → ⁹⁰Zr<br><span class="small muted">（約29年）（約64時間）</span></td></tr><tr><td><b>⑪ ⁹⁹ᵐTc</b></td><td>γ線</td><td>約6時間</td><td>ミルキングで生成</td><td>—</td><td>過渡平衡が成立<br>⁹⁹Mo → ⁹⁹ᵐTc → ⁹⁹Tc<br><span class="small muted">親（約66時間）→ 娘（約6時間）：10倍程度</span><br>診断用医薬品（SPECT）に最も多く使用</td></tr><tr><td><b>⑫ ¹²³I</b></td><td>γ線</td><td>約13.2時間</td><td>人工</td><td>甲状腺</td><td>EC後、γ線放出<br>（SPECTに使用）<br><span class="small muted">例）イオフルパン</span></td></tr><tr><td><b>⑬ ¹²⁵I</b></td><td>γ線</td><td>約60.1日</td><td>人工</td><td>甲状腺</td><td>EC後、γ線放出<br>（<span class="mk">ラジオイムノアッセイに汎用</span>）</td></tr><tr><td><b>⑭ ¹³¹I</b></td><td>β⁻線（高）<br>＆γ線</td><td>約8日</td><td>人工</td><td>甲状腺</td><td>β⁻壊変後、β⁻線とγ線放出<br>（診断用及び治療用医薬品に使用）</td></tr><tr><td><b>⑮ ¹³⁷Cs</b></td><td>β⁻線（高）<br>＆γ線</td><td>約30年</td><td>人工</td><td>筋肉<br>（全身）</td><td>永続平衡が成立<br>¹³⁷Cs → ¹³⁷ᵐBa → ¹³⁷Ba</td></tr><tr><td><b>⑯ ²²⁶Ra</b></td><td>α線＆γ線</td><td>約1620年</td><td>天然</td><td>骨</td><td>永続平衡が成立<br>²²⁶Ra → ²²²Rn → ²¹⁸Po<br><span class="small muted">（地殻）（大気中）</span></td></tr><tr><td><b>⑰ ²²²Rn</b></td><td>α線＆γ線</td><td>約3.8日</td><td>天然</td><td>—</td><td>呼吸により肺に取り込まれる</td></tr></table></div>
    <p>※⁹⁰Sr、¹³¹I、¹³⁷Csは、<span class="mk">放射性降下物</span>（核爆発や原子力事故で生じた放射性の塵）として重要である。</p>
    <p class="small muted">PET用のβ⁺線核種（¹¹C、¹³N、¹⁵O、¹⁸F）は半減期が短い。</p></section>` },
  { id:'1-8', t:'放射能計算', sub:'有効半減期・壊変定数', plan:['rcalc','rcalc','rcalc','rcalc','rcalc'], body:()=>`
    <section class="panel"><h3>〇 有効半減期</h3>
    <p style="font-size:.88em">有効半減期＝<span class="frac"><span>（物理学的半減期）×（生物学的半減期）</span><span>（物理学的半減期）＋（生物学的半減期）</span></span></p>
    <div style="border:2px solid #F0A060;border-radius:10px;padding:10px 4px;margin:8px 0;font-size:.82em;white-space:nowrap;text-align:center"><span class="frac"><span>1</span><span>有効半減期</span></span>＝<span class="frac"><span>1</span><span>物理学的半減期</span></span>＋<span class="frac"><span>1</span><span>生物学的半減期</span></span></div>
    <p class="small muted">例）⁹⁰Srの物理学的半減期は約30年、生物学的半減期は約50年である。</p>
    <p class="small muted">⁹⁰Srの有効半減期＝<span class="frac"><span>30×50</span><span>30＋50</span></span>＝18.75（年）</p><svg class="fig" viewBox="0 0 340 150" role="img" aria-label="放射性核種は壊変による物理学的消失と、代謝・排泄による生物学的消失で減り、両方をあわせたものが有効半減期"><rect x="4" y="62" width="74" height="30" rx="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.3"/><text class="sm2" x="41.0" y="81.0" text-anchor="middle" style="font-weight:700">放射性核種</text><rect x="124" y="14" width="96" height="30" rx="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.3"/><text class="sm2" x="172.0" y="33.0" text-anchor="middle" style="font-weight:700">物理学的消失</text><rect x="124" y="110" width="96" height="30" rx="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.3"/><text class="sm2" x="172.0" y="129.0" text-anchor="middle" style="font-weight:700">生物学的消失</text><line x1="78" y1="70" x2="116.7" y2="36.6" stroke="var(--ink)" stroke-width="1.4"/><path d="M122 32 L119.0 39.2 L114.4 33.9 Z" fill="var(--ink)"/><line x1="78" y1="84" x2="116.7" y2="117.4" stroke="var(--ink)" stroke-width="1.4"/><path d="M122 122 L114.4 120.1 L119.0 114.8 Z" fill="var(--ink)"/><text class="sm2" x="84" y="38" text-anchor="middle">壊変 kₚ</text><text class="sm2" x="72" y="122" text-anchor="end">代謝・排泄 kₐ</text><line x1="220" y1="29" x2="251.3" y2="62.9" stroke="var(--ink)" stroke-width="1.4"/><path d="M256 68 L248.7 65.2 L253.8 60.5 Z" fill="var(--ink)"/><line x1="220" y1="125" x2="251.3" y2="91.1" stroke="var(--ink)" stroke-width="1.4"/><path d="M256 86 L253.8 93.5 L248.7 88.8 Z" fill="var(--ink)"/><rect x="258" y="58" width="78" height="34" rx="8" fill="#FCE3CC" stroke="var(--ink)" stroke-width="1.3"/><text class="sm2" x="297.0" y="79.0" text-anchor="middle" style="font-weight:700;fill:#3A2210">有効半減期 Tₑ</text></svg>
    <p><span class="frac"><span>1</span><span>Tₑ</span></span>＝<span class="frac"><span>kₚ＋kₐ</span><span>ln2</span></span></p>
    <p>有効半減期は、必ず物理学的半減期・生物学的半減期よりも<span class="mk">短い</span>。</p></section>
    <section class="panel"><h3>〇 壊変定数・半減期・放射能・原子数</h3>
    <p>T＝<span class="frac"><span>ln2</span><span>λ</span></span>　　A＝N・λ</p>
    ${ktbl([['T','物理学的半減期'],['λ','壊変定数'],['A','放射能<br><span class="small muted">放射能は速度</span>'],['N','原子数']])}
    <p>※半減期は壊変定数に<span class="mk">反比例</span></p></section>` },
  { id:'1-9', t:'放射平衡・放射線測定', sub:'過渡平衡・永続平衡・測定器', plan:['req','req','req','req','req'], body:()=>`
    <section class="panel"><h3>〇 放射平衡とは</h3>
    <p>親核種（A）の放射壊変により生成した娘核種（B）が放射性核種であり、娘核種の半減期（T<sub>B</sub>）が親核種の半減期（T<sub>A</sub>）より短い場合、時間が十分経ったときに見かけ上、親の半減期で減衰する。<br>これを<span class="mk">放射平衡</span>という。</p>
    <p class="small muted">半減期：親（長い）＞ 娘（短い）<br>放射能の比が一定になる。</p><svg class="fig" viewBox="0 0 300 60" role="img" aria-label="放射平衡の流れ。A、壊変定数λA・半減期TAでB、壊変定数λB・半減期TBでC"><text class="lb" x="20" y="34" text-anchor="middle">A</text><line x1="34" y1="30" x2="108" y2="30" stroke="var(--ink)" stroke-width="1.4"/><path d="M110 30 L102 26 L102 34 Z" fill="var(--ink)"/><text class="sm2" x="72" y="22" text-anchor="middle">λ<tspan font-size="8" dy="3">A</tspan></text><text class="sm2" x="72" y="46" text-anchor="middle">T<tspan font-size="8" dy="3">A</tspan></text><text class="lb" x="126" y="34" text-anchor="middle">B</text><line x1="140" y1="30" x2="214" y2="30" stroke="var(--ink)" stroke-width="1.4"/><path d="M216 30 L208 26 L208 34 Z" fill="var(--ink)"/><text class="sm2" x="178" y="22" text-anchor="middle">λ<tspan font-size="8" dy="3">B</tspan></text><text class="sm2" x="178" y="46" text-anchor="middle">T<tspan font-size="8" dy="3">B</tspan></text><text class="lb" x="232" y="34" text-anchor="middle">C</text></svg>
    <p class="small muted">λ：壊変定数、T：半減期</p></section>
    <section class="panel"><h3>〇 放射平衡の種類</h3>
    <p class="small muted">表は横にスクロールできる。</p>
    <div class="scroll"><table class="tbl radt"><tr><th>種類</th><th><span class="mk">過渡平衡</span></th><th><span class="mk">永続平衡</span></th></tr><tr><td><b>平衡成立条件</b></td><td>T<sub>A</sub> ＞ T<sub>B</sub><br><span class="small muted">T<sub>A</sub>がT<sub>B</sub>の10倍程度</span></td><td>T<sub>A</sub> ≫ T<sub>B</sub><br><span class="small muted">親の半減期が長すぎる</span></td></tr><tr><td><b>成立後の<br>原子数の特徴</b></td><td><span class="frac"><span>N<sub>B</sub></span><span>N<sub>A</sub></span></span>＝<span class="frac"><span>T<sub>B</sub></span><span>T<sub>A</sub>−T<sub>B</sub></span></span>＝一定値</td><td><span class="frac"><span>N<sub>B</sub></span><span>N<sub>A</sub></span></span>＝<span class="frac"><span>T<sub>B</sub></span><span>T<sub>A</sub></span></span>＝一定値</td></tr><tr><td><b>成立後の<br>放射能の特徴</b></td><td><span class="frac"><span>T<sub>A</sub></span><span>T<sub>A</sub>−T<sub>B</sub></span></span>＝<span class="frac"><span>Bの放射能</span><span>Aの放射能</span></span><br>＝1より少し大きい一定値</td><td><span class="mk">Aの放射能＝Bの放射能</span><br>のように見える</td></tr><tr><td><b>例</b></td><td>⁹⁹Mo → ⁹⁹ᵐTc → ⁹⁹Tc<br><span class="small muted">（約66時間）（約6時間）</span></td><td>⁹⁰Sr → ⁹⁰Y → ⁹⁰Zr<br><span class="small muted">（約29年）（約64時間）</span></td></tr></table></div><svg class="fig" viewBox="0 0 340 132" role="img" aria-label="過渡平衡では娘の放射能が親と同じ割合で減っていく。永続平衡では親の半減期が長すぎるため親も娘もほぼ一定で、放射能が等しく見える"><text class="sm2" x="79" y="12" text-anchor="middle" style="font-weight:700">過渡平衡</text><line x1="18" y1="18" x2="18" y2="112" stroke="var(--ink)" stroke-width="1.2"/><line x1="18" y1="112" x2="154" y2="112" stroke="var(--ink)" stroke-width="1.2"/><text class="sm2" x="86" y="126" text-anchor="middle">時間</text><text class="sm2" x="12" y="64" text-anchor="middle" transform="rotate(-90 12 64)">放射能</text><path d="M20 26 L150 92" stroke="#E07A8C" stroke-width="2" fill="none"/><path d="M20 110 Q44 40 74 50 L150 84" stroke="#2E8BC9" stroke-width="2" fill="none"/><text class="sm2" x="124" y="96" style="fill:#E07A8C">親</text><text class="sm2" x="112" y="62" style="fill:#2E8BC9">娘</text><text class="sm2" x="255" y="12" text-anchor="middle" style="font-weight:700">永続平衡</text><line x1="194" y1="18" x2="194" y2="112" stroke="var(--ink)" stroke-width="1.2"/><line x1="194" y1="112" x2="330" y2="112" stroke="var(--ink)" stroke-width="1.2"/><text class="sm2" x="262" y="126" text-anchor="middle">時間</text><text class="sm2" x="188" y="64" text-anchor="middle" transform="rotate(-90 188 64)">放射能</text><path d="M196 40 L326 44" stroke="#E07A8C" stroke-width="2" fill="none"/><path d="M196 110 Q216 48 250 42.5 L326 44" stroke="#2E8BC9" stroke-width="2" fill="none" stroke-dasharray="5 3"/><text class="sm2" x="306" y="34" style="fill:#E07A8C">親</text><text class="sm2" x="228" y="78" style="fill:#2E8BC9">娘</text></svg>
    <p class="small muted">過渡平衡：娘は親と同じ割合で減っていく。<br>永続平衡：親の半減期が長すぎて、親も娘もほぼ減らない。</p></section>
    <section class="panel"><h3>〇 放射線の測定</h3>
    <p><b>・電離作用を利用した測定法</b></p>
    ${ktbl([
      ['GM計数管<br><span class="small muted">（ガイガー・ミュラー計数管）</span>', '<span class="mk">高エネルギーのβ線</span><br><span class="small muted">³²P、⁴⁰K、¹³¹I<br>アルゴンなどの不活性気体が電離する。</span>'],
      ['半導体検出器<br><span class="small muted">（Ge）</span>', 'γ線'],
      ['比例計数管', '利用範囲は広い']
    ]).replace('tbl ktbl','tbl ktbl kw')}
    <p><b>覚え方</b></p><img class="goro-img" src="goro/ionmeter.png" alt="電離作用を利用した測定器の覚え方。高BGMは便利！高B＝高エネルギーβ線、GM＝GM計数管、便利＝電離作用を利用" loading="lazy">
    <p><b>・蛍光（励起）作用を利用した測定法</b></p>
    ${ktbl([
      ['NaI（Tl）<br>シンチレーションカウンタ', '<span class="mk">γ線</span>'],
      ['液体<br>シンチレーションカウンタ', '<span class="mk">低エネルギーのβ線</span><br><span class="small muted">³H、¹⁴C</span>']
    ]).replace('tbl ktbl','tbl ktbl kw')}
    <p><b>覚え方</b></p><img class="goro-img" src="goro/fluormeter.png" alt="蛍光作用を利用した測定器の覚え方。ナイル川、低いベッドは水びたし。ナイル＝NaIシンチレーションカウンタ、川＝γ線、低いベッド＝低エネルギーβ線、水びたし＝液体シンチレーションカウンタ" loading="lazy">
    <p class="small muted">※個人の外部被ばく線量の測定には、蛍光ガラス線量計（ガラスバッジ）、フィルムバッジ、OSL（光刺激ルミネッセンス）線量計などを用いる。</p></section>` },
  { id:'1-10', t:'人体への影響', sub:'組織集積性・放射線感受性', plan:['rbio','rbio','rbio','rbio','rbio'], body:()=>`
    <section class="panel"><h3>〇 自然放射線による年間平均被ばく</h3>
    ${ktbl([['日本平均','約2.1 mSv'],['世界平均','約2.4 mSv<br><span class="small muted">2008年国連科学委員会報告</span>']])}
    <p class="small muted">日本の内訳：大地から0.33 mSv、宇宙から0.3 mSv、空気中のラドン・トロンから0.47 mSv、食物から0.99 mSv。</p></section>
    <section class="panel"><h3>〇 国際放射能標識</h3><svg class="fig" viewBox="0 0 120 120" style="max-width:130px;display:block;margin:8px auto" role="img" aria-label="国際的な放射能標識。黄色地に黒の三つ葉マーク"><rect x="4" y="4" width="112" height="112" rx="6" fill="#F6D33C"/><circle cx="60" cy="60" r="7" fill="#1A1A1A"/><path d="M65.5 69.5 L79.0 92.9 A38 38 0 0 1 41.0 92.9 L54.5 69.5 A11 11 0 0 0 65.5 69.5 Z" fill="#1A1A1A"/><path d="M49.0 60.0 L22.0 60.0 A38 38 0 0 1 41.0 27.1 L54.5 50.5 A11 11 0 0 0 49.0 60.0 Z" fill="#1A1A1A"/><path d="M65.5 50.5 L79.0 27.1 A38 38 0 0 1 98.0 60.0 L71.0 60.0 A11 11 0 0 0 65.5 50.5 Z" fill="#1A1A1A"/></svg></section>
    <section class="panel"><h3>〇 組織集積性</h3>
    ${ktbl([
      ['骨', '³²P、⁴⁵Ca、⁹⁰Sr、²²⁶Ra<br><span class="small muted">²²⁶RaはCaと同じ第2族（アルカリ土類金属）なので骨に集積する。</span>'],
      ['甲状腺', '¹²³I、¹²⁵I、¹³¹I'],
      ['全身', '³H、¹⁴C、¹³⁷Cs（主に筋肉中）']
    ])}
    <p><b>覚え方</b></p><img class="goro-img" src="goro/bonenuc.png" alt="骨に集積する放射性核種の覚え方。骨にランプするか？骨に＝骨に集積、ラン＝Ra、プ＝P、する＝Sr、か＝Ca" loading="lazy"></section>
    <section class="panel"><h3>〇 放射線感受性</h3>
    <p><b>・ベルゴニー・トリボンドーの法則</b></p>
    <p>放射線感受性は、</p>
    ${ktbl([
      ['①', '細胞分裂の頻度が高いほど大きい<br><span class="small muted">活発に分裂している細胞ほど弱い。</span>'],
      ['②', '将来の分裂回数が多いほど大きい<br><span class="small muted">これから何度も分裂する若い細胞ほど弱い。</span>'],
      ['③', '形態・機能が未分化なほど大きい<br><span class="small muted">特定の役割にまだ変化していない、赤ちゃんのような細胞ほど弱い。</span>']
    ]).replace('tbl ktbl','tbl ktbl knum')}<svg class="fig" viewBox="0 0 340 234" role="img" aria-label="ベルゴニー・トリボンドーの法則。放射線感受性は造血組織、生殖腺、消化管、体表・眼、内臓・腺、支持組織、神経の順に低くなる"><defs><linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E0505A"/><stop offset="1" stop-color="#F6D5D8"/></linearGradient></defs><text class="sm2" x="22" y="14" text-anchor="middle" style="font-weight:700;fill:#E0505A">高い</text><rect x="14" y="28" width="16" height="164" fill="url(#bgg)"/><path d="M6 192 L38 192 L22 210 Z" fill="#F6D5D8"/><text class="sm2" x="22" y="226" text-anchor="middle">低い</text><text class="sm2" x="200" y="14" text-anchor="middle" style="font-weight:700">放射線感受性（細胞分裂頻度）</text><rect x="48" y="28" width="288" height="26" fill="none" stroke="var(--line,#ccc)" stroke-width="1"/><text class="sm2" x="56" y="45" style="font-weight:700">造血組織</text><text class="sm2" x="118" y="45">骨髄、胸腺、脾臓、リンパ組織</text><rect x="48" y="54" width="288" height="26" fill="none" stroke="var(--line,#ccc)" stroke-width="1"/><text class="sm2" x="56" y="71" style="font-weight:700">生殖腺</text><text class="sm2" x="118" y="71">精巣、卵巣</text><rect x="48" y="80" width="288" height="26" fill="none" stroke="var(--line,#ccc)" stroke-width="1"/><text class="sm2" x="56" y="97" style="font-weight:700">消化管</text><text class="sm2" x="118" y="97">腸、粘膜</text><rect x="48" y="106" width="288" height="26" fill="none" stroke="var(--line,#ccc)" stroke-width="1"/><text class="sm2" x="56" y="123" style="font-weight:700">体表・眼</text><text class="sm2" x="118" y="123">皮膚、毛のう、水晶体</text><rect x="48" y="132" width="288" height="26" fill="none" stroke="var(--line,#ccc)" stroke-width="1"/><text class="sm2" x="56" y="149" style="font-weight:700">内臓・腺</text><text class="sm2" x="118" y="149">肺、腎臓、肝臓、膵臓、甲状腺</text><rect x="48" y="158" width="288" height="26" fill="none" stroke="var(--line,#ccc)" stroke-width="1"/><text class="sm2" x="56" y="175" style="font-weight:700">支持組織</text><text class="sm2" x="118" y="175">骨、血管、結合組織、脂肪組織、筋肉</text><rect x="48" y="184" width="288" height="26" fill="none" stroke="var(--line,#ccc)" stroke-width="1"/><text class="sm2" x="56" y="201" style="font-weight:700">神経</text><text class="sm2" x="118" y="201">神経</text></svg>
    ${ktbl([
      ['高感受性', 'リンパ組織（脾臓、胸腺）、骨髄、胎児の組織'],
      ['中感受性', '皮膚、眼、消化管'],
      ['低感受性', '結合組織、筋肉'],
      ['さらに<br>低感受性', '神経、脂肪組織']
    ])}
    <p class="small muted">※組織加重係数が大きい（0.12）組織：肺、胃、結腸、赤色骨髄、乳房</p></section>` },
  { id:'1-11', t:'放射線の影響', sub:'確定的影響・確率的影響', plan:['reff','reff','reff','reff','reff'], body:()=>`
    <section class="panel"><h3>〇 身体的影響と遺伝的影響</h3>
    <p class="small muted">表は横にスクロールできる。</p>
    <div class="scroll"><table class="tbl radt"><tr><th></th><th></th><th>確定的影響<br><span class="small muted">しきい線量を超える放射線に被ばくしたときに生じる。</span></th><th>確率的影響<br><span class="small muted">微量の放射線に被ばくした際でも生じる可能性がある。</span></th></tr><tr><td rowspan="2"><b>身体的影響</b><br><span class="small muted">被ばくした<br>人への影響</span></td><td>急性影響</td><td>皮膚の<span class="mk">紅斑</span>、<span class="mk">脱毛</span>、<span class="mk">白血球減少</span>、<span class="mk">不妊</span></td><td>—</td></tr><tr><td>晩発影響</td><td><span class="mk">白内障</span></td><td rowspan="2"><span class="mk">白血病</span>、<span class="mk">がん</span><br><br><span class="mk">代謝異常</span>、<span class="mk">軟骨異常</span></td></tr><tr><td><b>遺伝的影響</b><br><span class="small muted">被ばくした人の<br>子孫への影響</span></td><td>晩発影響</td><td>—</td></tr></table></div>
    <p class="small muted">※急性影響：放射線を受けて数週間以内に出る症状<br>晩発影響：数ヶ月から数年後に出る症状</p></section>
    <section class="panel"><h3>〇 確定的影響と確率的影響</h3>
    ${ktbl([

// 問題：分類を答える／分類から薬を選ぶ／商品名から一般名／特徴を選ぶ
function kdQ(key){
  const d=pick(KD[key].drugs), cls=[...new Set(KD_ALL.map(x=>x[2]))].filter(c=>c!==d[2]), others=KD_ALL.filter(x=>x[2]!==d[2]), same=KD_ALL.filter(x=>x!==d);
  const t=ri(0,3), wq=a=>shuffle([...a]).slice(0,3);

    <p>血漿タンパク質に結合していない<b>非結合形（遊離形）薬物</b>が、血液から組織へ移行する。<br>作用部位に到達し薬効を発現するのは<b>非結合形</b>の薬物。</p>

    <svg class="fig" viewBox="0 0 340 210" role="img" aria-label="分布の模式図。血管内の非結合形薬物は組織へ移行し、組織からも血管へ戻る。血管内では血漿タンパク質と、組織内では組織タンパク質と結合形薬物をつくり、非結合形と結合形は平衡にある"><path d="M22 46 V176 A53 9 0 0 0 128 176 V46" fill="#F5D3D3" stroke="#B04040" stroke-width="1.2"/><ellipse cx="75" cy="46" rx="53" ry="9" fill="#F9E3E3" stroke="#B04040" stroke-width="1.2"/><rect x="212" y="40" width="108" height="140" rx="12" fill="#E8DFF0" stroke="#7A5C99" stroke-width="1.2"/><text class="sm2" x="75" y="32" text-anchor="middle" style="font-size:10px;font-weight:700;fill:var(--ink)">血管</text><text class="sm2" x="266" y="32" text-anchor="middle" style="font-size:10px;font-weight:700;fill:var(--ink)">組織</text><circle cx="62" cy="72" r="3.6" fill="#222"/><circle cx="84" cy="72" r="3.6" fill="#222"/><circle cx="62" cy="94" r="3.6" fill="#222"/><circle cx="84" cy="94" r="3.6" fill="#222"/><circle cx="250" cy="72" r="3.6" fill="#222"/><circle cx="272" cy="72" r="3.6" fill="#222"/><circle cx="250" cy="94" r="3.6" fill="#222"/><circle cx="272" cy="94" r="3.6" fill="#222"/><circle cx="58" cy="140" r="11" fill="#C98F8F" stroke="#555" stroke-width=".8"/><circle cx="51" cy="131" r="3.6" fill="#222"/><circle cx="92" cy="140" r="11" fill="#C98F8F" stroke="#555" stroke-width=".8"/><circle cx="58" cy="166" r="11" fill="#C98F8F" stroke="#555" stroke-width=".8"/><circle cx="92" cy="166" r="11" fill="#C98F8F" stroke="#555" stroke-width=".8"/><circle cx="99" cy="158" r="3.6" fill="#222"/><circle cx="250" cy="140" r="11" fill="#A58DC2" stroke="#555" stroke-width=".8"/><circle cx="243" cy="131" r="3.6" fill="#222"/><circle cx="284" cy="140" r="11" fill="#A58DC2" stroke="#555" stroke-width=".8"/><circle cx="291" cy="132" r="3.6" fill="#222"/><circle cx="266" cy="166" r="11" fill="#A58DC2" stroke="#555" stroke-width=".8"/><line x1="94" y1="72" x2="234.0" y2="72.0" stroke="#2B6CB0" stroke-width="1.4"/><path d="M240 72 L234.0 75.0 L234.0 69.0 Z" fill="#2B6CB0"/><line x1="240" y1="94" x2="100.0" y2="94.0" stroke="#2B6CB0" stroke-width="1.4"/><path d="M94 94 L100.0 91.0 L100.0 97.0 Z" fill="#2B6CB0"/><rect x="146" y="76" width="40" height="15" rx="3" fill="none" stroke="var(--ink)" stroke-width=".9"/><text class="sm2" x="166" y="87" text-anchor="middle" style="font-size:9.5px;font-weight:700;fill:var(--ink)">分布</text><line x1="62" y1="101" x2="62.0" y2="118.0" stroke="#444" stroke-width="1.1"/><path d="M62 124 L59.0 118.0 L65.0 118.0 Z" fill="#444"/><line x1="84" y1="124" x2="84.0" y2="107.0" stroke="#444" stroke-width="1.1"/><path d="M84 101 L87.0 107.0 L81.0 107.0 Z" fill="#444"/><line x1="250" y1="101" x2="250.0" y2="118.0" stroke="#444" stroke-width="1.1"/><path d="M250 124 L247.0 118.0 L253.0 118.0 Z" fill="#444"/><line x1="272" y1="124" x2="272.0" y2="107.0" stroke="#444" stroke-width="1.1"/><path d="M272 101 L275.0 107.0 L269.0 107.0 Z" fill="#444"/><text class="sm2" x="166" y="12" text-anchor="middle" style="font-size:9px;font-weight:700;fill:var(--ink)">非結合形薬物（遊離形薬物）</text><line x1="150" y1="16" x2="86" y2="68" stroke="var(--ink)" stroke-width="0.8"/><line x1="182" y1="16" x2="248" y2="68" stroke="var(--ink)" stroke-width="0.8"/><text class="sm2" x="40" y="204" text-anchor="middle" style="font-size:9px;font-weight:400;fill:var(--ink)">血漿タンパク質</text><line x1="42" y1="196" x2="51" y2="175" stroke="var(--ink)" stroke-width="0.8"/><text class="sm2" x="166" y="204" text-anchor="middle" style="font-size:9px;font-weight:400;fill:var(--ink)">結合形薬物</text><line x1="150" y1="196" x2="100" y2="160" stroke="var(--ink)" stroke-width="0.8"/><line x1="182" y1="196" x2="242" y2="134" stroke="var(--ink)" stroke-width="0.8"/><text class="sm2" x="292" y="204" text-anchor="middle" style="font-size:9px;font-weight:400;fill:var(--ink)">組織タンパク質</text><line x1="290" y1="196" x2="273" y2="174" stroke="var(--ink)" stroke-width="0.8"/></svg>
    <p><b>・組織移行性、分布容積（V<sub>d</sub>）が大きい薬物の一般的な特徴</b></p>
    <p>脂溶性が高い<br>血漿タンパク非結合率（f<sub>P</sub>）が大きい<br>組織タンパク非結合率（f<sub>T</sub>）が小さい</p>
    <p class="small muted">血漿中の非結合形薬物濃度⬆ → 組織へ移行しやすい</p>
    <p><b>・組織単位質量あたりの血流量が多い組織</b></p>
    <p>肝、腎、肺、脳、心臓 → 分布しやすい</p></section>` },
  { id:'4-2', t:'脳への移行性', sub:'血液脳関門・血液脳脊髄液関門', plan:['gbbb','gbbb','gbbb','gbbb','gbbb'], body:()=>`
    <section class="panel"><h3>〇 脳への移行経路</h3>
    <p><b>① 血液から直接、脳実質細胞（ニューロン、グリア細胞）へ移行する経路</b><br>→ <b>血液脳関門（BBB）</b>を通る。</p>
    <p>血液と脳の間の透過障壁＝<b>血液脳関門</b>（BBB：blood-brain barrier）。<br>脳の毛細血管壁は<b>内皮細胞が密着結合</b><br>→ 脳への物質移行を制限。</p>
    <svg class="fig" viewBox="0 0 340 178" role="img" aria-label="血液脳関門の模式図。脳毛細血管内皮細胞が密着結合している。D-グルコースはヘキソース輸送系、アミノ酸（レボドパ）はアミノ酸輸送系で脳へ移行し、P-糖タンパク質は薬物を血中へ排出する"><rect x="8" y="34" width="104" height="120" fill="#F4C9B8"/><rect x="116" y="34.0" width="48" height="40.0" rx="5" fill="#F3E3CF" stroke="#8C6A4A" stroke-width=".9"/><ellipse cx="140.0" cy="54.0" rx="5" ry="6.5" fill="none" stroke="#8C6A4A" stroke-width=".9"/><rect x="116" y="74.0" width="48" height="40.0" rx="5" fill="#F3E3CF" stroke="#8C6A4A" stroke-width=".9"/><ellipse cx="140.0" cy="94.0" rx="5" ry="6.5" fill="none" stroke="#8C6A4A" stroke-width=".9"/><rect x="116" y="114.0" width="48" height="40.0" rx="5" fill="#F3E3CF" stroke="#8C6A4A" stroke-width=".9"/><ellipse cx="140.0" cy="134.0" rx="5" ry="6.5" fill="none" stroke="#8C6A4A" stroke-width=".9"/><rect x="170" y="34" width="34" height="120" rx="6" fill="#DCE8D5" stroke="#5A7A4E" stroke-width=".9"/><rect x="210" y="34" width="122" height="120" fill="#E4E4E4"/><text class="sm2" x="60" y="26" text-anchor="middle" style="font-size:9px;font-weight:700;fill:var(--ink)">血液</text><text class="sm2" x="140" y="15" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#C0392B">毛細血管</text><text class="sm2" x="140" y="27" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#C0392B">内皮細胞</text><text class="sm2" x="187" y="15" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:var(--ink)">グリア</text><text class="sm2" x="187" y="27" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:var(--ink)">細胞</text><text class="sm2" x="271" y="26" text-anchor="middle" style="font-size:9px;font-weight:700;fill:var(--ink)">脳</text><text class="sm2" x="56" y="48" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#222">ヘキソース輸送系</text><text class="sm2" x="56" y="60" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#222">D-グルコース</text><circle cx="116" cy="56" r="3.2" fill="#9A9A9A"/><line x1="100" y1="56" x2="144.0" y2="56.0" stroke="#2B4C8C" stroke-width="1.4"/><path d="M150 56 L144.0 59.0 L144.0 53.0 Z" fill="#2B4C8C"/><circle cx="164" cy="56" r="3.2" fill="#9A9A9A"/><line x1="158" y1="56" x2="244.0" y2="56.0" stroke="#2B4C8C" stroke-width="1.4"/><path d="M250 56 L244.0 59.0 L244.0 53.0 Z" fill="#2B4C8C"/><text class="sm2" x="54" y="88" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#222">アミノ酸輸送系</text><text class="sm2" x="54" y="100" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#222">アミノ酸（レボドパ）</text><circle cx="116" cy="96" r="3.2" fill="#9A9A9A"/><line x1="106" y1="96" x2="144.0" y2="96.0" stroke="#2B4C8C" stroke-width="1.4"/><path d="M150 96 L144.0 99.0 L144.0 93.0 Z" fill="#2B4C8C"/><circle cx="164" cy="96" r="3.2" fill="#9A9A9A"/><line x1="158" y1="96" x2="244.0" y2="96.0" stroke="#2B4C8C" stroke-width="1.4"/><path d="M250 96 L244.0 99.0 L244.0 93.0 Z" fill="#2B4C8C"/><text class="sm2" x="48" y="125" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#222">多くの薬物</text><text class="sm2" x="48" y="146" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#222">P-糖タンパク質</text><path d="M82 122 H121 Q130 122 130 131 Q130 140 121 140 H112" fill="none" stroke="#C0392B" stroke-width="1.4"/><circle cx="116" cy="140" r="3.2" fill="#9A9A9A"/><line x1="112" y1="140" x2="96.0" y2="140.0" stroke="#C0392B" stroke-width="1.4"/><path d="M90 140 L96.0 137.0 L96.0 143.0 Z" fill="#C0392B"/><text class="sm2" x="250" y="120" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#222">分子量が小さく</text><text class="sm2" x="250" y="131" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#222">脂溶性が高い薬物</text><text class="sm2" x="250" y="142" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#222">ほど移行しやすい</text><line x1="132" y1="114" x2="158" y2="163" stroke="#888" stroke-width=".8"/><text class="sm2" x="186" y="172" text-anchor="middle" style="font-size:8px;font-weight:700;fill:#C0392B">密着結合（tight junction）</text></svg>
    <p>・薬物は一般に<b>単純拡散</b>で脳内へ移行<br>→ <b>分子量が小さく脂溶性が高い</b>薬物ほど脳へ移行しやすい。</p>
    <p>・<b>特殊輸送系</b>（能動輸送など）で膜透過する物質も存在（<span class="dg">グルコース</span>、<span class="dg">レボドパ</span>など）。</p>
    <p class="small muted">GLUT1（グルコース）・MCT1（乳酸・ピルビン酸、ケトプロフェン）・LAT1（中性アミノ酸、レボドパ）</p>
    <p>・<b>P-糖タンパク質</b>や有機アニオン輸送系<br>→ 脳毛細血管内皮細胞から血中へ能動的に<b>排出</b>される物質も存在（<span class="dg">シクロスポリン</span>、<span class="dg">ビンクリスチン</span>、<span class="dg">ビンブラスチン</span>など）。</p>
    <p><b>② 血液から脳脊髄液に移行し、その後脳へ移行する経路</b><br>→ <b>血液脳脊髄液関門（BCSFB）</b>を通る。</p>
    <p><b>脈絡叢</b>は<b>上皮細胞が密着結合</b><br>＋ 有機アニオン輸送系による排出（脳脊髄液 → 血液）<br>→ 脳脊髄液への物質移行を制限。</p>
    <p class="small muted">脈絡叢上皮細胞＝血液脳脊髄液関門の実体・P-糖タンパク質も存在</p>
    <svg class="fig" viewBox="0 0 340 178" role="img" aria-label="血液脳脊髄液関門の模式図。脈絡叢上皮細胞が密着結合している。ビタミンはビタミン輸送系で脳脊髄液へ移行し、有機アニオン輸送系は脳脊髄液から血液へ物質を排出する"><rect x="8" y="34" width="96" height="120" fill="#F4C9B8"/><rect x="108" y="34.0" width="40" height="36.7" rx="5" fill="#F3E3CF" stroke="#8C6A4A" stroke-width=".9"/><ellipse cx="128.0" cy="52.3" rx="5" ry="6.5" fill="none" stroke="#8C6A4A" stroke-width=".9"/><rect x="108" y="75.7" width="40" height="36.7" rx="5" fill="#F3E3CF" stroke="#8C6A4A" stroke-width=".9"/><ellipse cx="128.0" cy="94.0" rx="5" ry="6.5" fill="none" stroke="#8C6A4A" stroke-width=".9"/><rect x="108" y="117.3" width="40" height="36.7" rx="5" fill="#F3E3CF" stroke="#8C6A4A" stroke-width=".9"/><ellipse cx="128.0" cy="135.7" rx="5" ry="6.5" fill="none" stroke="#8C6A4A" stroke-width=".9"/><rect x="154" y="34.0" width="46" height="40.0" rx="5" fill="#F3E3CF" stroke="#8C6A4A" stroke-width=".9"/><ellipse cx="177.0" cy="54.0" rx="5" ry="6.5" fill="none" stroke="#8C6A4A" stroke-width=".9"/><rect x="154" y="74.0" width="46" height="40.0" rx="5" fill="#F3E3CF" stroke="#8C6A4A" stroke-width=".9"/><ellipse cx="177.0" cy="94.0" rx="5" ry="6.5" fill="none" stroke="#8C6A4A" stroke-width=".9"/><rect x="154" y="114.0" width="46" height="40.0" rx="5" fill="#F3E3CF" stroke="#8C6A4A" stroke-width=".9"/><ellipse cx="177.0" cy="134.0" rx="5" ry="6.5" fill="none" stroke="#8C6A4A" stroke-width=".9"/><defs><pattern id="csfp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#D6E6F2"/><line x1="0" y1="3" x2="6" y2="3" stroke="#A9C3DA" stroke-width="1"/></pattern></defs><rect x="206" y="34" width="126" height="120" fill="url(#csfp)"/><text class="sm2" x="56" y="26" text-anchor="middle" style="font-size:9px;font-weight:700;fill:var(--ink)">血液</text><text class="sm2" x="128" y="15" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:var(--ink)">毛細血管</text><text class="sm2" x="128" y="27" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:var(--ink)">内皮細胞</text><text class="sm2" x="177" y="15" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#C0392B">脈絡叢</text><text class="sm2" x="177" y="27" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#C0392B">上皮細胞</text><text class="sm2" x="269" y="26" text-anchor="middle" style="font-size:9px;font-weight:700;fill:var(--ink)">脳脊髄液</text><text class="sm2" x="56" y="52" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#222">ビタミン輸送系</text><line x1="40" y1="62" x2="144.0" y2="62.0" stroke="#2B4C8C" stroke-width="1.4"/><path d="M150 62 L144.0 65.0 L144.0 59.0 Z" fill="#2B4C8C"/><circle cx="154" cy="62" r="3.2" fill="#9A9A9A"/><line x1="158" y1="62" x2="190.0" y2="62.0" stroke="#2B4C8C" stroke-width="1.4"/><path d="M196 62 L190.0 65.0 L190.0 59.0 Z" fill="#2B4C8C"/><circle cx="200" cy="62" r="3.2" fill="#9A9A9A"/><line x1="204" y1="62" x2="254.0" y2="62.0" stroke="#2B4C8C" stroke-width="1.4"/><path d="M260 62 L254.0 65.0 L254.0 59.0 Z" fill="#2B4C8C"/><text class="sm2" x="56" y="124" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#222">有機アニオン</text><text class="sm2" x="56" y="136" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#222">輸送系</text><circle cx="200" cy="104" r="3.2" fill="#9A9A9A"/><line x1="296" y1="104" x2="210.0" y2="104.0" stroke="#C0392B" stroke-width="1.4"/><path d="M204 104 L210.0 101.0 L210.0 107.0 Z" fill="#C0392B"/><circle cx="154" cy="104" r="3.2" fill="#9A9A9A"/><line x1="170" y1="104" x2="98.0" y2="104.0" stroke="#C0392B" stroke-width="1.4"/><path d="M92 104 L98.0 101.0 L98.0 107.0 Z" fill="#C0392B"/><text class="sm2" x="269" y="122" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#222">脳脊髄液 → 血液</text><text class="sm2" x="269" y="133" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#222">へ排出</text><line x1="182" y1="114" x2="214" y2="163" stroke="#888" stroke-width=".8"/><text class="sm2" x="230" y="172" text-anchor="middle" style="font-size:8px;font-weight:700;fill:#C0392B">密着結合（tight junction）</text></svg>
    <p><b>※ 血液脳関門と血液脳脊髄液関門</b></p>
    ${tbl(['','血液脳関門<br><span class="small muted">BBB</span>','血液脳脊髄液関門<br><span class="small muted">BCSFB</span>'],[["実体", "<b>脳毛細血管内皮細胞</b>", "<b>脈絡叢上皮細胞</b>"], ["存在部位", "脳の大半の毛細血管<br><span class=\"small muted\">脈絡叢、化学受容器引き金帯（CTZ）などの血管には存在しない</span>", "脈絡叢<br><span class=\"small muted\">脳室に存在し、脳脊髄液を産生・分泌する器官</span>"], ["構成細胞", "血管内皮細胞、脳血管周皮細胞（ペリサイト）、アストロサイト", "脳毛細血管の外側に存在する上皮細胞"]]).replace('class="tbl"','class="tbl fpt3"')}
    <p><b>覚え方</b></p><img class="goro-img" src="goro/bbb.png" alt="血液脳関門と血液脳脊髄液関門の覚え方。濁点があるかどうかでペアにする。けつえきのうかんもん（濁点なし）→のうもうさいけっかんないひ細胞（脳毛細血管内皮細胞）。けつえきのうせきずいえきかんもん（濁点あり）→みゃくらくそうじょうひ細胞（脈絡叢上皮細胞）" loading="lazy"></section>` },
  { id:'4-3', t:'胎児への移行性', sub:'胎盤・血液胎盤関門', plan:['gfet','gfet','gfet','gfet','gfet'], body:()=>`
    <section class="panel"><h3>〇 胎児への移行性</h3>
    <p>・胎盤＝胎児への<b>酸素や栄養分の供給</b>、胎児側で生じた<b>老廃物の排泄</b>を行う。</p>
    <p>・胎盤には<b>血液胎盤関門</b>が存在<br>→ 母体側と胎児側の物質通過の関門として機能。</p>
    <p>・大部分の薬物の胎盤透過性は<b>単純拡散</b>に従う。</p>
    <p>・胎盤透過性</p>
    ${ktbl([['透過しやすい','分子量<b>300〜600</b>で<b>脂溶性が高い</b>薬物<br>例）<span class="dg">ワルファリン</span>、<span class="dg">デキサメタゾン</span><br><span class="small muted">バルプロ酸、フェニトイン、SSRI、ペニシリン、セフェム系、一部のNSAIDs（妊娠後期で禁忌）</span>'],['透過しにくい','分子量<b>1000以上</b>の薬物<br>例）<span class="dg">インスリン</span>、<span class="dg">ヘパリン</span><br>血漿タンパク質と<b>結合した</b>薬物']]).replace('tbl ktbl','tbl ktbl kw')}</section>` },
  { id:'4-4', t:'乳汁中への移行性', sub:'M／P比・乳児相対摂取量（RID）', plan:['gmilk','gmilk','gmilk','gmilk','gmilk'], body:()=>`
    <section class="panel"><h3>〇 乳汁中への移行性</h3>
    <p>乳汁を介して、母親から乳児に薬物が移行する可能性がある。<br>多くの薬物は<b>単純拡散</b>で乳汁中へ移行。<br>乳汁は血漿に比べて<b>酸性</b><br>→ <b>弱塩基性薬物</b>は乳汁中に移行しやすい。</p>
    <p class="small muted">血漿 pH 7.4・乳汁 pH 6.3〜7.3</p>
    <p class="small muted">（補足）</p>
    <svg class="fig" viewBox="0 0 340 146" role="img" aria-label="乳汁は血漿よりpHが低い。弱塩基性薬物は血漿中では分子形が多く、乳汁中ではイオン形が多い。乳汁中の分子形との平衡を保つため、血漿から分子形が流入し続ける"><rect x="10" y="28" width="150" height="110" rx="6" fill="#DCEAF5"/><rect x="180" y="28" width="150" height="110" rx="6" fill="#F6D9D9"/><rect x="162" y="22" width="16" height="122" fill="#F3E3CF" stroke="#8C6A4A" stroke-width=".9"/><text class="sm2" x="85" y="18" text-anchor="middle" style="font-size:9.5px;font-weight:700;fill:var(--ink)">乳汁（pH 低）</text><text class="sm2" x="255" y="18" text-anchor="middle" style="font-size:9.5px;font-weight:700;fill:var(--ink)">血漿（pH 高）</text><text class="sm2" x="85" y="52" text-anchor="middle" style="font-size:9.5px;font-weight:700;fill:#222">弱塩基性薬物</text><text class="sm2" x="85" y="72" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#C0392B">イオン形 ＞ 分子形</text><text class="sm2" x="255" y="72" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#222">分子形 ＞ イオン形</text><path d="M268 92 Q170 122 74 104" fill="none" stroke="#C0392B" stroke-width="1.6"/><path d="M74 104 L81.5 101.8 L80.2 108.8 Z" fill="#C0392B"/><text class="sm2" x="255" y="118" text-anchor="middle" style="font-size:8.5px;font-weight:400;fill:#222">平衡を維持するために</text><text class="sm2" x="255" y="130" text-anchor="middle" style="font-size:8.5px;font-weight:400;fill:#222">分子形が流入</text></svg>
    <p class="small muted">血漿（pH 高）では分子形が多い<br>→ 分子形が乳汁へ移行<br>→ 乳汁（pH 低）でイオン形になる<br>→ 平衡を維持するため、血漿から分子形が流入し続ける<br>→ pH分配仮説より、弱塩基性薬物は乳汁中で<b>高濃度</b>になりやすい。</p>
    <p><b>・M／P比</b></p>
    <p class="fx"><b>M／P比＝<span class="frac"><span>母乳中の薬物濃度</span><span>母親血漿中の薬物濃度</span></span></b></p>
    <p class="small muted">M：Milk　P：Plasma</p>
    ${ktbl([['M／P比＜1','母乳への移行量 小'],['M／P比＞1〜5','母乳への移行量 大']]).replace('tbl ktbl','tbl ktbl kw')}
    <p class="small muted">精度は低い</p>
    <p><b>・乳児相対摂取量（RID：％）</b></p>
    <p class="fx"><b>RID＝<span class="frac"><span>乳児摂取量</span><span>母体投与量</span></span>×100</b></p>
    <p class="small muted">乳児摂取量＝母体平均血中濃度×M／P比×哺乳量<br>精度が高い</p>
    ${ktbl([['RID＜1％','まったく問題ない'],['RID≦10％','安全'],['RID＞10％','乳児に移行しやすい<br>→ 投与しない、または授乳しない']]).replace('tbl ktbl','tbl ktbl kw')}
    <p>RID＞10％の例：<span class="dg">アミオダロン</span>（43％）、<span class="dg">リチウム</span>（56％）、<span class="dg">フェノバルビタール</span>（23％）、<span class="dg">イソニアジド</span>、<span class="dg">メトロニダゾール</span>（12％）</p></section>` },
  { id:'4-5', t:'リンパへの移行性', wip:true, plan:[], body:()=>'' },
  { id:'4-6', t:'血漿タンパク結合', sub:'アルブミン・α<sub>1</sub>-酸性糖タンパク質', plan:['gppb','gppb','gppb','gppb','gppb'], body:()=>`
    <section class="panel"><h3>〇 アルブミン</h3>
    <svg class="fig" viewBox="0 0 340 196" role="img" aria-label="アルブミンの結合サイト。サイトⅠ（ワルファリンサイト）にはワルファリンなど、サイトⅡ（ジアゼパムサイト）にはジアゼパム・フルルビプロフェン、サイトⅢ（ジギトキシンサイト）にはジゴキシン・ジギトキシンが結合する"><path d="M70 40 H229 V62 H245 V40 H270 V124 H190 L182 104 H164 L156 124 H70 V100 L92 82 L70 64 Z" fill="#D7DEEA" stroke="#55607A" stroke-width="1.2"/><text class="sm2" x="110" y="32" text-anchor="middle" style="font-size:10px;font-weight:700;fill:var(--ink)">アルブミン</text><text class="sm2" x="140" y="58" text-anchor="middle" style="font-size:8.5px;font-weight:400;fill:#222">サイトⅡ</text><text class="sm2" x="140" y="70" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#222">ジアゼパムサイト</text><text class="sm2" x="220" y="84" text-anchor="middle" style="font-size:8.5px;font-weight:400;fill:#222">サイトⅢ</text><text class="sm2" x="220" y="96" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#222">ジギトキシンサイト</text><text class="sm2" x="113" y="108" text-anchor="middle" style="font-size:8.5px;font-weight:400;fill:#222">サイトⅠ</text><text class="sm2" x="113" y="120" text-anchor="middle" style="font-size:8px;font-weight:700;fill:#222">ワルファリンサイト</text><path d="M20 70 L42 82 L20 94 Z" fill="#8FA3C4" stroke="#55607A"/><line x1="46" y1="82" x2="80.0" y2="82.0" stroke="#2B6CB0" stroke-width="1.4"/><path d="M86 82 L80.0 85.0 L80.0 79.0 Z" fill="#2B6CB0"/><text class="sm2" x="34" y="110" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:var(--ink)">ジアゼパム</text><text class="sm2" x="34" y="122" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:var(--ink)">フルルビプロフェン</text><rect x="229" y="6" width="16" height="16" fill="#8FA3C4" stroke="#55607A"/><line x1="237" y1="24" x2="237.0" y2="52.0" stroke="#2B6CB0" stroke-width="1.4"/><path d="M237 58 L234.0 52.0 L240.0 52.0 Z" fill="#2B6CB0"/><text class="sm2" x="222" y="13" text-anchor="end" style="font-size:8px;font-weight:400;fill:var(--ink)">ジゴキシン</text><text class="sm2" x="222" y="25" text-anchor="end" style="font-size:8px;font-weight:400;fill:var(--ink)">ジギトキシン</text><path d="M158 162 L165 144 H181 L188 162 Z" fill="#8FA3C4" stroke="#55607A"/><line x1="173" y1="142" x2="173.0" y2="116.0" stroke="#2B6CB0" stroke-width="1.4"/><path d="M173 110 L176.0 116.0 L170.0 116.0 Z" fill="#2B6CB0"/><text class="sm2" x="173" y="178" text-anchor="middle" style="font-size:8px;font-weight:400;fill:var(--ink)">ワルファリン、インドメタシン、フェニトイン</text><text class="sm2" x="173" y="190" text-anchor="middle" style="font-size:8px;font-weight:400;fill:var(--ink)">トルブタミド、アスピリン、フロセミド</text></svg>
    <p><b>・特徴</b></p>
    <p>血漿タンパク質の中で<b>最も含量が多い</b>（約60％）。<br>分子量約66,500の酸性タンパク質。<br><b>酸性薬物</b>との親和性が高い。</p>
    <p class="small muted">血漿中 約4 g/dL</p>
    <p>結合サイトは3種類（それぞれ特異的に結合する薬物が決まっている）。<br>サイトⅠ（ワルファリンサイト）<br>サイトⅡ（ジアゼパムサイト）<br>サイトⅢ（ジギトキシンサイト）<br>結合サイト以外の部位に非特異的に結合することもある。</p>
    <p>同じサイトに結合する薬物の併用<br>→ サイトを取り合う<br>→ <b>追い出し（置換）現象</b></p>
    <p><b>・増減</b></p>
    <p>肝硬変、腎疾患（ネフローゼ症候群）、妊娠、加齢、低栄養状態などで<b>減少</b><br>→ 非結合形薬物の分布量⬆</p>
    <p><b>・結合する薬物</b></p>
    ${tbl(['サイトⅠ<br><span class="small muted">ワルファリンサイト</span>','サイトⅡ<br><span class="small muted">ジアゼパムサイト</span>','サイトⅢ<br><span class="small muted">ジギトキシンサイト</span>'],[["<span class=\"dg\">ワルファリン</span><br><span class=\"dg\">インドメタシン</span><br><span class=\"dg\">フェニトイン</span><br><span class=\"dg\">トルブタミド</span><br><span class=\"dg\">アスピリン</span><br><span class=\"dg\">フロセミド</span>", "ベンゾジアゼピン系薬物（<span class=\"dg\">ジアゼパム</span>）<br><span class=\"dg\">イブプロフェン</span><br><span class=\"dg\">フルルビプロフェン</span>", "<span class=\"dg\">ジギトキシン</span><br><span class=\"dg\">ジゴキシン</span>"]]).replace('class="tbl"','class="tbl fpt3 eq3"')}
    <p><b>覚え方</b></p><img class="goro-img" src="goro/alb1.png" alt="サイトⅠ（ワルファリンサイト）に結合する薬物の覚え方。明日インドでセミ増えとるわ。明日＝アスピリン、インド＝インドメタシン、セミ＝フロセミド、増え＝フェニトイン、とる＝トルブタミド、わ＝ワルファリン" loading="lazy"><img class="goro-img" src="goro/alb2.png" alt="サイトⅡ（ジアゼパムサイト）に結合する薬物の覚え方。サイトⅡは2がカギ。ジ（接頭語di＝2）→ジアゼパム、フルルビプロフェン（ルがふたつ）" loading="lazy"></section>
    <section class="panel"><h3>〇 α<sub>1</sub>-酸性糖タンパク質</h3>
    <svg class="fig" viewBox="0 0 340 130" role="img" aria-label="α1-酸性糖タンパク質。表面のシアル酸が負電荷をもち、カチオン性（塩基性）薬物が結合する"><circle cx="120" cy="64" r="42" fill="#DCE8D5" stroke="#5A7A4E" stroke-width="1.2"/><text class="sm2" x="120" y="70" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#222">α<tspan baseline-shift="sub" style="font-size:9px">1</tspan></text><circle cx="148.7" cy="75.6" r="5" fill="#fff" stroke="#5A7A4E" stroke-width=".8"/><line x1="146.1" y1="75.6" x2="151.3" y2="75.6" stroke="#222" stroke-width="1.1"/><circle cx="132.1" cy="92.5" r="5" fill="#fff" stroke="#5A7A4E" stroke-width=".8"/><line x1="129.5" y1="92.5" x2="134.7" y2="92.5" stroke="#222" stroke-width="1.1"/><circle cx="108.4" cy="92.7" r="5" fill="#fff" stroke="#5A7A4E" stroke-width=".8"/><line x1="105.8" y1="92.7" x2="111.0" y2="92.7" stroke="#222" stroke-width="1.1"/><circle cx="91.5" cy="76.1" r="5" fill="#fff" stroke="#5A7A4E" stroke-width=".8"/><line x1="88.9" y1="76.1" x2="94.1" y2="76.1" stroke="#222" stroke-width="1.1"/><circle cx="91.3" cy="52.4" r="5" fill="#fff" stroke="#5A7A4E" stroke-width=".8"/><line x1="88.7" y1="52.4" x2="93.9" y2="52.4" stroke="#222" stroke-width="1.1"/><circle cx="107.9" cy="35.5" r="5" fill="#fff" stroke="#5A7A4E" stroke-width=".8"/><line x1="105.3" y1="35.5" x2="110.5" y2="35.5" stroke="#222" stroke-width="1.1"/><circle cx="131.6" cy="35.3" r="5" fill="#fff" stroke="#5A7A4E" stroke-width=".8"/><line x1="129.0" y1="35.3" x2="134.2" y2="35.3" stroke="#222" stroke-width="1.1"/><circle cx="148.5" cy="51.9" r="5" fill="#fff" stroke="#5A7A4E" stroke-width=".8"/><line x1="145.9" y1="51.9" x2="151.1" y2="51.9" stroke="#222" stroke-width="1.1"/><line x1="44" y1="22" x2="91.3" y2="52.4" stroke="#888" stroke-dasharray="3 2"/><text class="sm2" x="38" y="16" text-anchor="middle" style="font-size:8.5px;font-weight:400;fill:var(--ink)">シアル酸（－）</text><path d="M246 64 q-5 -6 -10 0 q-5 6 -10 0 q-5 -6 -10 0 q-5 6 -10 0 q-5 -6 -10 0 q-5 6 -10 0" fill="none" stroke="#C0504D" stroke-width="1.3"/><line x1="187" y1="64" x2="174.0" y2="64.0" stroke="#C0504D" stroke-width="1.4"/><path d="M168 64 L174.0 61.0 L174.0 67.0 Z" fill="#C0504D"/><circle cx="258" cy="64" r="10" fill="#C0504D"/><text class="sm2" x="258" y="68" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#fff">＋</text><text class="sm2" x="272" y="92" text-anchor="middle" style="font-size:8.5px;font-weight:400;fill:var(--ink)">カチオン性（＋）薬物</text><text class="sm2" x="272" y="104" text-anchor="middle" style="font-size:8.5px;font-weight:400;fill:var(--ink)">（塩基性薬物）</text><text class="sm2" x="120" y="122" text-anchor="middle" style="font-size:9px;font-weight:700;fill:var(--ink)">α<tspan baseline-shift="sub" style="font-size:6px">1</tspan>-酸性糖タンパク質</text></svg>
    <p><b>・特徴</b></p>
    <p>分子量約44,100。<br>酸性糖鎖（シアル酸）が結合 → 酸性が強い。<br>血漿タンパク質の中で存在比率は低い（約0.2％）。<br><b>塩基性薬物</b>と選択的に結合<br>→ 薬物のタンパク結合率に及ぼす影響は大きい。</p>
    <p><b>・増減</b></p>
    <p>炎症性疾患（関節リウマチなど）、心筋梗塞、外傷、感染症などで大きく<b>増加</b><br>→ 非結合形薬物の分布量⬇</p>
    <p><b>・結合する薬物</b></p>
    <p><span class="dg">プロプラノロール</span>、<span class="dg">リドカイン</span>、<span class="dg">ジソピラミド</span>、<span class="dg">イミプラミン</span>、<span class="dg">キニジン</span>、<span class="dg">クロルプロマジン</span></p>
    <p><b>覚え方</b></p><img class="goro-img" src="goro/agp.png" alt="α1-酸性糖タンパク質と高親和性の薬物の覚え方。愛のあるイジリのプロ。愛のある＝α1-酸性糖タンパク質、イ＝イミプラミン、ジ＝ジソピラミド、リ＝リドカイン、プロ＝プロプラノロール" loading="lazy"></section>` },
  { id:'4-7', t:'血漿タンパク質結合定数', wip:true, plan:[], body:()=>'' },
  { id:'4-8', t:'分布容積', sub:'分布容積・代表的な分布容積', plan:['gvd','gvd','gvd','gvd','gvd'], body:()=>`
    <section class="panel"><h3>〇 分布容積</h3>
    <p>分布容積（V<sub>d</sub>）＝薬物が<b>血中と同じ濃度で全身に分布すると仮定した場合の架空の容積</b>。<br>→ 薬物の<b>分布のしやすさ</b>の目安となる。</p>

    ${tbl(['職種','職務内容'],[["<b>医師</b>", "医療及び保健指導をつかさどることによって公衆衛生の向上及び増進に寄与し、もって国民の健康な生活を確保する"], ["歯科医師", "歯科医療及び保健指導をつかさどることによって、公衆衛生の向上及び増進に寄与し、もって国民の健康な生活を確保する"], ["<b>看護師</b>", "傷病者もしくはじょく婦に対する療養上の世話又は診療の補助を行う"], ["<b>薬剤師</b>", "<b>調剤</b>、<b>医薬品の供給</b>その他<b>薬事衛生</b>をつかさどることによって、公衆衛生の向上及び増進に寄与し、もって国民の健康な生活を確保する"], ["管理栄養士", "傷病者に対する療養のため必要な栄養の指導、個人の身体の状況・栄養状態等に応じた高度の専門知識及び技術を要する健康の保持増進のための栄養の指導、特定多数人に対して継続的に食事を供給する施設における給食管理及び栄養改善上必要な指導等を行う"], ["<b>臨床検査技師</b>", "医師又は歯科医師の指示のもとに、微生物学的検査、血清学的検査、血液学的検査、病理学的検査、寄生虫学的検査、生化学的検査及び厚生労働省令で定める種々の生理学的検査を行う"], ["<b>診療放射線技師</b>", "医師又は歯科医師の指示のもとに、放射線を人体に対して照射する"], ["<b>臨床工学技士</b>", "医師の指示のもとに、生命維持管理装置の操作及び保守点検を行う"], ["<b>理学療法士</b>", "医師の指示のもとに、理学療法（身体に障害のある者に対し、主としてその<b>基本的動作能力</b>の回復を図るため、治療体操その他の運動を行わせ、及び電気刺激、マッサージ、温熱その他の物理的手段を加えること）を行う"], ["<b>作業療法士</b>", "医師の指示のもとに、作業療法（身体又は精神に障害のある者に対し、主としてその<b>応用的動作能力</b>又は社会的適応能力の回復を図るため、手芸、工作その他の作業を行わせること）を行う"], ["臨床心理士", "臨床心理学の知識や技術を駆使して、心の健康が損なわれた人の症状を改善する"], ["医療ソーシャルワーカー", "保険医療機関において、社会福祉の立場から患者やその家族の抱える経済的・心理的・社会的問題の解決、調整を援助し、社会復帰の促進を図る"], ["※ 介護支援専門員<br>（ケアマネジャー）", "要介護者等からの相談に応じ、心身の状況等に応じた適切なサービスを利用できるよう、市町村・サービス事業者等との連絡調整を行い、<b>ケアプラン（介護サービス計画）</b>を作成する"]])}</section>` },
  { id:'2-2', t:'ICT・AST', sub:'院内感染・標準予防策・感染経路別予防策', plan:['ict','ict','ict','ict','ict'], body:()=>`

    <p><b>すべての患者</b>の血液・体液・分泌物・排泄物・粘膜・損傷した皮膚を、感染性があるものとして扱う。</p>
    <p>・手指衛生（手洗い・手指消毒）<br>・個人防護具（手袋・マスク・ガウン・ゴーグル）の使用<br>・咳エチケット<br>・使用した器具・リネンの適切な処理</p>

  { id:'5-2', t:'イオン強度', sub:'イオン強度の求め方・活量係数・反応速度定数', plan:['ion','ion','ion','ion','ion'], body:()=>`
    <section class="panel"><h3>〇 イオン強度</h3>
    <p>水溶液の中に溶けている1種類のイオン又は数種類のイオンの合計の示す<b>挙動の強さ</b>＝<b>イオン強度</b>。<br>溶けているイオンの<b>濃度</b>と、イオンのもっている<b>電荷の数</b>に依存する。<br>→ <b>電荷</b>を考えたモル濃度（mol/L）といえる。</p>
    <p><b>・イオン強度の求め方</b></p>
    <p class="fx"><b>I＝<span class="frac"><span>1</span><span>2</span></span>ΣC<sub>i</sub>・Z<sub>i</sub><sup>2</sup></b></p>
    <p class="small muted">C<sub>i</sub>：モル濃度・Z<sub>i</sub>：それぞれのイオン種の原子価（電荷数）</p>
    <p>溶液中のすべてのイオン種について、それぞれのイオンの<b>モル濃度</b>と<b>原子価の2乗</b>の積を加え合わせたものの<b>1／2</b>。</p>
    <p><b>〈1価と1価の場合〉</b>0.1 mol/L KCl水溶液</p>
    <p class="small muted">K<sup>+</sup> 0.1 mol/L・Cl<sup>−</sup> 0.1 mol/L</p>
    <p class="fx" style="font-size:.8rem;white-space:nowrap;overflow-x:auto">I＝<span class="frac"><span>1</span><span>2</span></span>｛（1×0.1×1<sup>2</sup>）＋（1×0.1×（−1）<sup>2</sup>）｝＝<b>0.1</b></p>
    <p class="small muted">（モル数×濃度×（価数）<sup>2</sup>）</p>
    <p><b>〈2価と1価の場合〉</b>0.1 mol/L CaCl<sub>2</sub>水溶液</p>
    <p class="small muted">Ca<sup>2+</sup> 0.1 mol/L・Cl<sup>−</sup> 0.2 mol/L</p>
    <p class="fx" style="font-size:.8rem;white-space:nowrap;overflow-x:auto">I＝<span class="frac"><span>1</span><span>2</span></span>｛（1×0.1×2<sup>2</sup>）＋（2×0.1×（−1）<sup>2</sup>）｝＝<b>0.3</b></p></section>
    <section class="panel"><h3>〇 イオン強度Iが影響を及ぼす因子</h3>
    <p class="small muted">25℃の水溶液の場合</p>
    <p><b>① イオン強度と活量係数の関係</b></p>
    <p class="small muted">Debye-Hückel則（デバイ・ヒュッケルの極限則）</p>
    <p class="fx">log γ<sub>±</sub>＝−0.509｜Z<sub>+</sub>Z<sub>−</sub>｜√<span style="text-decoration:overline">I</span></p>

  { id:'5-3', t:'束一的性質', sub:'蒸気圧降下・沸点上昇・凝固点降下・浸透圧', plan:['col','col','col','col','col'], body:()=>`
    <section class="panel"><h3>〇 束一的性質</h3>
    <p>理想溶液（又は希薄溶液）の<b>蒸気圧降下</b>、<b>沸点上昇</b>、<b>凝固点降下</b>、<b>浸透圧</b><br>→ 存在する<b>溶質粒子の数</b>（分子数＋イオン数）に依存し、溶質の種類が何であるかには依存しない。<br>このような性質＝<b>束一的性質</b>（束一性）。</p>
    <p class="small muted">キーワード：不揮発性溶質をとかす・粒子数に注目</p>
    <p><b>覚え方</b></p><img class="goro-img" src="goro/sokuitsu.png" alt="束一的性質の覚え方。そうじの不思議。そ＝束一的性質、じ＝蒸気圧降下、不＝沸点上昇、思＝浸透圧上昇、議＝凝固点降下" loading="lazy"></section>
    <section class="panel"><h3>〇 蒸気圧降下</h3>
    <p>ある溶媒に<b>不揮発性</b>溶質を溶解<br>→ その<b>蒸気圧が減少</b>する。</p>

/><line x1="53" y1="44" x2="53.0" y2="81.0" stroke="#2B6CB0" stroke-width="1.1"/><path d="M53 86 L50.2 81.0 L55.8 81.0 Z" fill="#2B6CB0"/><circle cx="74" cy="34" r="5" fill="#fff" stroke="#555" stroke-width=".9"/><line x1="71" y1="86" x2="71.0" y2="49.0" stroke="#2B6CB0" stroke-width="1.1"/><path d="M71 44 L73.8 49.0 L68.2 49.0 Z" fill="#2B6CB0"/><line x1="77" y1="44" x2="77.0" y2="81.0" stroke="#2B6CB0" stroke-width="1.1"/><path d="M77 86 L74.2 81.0 L79.8 81.0 Z" fill="#2B6CB0"/><circle cx="98" cy="34" r="5" fill="#fff" stroke="#555" stroke-width=".9"/><line x1="95" y1="86" x2="95.0" y2="49.0" stroke="#2B6CB0" stroke-width="1.1"/><path d="M95 44 L97.8 49.0 L92.2 49.0 Z" fill="#2B6CB0"/><line x1="101" y1="44" x2="101.0" y2="81.0" stroke="#2B6CB0" stroke-width="1.1"/><path d="M101 86 L98.2 81.0 L103.8 81.0 Z" fill="#2B6CB0"/><rect x="230" y="22" width="100" height="98" fill="#fff" stroke="#444" stroke-width="1.2"/><rect x="231" y="92" width="98" height="27" fill="#DCEAF5"/><circle cx="238" cy="99" r="5" fill="#333" stroke="#555" stroke-width=".8"/><circle cx="250" cy="99" r="5" fill="#fff" stroke="#555" stroke-width=".8"/><circle cx="262" cy="99" r="5" fill="#333" stroke="#555" stroke-width=".8"/><circle cx="274" cy="99" r="5" fill="#fff" stroke="#555" stroke-width=".8"/><circle cx="286" cy="99" r="5" fill="#333" stroke="#555" stroke-width=".8"/><circle cx="298" cy="99" r="5" fill="#fff" stroke="#555" stroke-width=".8"/><circle cx="310" cy="99" r="5" fill="#333" stroke="#555" stroke-width=".8"/><circle cx="322" cy="99" r="5" fill="#fff" stroke="#555" stroke-width=".8"/><circle cx="244" cy="110" r="5" fill="#fff" stroke="#555" stroke-width=".8"/><circle cx="256" cy="110" r="5" fill="#333" stroke="#555" stroke-width=".8"/><circle cx="268" cy="110" r="5" fill="#fff" stroke="#555" stroke-width=".8"/><circle cx="280" cy="110" r="5" fill="#333" stroke="#555" stroke-width=".8"/><circle cx="292" cy="110" r="5" fill="#fff" stroke="#555" stroke-width=".8"/><circle cx="304" cy="110" r="5" fill="#333" stroke="#555" stroke-width=".8"/><circle cx="316" cy="110" r="5" fill="#fff" stroke="#555" stroke-width=".8"/><circle cx="246" cy="34" r="5" fill="none" stroke="#888" stroke-dasharray="2 1.5"/><path d="M241 58 l10 10 M251 58 l-10 10" stroke="#C0392B" stroke-width="1.6"/><circle cx="270" cy="34" r="5" fill="#fff" stroke="#555" stroke-width=".9"/><line x1="267" y1="86" x2="267.0" y2="49.0" stroke="#2B6CB0" stroke-width="1.1"/><path d="M267 44 L269.8 49.0 L264.2 49.0 Z" fill="#2B6CB0"/><line x1="273" y1="44" x2="273.0" y2="81.0" stroke="#2B6CB0" stroke-width="1.1"/><path d="M273 86 L270.2 81.0 L275.8 81.0 Z" fill="#2B6CB0"/><circle cx="294" cy="34" r="5" fill="none" stroke="#888" stroke-dasharray="2 1.5"/><path d="M289 58 l10 10 M299 58 l-10 10" stroke="#C0392B" stroke-width="1.6"/><circle cx="318" cy="34" r="5" fill="#fff" stroke="#555" stroke-width=".9"/><line x1="315" y1="86" x2="315.0" y2="49.0" stroke="#2B6CB0" stroke-width="1.1"/><path d="M315 44 L317.8 49.0 L312.2 49.0 Z" fill="#2B6CB0"/><line x1="321" y1="44" x2="321.0" y2="81.0" stroke="#2B6CB0" stroke-width="1.1"/><path d="M321 86 L318.2 81.0 L323.8 81.0 Z" fill="#2B6CB0"/><text class="sm2" x="60" y="14" text-anchor="middle" style="font-size:9px;font-weight:700;fill:#222">純水</text><text class="sm2" x="280" y="14" text-anchor="middle" style="font-size:9px;font-weight:700;fill:#222">水溶液</text><line x1="118" y1="70" x2="217.0" y2="70.0" stroke="#444" stroke-width="1.3"/><path d="M222 70 L217.0 72.8 L217.0 67.2 Z" fill="#444"/><text class="sm2" x="170" y="48" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#222">不揮発性溶質（●）の</text><text class="sm2" x="170" y="59" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#222">モル分率⬆</text><text class="sm2" x="170" y="86" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#555">気体になりにくい</text><text class="sm2" x="60" y="134" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#222">蒸発と凝縮が平衡</t     <p class="small muted">蒸発しにくい → 沸騰しにくい → 沸点⬆</p></section>
    <section class="panel"><h3>〇 沸点上昇</h3>
    <p>溶質を少量添加した溶液は、もとの純溶媒よりも気体に<b>なりにくい</b>。<br>→ 溶媒Aに不揮発性物質Bを溶かした溶液の沸点は、もとの溶媒の沸点より<b>高く</b>なる。</p>
    <p class="fx"><b>ΔT<sub>b</sub>＝i・K<sub>b</sub>・M</b></p>
    <p class="small muted">ΔT<sub>b</sub>：沸点上昇度・K<sub>b</sub>：モル沸点上昇定数（溶媒固有の値）・i：van&#39;t Hoff係数・M：モル濃度（mol/L）</p>
    <p class="small muted">K<sub>b</sub>はK<sub>f</sub>とは異なる値 → 沸点上昇度ΔT<sub>b</sub>≠凝固点降下度ΔT<sub>f</sub></p></section>
    <section class="panel"><h3>〇 凝固点降下</h3>
    <p>溶媒Aに不揮発性物質Bを溶かした溶液の凝固点は、もとの溶媒の凝固点より<b>低く</b>なる。<br>凝固点降下度ΔT<sub>f</sub>は、溶質の<b>質量モル濃度</b> m（mol/kg）に比例。</p>
    <p class="fx"><b>ΔT<sub>f</sub>＝i・K<sub>f</sub>・m</b></p>
    <p class="small muted">希薄水溶液では溶媒1 kg≒1 L → 質量モル濃度 m（mol/kg）≒モル濃度 M（mol/L）</p>
    <p class="fx"><b>ΔT<sub>f</sub>＝i・K<sub>f</sub>・M</b></p>
    <p>・<b>モル凝固点降下定数 K<sub>f</sub></b>：ΔT<sub>f</sub>と m（M）を関係づける比例定数。<b>溶媒</b>固有の定数。</p>
    <p>・<b>van&#39;t Hoff係数 i</b>：解離に起因する係数。溶解による<b>溶質粒子数の増加率</b>を表す。</p>
    <p class="fx"><b>i＝1＋（n−1）α</b></p>
    <p class="small muted">n：電離により生じるイオンの数・α：電離度</p>
    ${ktbl([['非電解質','イオン形には解離しない → <b>i＝1</b>'],['電解質','イオン形に解離する → 解離度αを導入<br>例）一塩基性酸：i＝1＋α']]).replace('tbl ktbl','tbl ktbl kw')}
    <p class="small muted">例）NaCl：完全解離 α＝1、n＝2（Na<sup>+</sup>・Cl<sup>−</sup>）→ i＝2</p>
    <p class="small muted">水 0℃・等張液 −0.52℃</p></section>
    <section class="panel"><h3>〇 浸透圧上昇</h3>
    <p>溶質を通さない<b>半透膜</b>を隔てて濃度の異なる液体が存在<br>→ 両側の液相の濃度を均一にしようと、<b>溶媒</b>が濃度の<b>低い方から高い方</b>へ移動＝<b>浸透</b>。</p>

" stroke-dasharray="4 3"/><circle cx="296" cy="72" r="3.4" fill="#333"/><circle cx="316" cy="68" r="3.4" fill="#333"/><circle cx="306" cy="88" r="3.4" fill="#333"/><circle cx="322" cy="98" r="3.4" fill="#333"/><circle cx="294" cy="100" r="3.4" fill="#333"/><circle cx="314" cy="82" r="3.4" fill="#333"/><rect x="288" y="30" width="39" height="6" fill="#888"/><line x1="307" y1="6" x2="307.0" y2="23.0" stroke="#444" stroke-width="1.6"/><path d="M307 29 L303.7 23.0 L310.3 23.0 Z" fill="#444"/><line x1="106" y1="66" x2="115.0" y2="66.0" stroke="#444" stroke-width="1.1"/><path d="M120 66 L115.0 68.8 L115.0 63.2 Z" fill="#444"/><line x1="220" y1="66" x2="229.0" y2="66.0" stroke="#444" stroke-width="1.1"/><path d="M234 66 L229.0 68.8 L229.0 63.2 Z" fill="#444"/><text class="sm2" x="32" y="128" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#222">溶媒</text><text class="sm2" x="80" y="128" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#222">溶液</text><text class="sm2" x="56" y="142" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#222">溶質（●）を通さない半透膜</text><line x1="56" y1="134" x2="56" y2="114" stroke="#888" stroke-width=".7"/><text class="sm2" x="170" y="128" text-anchor="middle" style="font-size:8px;font-weight:700;fill:#C0392B">浸透（自発的）</text><text class="sm2" x="170" y="140" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#222">溶媒：低濃度 → 高濃度</text><text class="sm2" x="266" y="12" text-anchor="end" style="font-size:8px;font-weight:700;fill:#222">浸透圧</text><text class="sm2" x="284" y="128" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#222">浸透を阻止できる</text><text class="sm2" x="284" y="140" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#222">だけの圧力</text></svg>
    <p class="small muted">溶質がある濃い方が安定</p>
    <p>電解質希薄水溶液の<b>浸透圧（Π）</b>は、浸透を阻止できるだけの圧力に相当。</p>
    <p class="fx"><b>Π＝i・M・R・T</b></p>
    <p class="small muted">ファントホッフの式・M：溶液のモル濃度・R：気体定数・T：絶対温度</p>
    <p class="small muted">単位：J/L＝<span class="frac"><span>N・m</span><span>10<sup>−3</sup> m<sup>3</sup></span></span>＝10<sup>3</sup>×N・m<sup>−2</sup>＝Pa</p>

    <p>M⬆ → Π⬆（濃度が高いほど浸透圧⬆）</p>

  { id:'7-0', t:'パーキンソン病', sub:'パーキンソン病（PD）・四徴候', plan:['pd1','pd1','pd1','pd1','pd1'], body:()=>`
    <section class="panel"><h3>〇 パーキンソン病（PD）</h3>

;font-weight:400;fill:#222">B</text><text class="sm2" x="250" y="180" text-anchor="middle" style="font-size:7.5px;font-weight:400;fill:#666">不活化</text><rect x="170.3" y="186" width="59.4" height="14" rx="3" fill="#FBE3E0"/><text class="sm2" x="200.0" y="196" text-anchor="middle" style="font-size:7.5px;font-weight:700;fill:#C0392B">セレギリンなど</text><line x1="232" y1="190" x2="247" y2="150" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="3 2"/><line x1="250.7" y1="151.4" x2="243.3" y2="148.6" stroke="#C0392B" stroke-width="2"/></svg>

  { id:'7-2', t:'抗パーキンソン病薬②', sub:'ドパミン前駆体・DAアゴニスト・COMT阻害薬・MAO-B阻害薬・DA遊離促進薬', plan:['pd3','pd3','pd3','pd3','pd3'], body:()=>`

    <p>DA自体は血液脳関門を通過しない<br>→ 前駆体のレボドパを投与し、脳内でDAに変換させてDAを<b>補充</b>する。</p>

    <p class="small muted">LAT1（能動輸送）でBBBを通過・タンパク質と競合 → 食後は吸収⬇</p>
    <p class="small muted">レボドパの突然の中断 → 悪性症候群に注意</p>
    <p><b>※ ドパ脱炭酸酵素阻害薬（DCI）</b></p>
    <p><span class="dg">カルビドパ</span>、<span class="dg">ベンセラジド</span></p>
    <p>末梢性芳香族<b>L-アミノ酸脱炭酸酵素</b>（デカルボキシラーゼ）<b>阻害薬</b><br>→ レボドパの末梢での脱炭酸を阻害<br>→ レボドパの<b>中枢移行量⬆</b></p>

    <section class="panel"><h3>〇 ドパミンアゴニスト</h3>

    <p><b>D<sub>2</sub>受容体</b>を直接<b>刺激</b>。</p>

    <p><b>D<sub>2</sub>受容体</b>を直接<b>刺激</b>。</p>
    <p>〈警告〉<b>前兆のない突発的睡眠</b>及び<b>傾眠</b>等が見られることがある（プラミペキソール、ロピニロール）。</p>
