    ${ktbl([['動脈血液ガス分析','動脈血を採取し、PaO<sub>2</sub>・PaCO<sub>2</sub>を<b>直接測定</b>'],['パルスオキシメータ','指先の光の透過で<b>SpO<sub>2</sub></b>を測定']]).replace('tbl ktbl','tbl ktbl kw')}
    <p class="small muted">血液ガス分析では pH・HCO₃⁻・ブドウ糖・Hbなども同時に測定可能</p></section>
    <section class="panel"><h3>〇 PaO<sub>2</sub></h3>
    <p>動脈血酸素分圧。<br>動脈血中に溶け込んだO<sub>2</sub>の圧。</p>
    <p>基準値：<b>80〜100 Torr</b></p>
    <p class="small muted">年齢で⬇<br>60 Torr以下 → 呼吸不全</p></section>
    <section class="panel"><h3>〇 PaCO<sub>2</sub></h3>
    <p>動脈血二酸化炭素分圧。<br>換気の指標。</p>
    <p>基準値：<b>35〜45 Torr</b></p>
    ${ktbl([['PaCO<sub>2</sub>⬆','換気⬇（肺胞低換気）<br>→ 呼吸性アシドーシス'],['PaCO<sub>2</sub>⬇','換気⬆（過換気）<br>→ 呼吸性アルカローシス']]).replace('tbl ktbl','tbl ktbl kw')}</section>
    <section class="panel"><h3>※ SpO<sub>2</sub></h3>
    <p>経皮的動脈血酸素飽和度。<br><b>パルスオキシメータ</b>で測定。</p>
    <p>酸化Hbと還元Hbの光の透過性の違い<br>→ 存在比から酸素飽和度を算出</p>
    <p>基準値：<b>95〜100%</b></p>
    <svg class="fig" viewBox="0 0 340 204" role="img" aria-label="酸素解離曲線。横軸PaO2、縦軸SaO2・SpO2のS字曲線。SpO2 90%はPaO2 60 Torrに対応し呼吸不全の目安。SpO2基準値は95〜100%"><rect x="50.0" y="20.0" width="260.0" height="7.5" fill="#D6F0F5"/><text x="54.0" y="26.2" text-anchor="start" style="font-size:6.5px;font-weight:400;fill:#2A7A8C">SpO₂ 基準 95〜100%</text><path d="M50.0 170.0 H316.0 M50.0 170.0 V14.0" stroke="#222" stroke-width="1.2" fill="none"/><path d="M50.0 170.0 L52.6 170.0 L55.2 169.9 L57.8 169.6 L60.4 169.1 L63.0 168.4 L65.6 167.5 L68.2 166.2 L70.8 164.6 L73.4 162.7 L76.0 160.4 L78.6 157.8 L81.2 154.9 L83.8 151.7 L86.4 148.2 L89.0 144.5 L91.6 140.6 L94.2 136.6 L96.8 132.4 L99.4 128.1 L102.0 123.8 L104.6 119.5 L107.2 115.2 L109.8 111.0 L112.4 106.8 L115.0 102.8 L117.6 98.8 L120.2 95.0 L122.8 91.3 L125.4 87.8 L128.0 84.4 L130.6 81.2 L133.2 78.1 L135.8 75.2 L138.4 72.4 L141.0 69.7 L143.6 67.3 L146.2 64.9 L148.8 62.7 L151.4 60.6 L154.0 58.6 L156.6 56.7 L159.2 54.9 L161.8 53.2 L164.4 51.7 L167.0 50.2 L169.6 48.8 L172.2 47.4 L174.8 46.2 L177.4 45.0 L180.0 43.9 L182.6 42.8 L185.2 41.8 L187.8 40.9 L190.4 40.0 L193.0 39.2 L195.6 38.4 L198.2 37.6 L200.8 36.9 L203.4 36.2 L206.0 35.6 L208.6 35.0 L211.2 34.4 L213.8 33.8 L216.4 33.3 L219.0 32.8 L221.6 32.3 L224.2 31.9 L226.8 31.4 L229.4 31.0 L232.0 30.6 L234.6 30.3 L237.2 29.9 L239.8 29.6 L242.4 29.3 L245.0 28.9 L247.6 28.6 L250.2 28.4 L252.8 28.1 L255.4 27.8 L258.0 27.6 L260.6 27.3 L263.2 27.1 L265.8 26.9 L268.4 26.7 L271.0 26.5 L273.6 26.3 L276.2 26.1 L278.8 25.9 L281.4 25.8 L284.0 25.6 L286.6 25.4 L289.2 25.3 L291.8 25.1 L294.4 25.0 L297.0 24.9 L299.6 24.7 L302.2 24.6 L304.8 24.5 L307.4 24.4 L310.0 24.2" stroke="#2C3E8C" stroke-width="2" fill="none"/><path d="M50.0 35.6 H206.0 V170.0" stroke="#C0392B" stroke-width="1" stroke-dasharray="3 2" fill="none"/><circle cx="206.0" cy="35.6" r="3" fill="#C0392B"/><text x="46.0" y="173.0" text-anchor="end" style="font-size:7px;font-weight:400;fill:#222">0</text><text x="46.0" y="98.0" text-anchor="end" style="font-size:7px;font-weight:400;fill:#222">50</text><text x="46.0" y="23.0" text-anchor="end" style="font-size:7px;font-weight:400;fill:#222">100</text><text x="46.0" y="38.0" text-anchor="end" style="font-size:7.5px;font-weight:700;fill:#C0392B">90</text><text x="50.0" y="181.0" text-anchor="middle" style="font-size:7px;font-weight:400;fill:#222">0</text><text x="310.0" y="181.0" text-anchor="middle" style="font-size:7px;font-weight:400;fill:#222">100</text><text x="206.0" y="181.0" text-anchor="middle" style="font-size:7.5px;font-weight:700;fill:#C0392B">60</text><text x="180.0" y="194.0" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#222">PaO₂（Torr）</text><text transform="translate(16 95.0) rotate(-90)" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#222">SaO₂・SpO₂（%）</text><text x="221.6" y="51.6" text-anchor="start" style="font-size:7.5px;font-weight:700;fill:#C0392B">SpO₂ 90% ≒ PaO₂ 60 Torr</text><text x="221.6" y="61.6" text-anchor="start" style="font-size:7px;font-weight:400;fill:#C0392B">＝呼吸不全の目安</text></svg>
    <p>酸素解離曲線から、SpO<sub>2</sub>とPaO<sub>2</sub>は一方から他方を推測できる。</p>
    <p><b>SpO<sub>2</sub> 90% ≒ PaO<sub>2</sub> 60 Torr</b></p>
    <p class="small muted">SaO<sub>2</sub>：動脈血液ガス分析のPaO<sub>2</sub>から計算した値<br>SpO<sub>2</sub>：パルスオキシメータの値<br>→ 区別する</p>
    <p class="small muted">誤差の原因：マニキュア・血流⬇・貧血・多血症・一酸化炭素中毒（異常Hb）</p></section>` },
  { id:'1-2', t:'スパイロメトリー', sub:'肺気量分画・フローボリューム曲線・ピークフローメータ', plan:['rspi','rspi','rspi','rspi','rspi'], body:()=>`

ne"/><text x="243.0" y="141.0" text-anchor="start" style="font-size:7.5px;font-weight:700;fill:#222">ERV</text><path d="M237 169 H240 V203 H237" stroke="#777" stroke-width="1" fill="none"/><text x="243.0" y="189.0" text-anchor="start" style="font-size:7.5px;font-weight:700;fill:#777">RV</text><path d="M263 29 H266 V107 H263" stroke="#6C3483" stroke-width="1" fill="none"/><text x="269.0" y="71.0" text-anchor="start" style="font-size:7.5px;font-weight:700;fill:#6C3483">IC</text><path d="M263 109 H266 V203 H263" stroke="#777" stroke-width="1" fill="none"/><text x="269.0" y="159.0" text-anchor="start" style="font-size:7.5px;font-weight:700;fill:#777">FRC</text><path d="M289 29 H292 V167 H289" stroke="#C0392B" stroke-width="1" fill="none"/><text x="295.0" y="101.0" text-anchor="start" style="font-size:7.5px;font-weight:700;fill:#C0392B">VC</text><path d="M313 29 H316 V203 H313" stroke="#777" stroke-width="1" fill="none"/><text x="319.0" y="119.0" text-anchor="start" style="font-size:7.5px;font-weight:700;fill:#777">TLC</text><text x="252.0" y="16.0" text-anchor="middle" style="font-size:6.5px;font-weight:400;fill:#555">volume</text><text x="304.0" y="16.0" text-anchor="middle" style="font-size:6.5px;font-weight:400;fill:#555">capacity</text></svg>
    ${tbl(['','',''],[['<b>IRV</b>','予備吸気量',''],['<b>TV</b>','1回換気量',''],['<b>ERV</b>','予備呼気量',''],['<b>RV</b>','残気量','測定不可'],['<b>IC</b>','最大吸気量','IRV＋TV'],['<b>FRC</b>','機能的残気量','ERV＋RV'],['<b>VC</b>','肺活量','IRV＋TV＋ERV'],['<b>TLC</b>','全肺気量','VC＋RV']]).replace('<tr><th></th><th></th><th></th></tr>','')}
    <p>残気量：限界まで吐いても肺に残る空気<br>→ スパイロメトリーでは<b>測定できない</b></p>
    <p class="small muted">吸気肺活量：吐ききってから限界まで吸ったとき<br>呼気肺活量：限界まで吸ってから吐ききったとき</p>
    <p class="small muted">閉塞性換気障害では吸気肺活量＞呼気肺活量 → 両方測定し大きい値を採用</p></section>
    <section class="panel"><h3>〇 フローボリューム曲線</h3>
    <p>努力呼出曲線をもとに描く。<br>縦軸：気流速度（L/秒）<br>横軸：肺気量（L）</p>

;fill:#555">最大吸気位</text><text x="290.0" y="171.0" text-anchor="middle" style="font-size:6.5px;font-weight:400;fill:#555">最大呼気位</text><text transform="translate(40 86) rotate(-90)" text-anchor="middle" style="font-size:8px;font-weight:700;fill:#222">呼気気流速度（V̇）</text><text x="232.5" y="70.0" text-anchor="middle" style="font-size:7px;font-weight:700;fill:#A04000">努力性呼気</text></svg>
    ${ktbl([['ピークフロー<br>（PEF）','呼気気流速度の<b>最大値</b><br>⬇ → <b>中枢</b>気道の閉塞性変化・肺活量⬇'],['V̇₅₀','努力肺活量の<b>50%</b>を呼出した瞬間の呼気気流速度'],['V̇₂₅','努力肺活量の<b>75%</b>を呼出した瞬間の呼気気流速度<br>⬇ → <b>末梢</b>気道の閉塞性変化']]).replace('tbl ktbl','tbl ktbl kw')}
    <p>V̇₅₀・V̇₂₅⬇は1秒率⬇より<b>鋭敏</b><br>→ <b>早期</b>の閉塞性換気障害の発見</p></section>
    <section class="panel"><h3>※ ピークフローメータ</h3>
    <p>PEF値を測定する器具。<br>自宅・外出先で<b>患者自身</b>が測定可能。</p>

    <div class="scroll"><table class="tbl radt" style="min-width:640px"><tr><th>種類</th><th>単純拡散</th><th>促進拡散</th><th>能動輸送</th><th>膜動輸送</th></tr><tr><td><b>基質</b></td><td>多くの薬物</td><td>グルコース（GLUT）<br>セファレキシン<br>リボフラビン</td><td>グルコース（SGLT）<br><span class="small muted">Na⁺と共輸送</span></td><td>タンパク質などの高分子物質や微粒子<br><span class="small muted">例）パイエル板</span></td></tr><tr><td><b>濃度勾配</b></td><td>従う<br><span class="small muted">高濃度→低濃度</span></td><td>従う</td><td>逆らうことができる</td><td>逆らうことがある</td></tr><tr><td><b>エネルギー</b></td><td>利用しない</td><td>利用しない</td><td>利用する</td><td>利用する<br><span class="small muted">膜の形を変えるのに必要</span></td></tr><tr><td><b>担体</b></td><td>利用しない</td><td colspan="2">利用する<br><span class="small muted">数に限りがある → 飽和が起こる</span></td><td>—</td></tr><tr><td><b>特徴</b></td><td>・Fickの法則に従う<br>膜透過速度は濃度勾配・分配係数に比例、膜の厚さに反比例<br>V＝<span class="frac"><span>D・A・K</span><span>h</span></span>・(C<sub>in</sub>−C<sub>out</sub>)<br><span class="small muted">D：拡散係数、A：有効表面積、K：分配係数、h：膜の厚さ</span><br>・pH分配仮説に従う<br>分子形の割合や脂溶性が高い薬物ほど透過しやすい</td><td colspan="2">・担体を利用する<br>濃度が上がると担体が飽和し、基質が数種類あると競合阻害が起こる<br>・Michaelis-Menten式に従う<br>V＝<span class="frac"><span>V<sub>max</sub>・C</span><span>K<sub>m</sub>＋C</span></span><br><span class="small muted">V：透過速度、V<sub>max</sub>：最大透過速度、C：薬物濃度、K<sub>m</sub>：ミカエリス定数（V<sub>max</sub>の1/2の速度での基質濃度）<br>C≪K<sub>m</sub>：VはCに比例<br>C≫K<sub>m</sub>：VはCによらず一定（V<sub>max</sub>）</span></td><td>・エンドサイトーシス：細胞の外側から内側へ<br><span class="small muted">食作用：比較的大きな粒子（1 μm以上）を取り込む<br>飲作用：小さな粒子や液状物質を取り込む</span><br>・エキソサイトーシス：細胞の内側から外側へ</td></tr></table></div>

    <section class="panel"><h3>〇 単純拡散</h3>
    <p>濃度勾配（電気化学ポテンシャル差）を駆動力とする生体膜透過機構。<br>物質は濃度の高い側から低い側へ、拡散によって膜を通過する。<br>脂溶性薬物・分子形薬物が膜透過しやすい。</p>
    <p><b>・特徴</b></p>
    <p>①ほとんどの薬物は単純拡散で膜透過する。<br>②濃度勾配に従い、ATPの加水分解エネルギーを利用しない。<br>③Fickの法則に従う。<br>　→ 濃度勾配に比例<br>　→ 膜の厚さに反比例<br>　→ 膜／溶媒間の分配係数に比例<br>④膜透過性の予測にpH分配仮説が適用できる。<br>⑤低分子量の薬物ほど膜透過しやすい。<br>⑥担体を介さないため、飽和現象や構造類似体による競合は見られない。</p></section>
    <section class="panel"><h3>〇 pH分配仮説</h3>
    <p>弱酸性・弱塩基性薬物は、溶液中で分子形とイオン形に分かれる。<br>脂質二重膜を通過できるのは<b>分子形</b>だけで、イオン形は通過しにくい。<br>→ 膜透過性は、そのpHでの分子形の割合（分子形分率）で決まる。</p>

    <section class="panel"><h3>〇 能動輸送</h3>
    <p>濃度勾配（電気化学ポテンシャル差）に<b>逆らう</b>ことができる生体膜透過機構。<br>トランスポーター（担体）を介して、アミノ酸・糖・ビタミンなどの生体内必須物質や一部の薬物の膜透過に寄与する。</p>
    <svg class="fig" viewBox="0 0 340 136" role="img" aria-label="能動輸送。トランスポーターを介して、低濃度側から高濃度側へ物質を運ぶ"><circle cx="154" cy="10" r="3.3" fill="#8FB9A8"/><circle cx="186" cy="10" r="3.3" fill="#8FB9A8"/><line x1="158" y1="9" x2="168" y2="9" stroke="#B9A6C9" stroke-width=".8"/><line x1="158" y1="11" x2="168" y2="11" stroke="#B9A6C9" stroke-width=".8"/><line x1="172" y1="9" x2="182" y2="9" stroke="#B9A6C9" stroke-width=".8"/><line x1="172" y1="11" x2="182" y2="11" stroke="#B9A6C9" stroke-width=".8"/><circle cx="154" cy="19" r="3.3" fill="#8FB9A8"/><circle cx="186" cy="19" r="3.3" fill="#8FB9A8"/><line x1="158" y1="18" x2="168" y2="18" stroke="#B9A6C9" stroke-width=".8"/><line x1="158" y1="20" x2="168" y2="20" stroke="#B9A6C9" stroke-width=".8"/><line x1="172" y1="18" x2="182" y2="18" stroke="#B9A6C9" stroke-width=".8"/><line x1="172" y1="20" x2="182" y2="20" stroke="#B9A6C9" stroke-width=".8"/><circle cx="154" cy="28" r="3.3" fill="#8FB9A8"/><circle cx="186" cy="28" r="3.3" fill="#8FB9A8"/><line x1="158" y1="27" x2="168" y2="27" stroke="#B9A6C9" stroke-width=".8"/><line x1="158" y1="29" x2="168" y2="29" stroke="#B9A6C9" stroke-width=".8"/><line x1="172" y1="27" x2="182" y2="27" stroke="#B9A6C9" stroke-width=".8"/><line x1="172" y1="29" x2="182" y2="29" stroke="#B9A6C9" stroke-width=".8"/><circle cx="154" cy="37" r="3.3" fill="#8FB9A8"/><circle cx="186" cy="37" r="3.3" fill="#8FB9A8"/><line x1="158" y1="36" x2="168" y2="36" stroke="#B9A6C9" stroke-width=".8"/><line x1="158" y1="38" x2="168" y2="38" stroke="#B9A6C9" stroke-width=".8"/><line x1="172" y1="36" x2="182" y2="36" stroke="#B9A6C9" stroke-width=".8"/><line x1="172" y1="38" x2="182" y2="38" stroke="#B9A6C9" stroke-width=".8"/><circle cx="154" cy="82" r="3.3" fill="#8FB9A8"/><circle cx="186" cy="82" r="3.3" fill="#8FB9A8"/><line x1="158" y1="81" x2="168" y2="81" stroke="#B9A6C9" stroke-width=".8"/><line x1="158" y1="83" x2="168" y2="83" stroke="#B9A6C9" stroke-width=".8"/><line x1="172" y1="81" x2="182" y2="81" stro     <p><b>・特徴</b></p>
    <p>①生体内必須物質（アミノ酸、糖、ビタミンなど）は、一般に能動輸送で膜透過する。<br>②トランスポーター介在性の輸送で、膜透過速度はMichaelis-Menten式で表される。<br>③ATPの加水分解エネルギーを必要とし、濃度勾配に逆らって輸送できる。<br>④トランスポーターの数は有限 → 濃度が上がると<b>飽和現象</b>が見られる。<br>⑤同じトランスポーターで運ばれる物質が複数あると、互いに影響し合う（<b>競合阻害</b>）。</p>
    <p><b>・Michaelis-Menten式</b></p>
    <p>V＝<span class="frac"><span>V<sub>max</sub>・C</span><span>K<sub>m</sub>＋C</span></span></p>
    <p class="small muted">C：膜表面での物質濃度、V<sub>max</sub>：最大膜透過速度、K<sub>m</sub>：Michaelis定数（VがV<sub>max</sub>/2になるときの物質濃度）</p>

><tspan dy="-2">/2</tspan></text><text class="sm2" x="73.4" y="163" text-anchor="middle" style="font-size:10px;font-weight:700;fill:var(--ink)">K<tspan font-size="7" dy="2">m</tspan></text><text class="sm2" x="320" y="163" text-anchor="end" style="font-size:10px;font-weight:700;fill:var(--ink)">C</text><text class="sm2" x="50" y="18" text-anchor="start" style="font-size:10px;font-weight:700;fill:var(--ink)">V</text><text class="sm2" x="87.1" y="125.63636363636364" text-anchor="start" style="font-size:9px;font-weight:700;fill:#2E8BC9">C≪Km：VはCに比例</text><text class="sm2" x="320.0" y="62.29090909090911" text-anchor="end" style="font-size:9px;font-weight:700;fill:#2E8BC9">C≫Km：Vは一定（≒Vmax）</text></svg>

    <section class="panel"><h3>〇 一次性能動輸送</h3>
    <p>ATPの加水分解エネルギーを<b>直接</b>利用して、トランスポーターで物質を運ぶ能動輸送。<br>ATPは細胞内にあるため、薬物の移動は通常、細胞内 → 細胞外の一方向。</p>

    <section class="panel"><h3>〇 二次性能動輸送</h3>
    <p>一次性能動輸送でできたH⁺やNa⁺の濃度勾配を駆動力として物質を運ぶ能動輸送（ATPの加水分解エネルギーを<b>間接</b>利用）。<br>イオンと<b>同じ向き</b>に運ぶ＝<b>共輸送</b><br>イオンと<b>反対向き</b>に運ぶ＝<b>逆輸送</b>（交換輸送）</p>

  { id:'1-4', t:'促進拡散', sub:'特徴', plan:['facd','facd','facd','facd','facd'], body:()=>`
    <section class="panel"><h3>〇 促進拡散</h3>
    <p>単純拡散と同じく濃度勾配（電気化学ポテンシャル差）を駆動力とするが、<b>トランスポーターを介して</b>物質を運ぶ生体膜透過機構。<br>小腸上皮細胞の側底膜、赤血球、骨格筋、脂肪細胞、血液脳関門など、血液側に面した細胞膜でのアミノ酸や単糖類の輸送にみられる。</p>
    <svg class="fig" viewBox="0 0 340 136" role="img" aria-label="促進拡散。トランスポーターを介して、高濃度側から低濃度側へ物質を運ぶ"><circle cx="154" cy="10" r="3.3" fill="#8FB9A8"/><circle cx="186" cy="10" r="3.3" fill="#8FB9A8"/><line x1="158" y1="9" x2="168" y2="9" stroke="#B9A6C9" stroke-width=".8"/><line x1="158" y1="11" x2="168" y2="11" stroke="#B9A6C9" stroke-width=".8"/><line x1="172" y1="9" x2="182" y2="9" stroke="#B9A6C9" stroke-width=".8"/><line x1="172" y1="11" x2="182" y2="11" stroke="#B9A6C9" stroke-width=".8"/><circle cx="154" cy="19" r="3.3" fill="#8FB9A8"/><circle cx="186" cy="19" r="3.3" fill="#8FB9A8"/><line x1="158" y1="18" x2="168" y2="18" stroke="#B9A6C9" stroke-width=".8"/><line x1="158" y1="20" x2="168" y2="20" stroke="#B9A6C9" stroke-width=".8"/><line x1="172" y1="18" x2="182" y2="18" stroke="#B9A6C9" stroke-width=".8"/><line x1="172" y1="20" x2="182" y2="20" stroke="#B9A6C9" stroke-width=".8"/><circle cx="154" cy="28" r="3.3" fill="#8FB9A8"/><circle cx="186" cy="28" r="3.3" fill="#8FB9A8"/><line x1="158" y1="27" x2="168" y2="27" stroke="#B9A6C9" stroke-width=".8"/><line x1="158" y1="29" x2="168" y2="29" stroke="#B9A6C9" stroke-width=".8"/><line x1="172" y1="27" x2="182" y2="27" stroke="#B9A6C9" stroke-width=".8"/><line x1="172" y1="29" x2="182" y2="29" stroke="#B9A6C9" stroke-width=".8"/><circle cx="154" cy="37" r="3.3" fill="#8FB9A8"/><circle cx="186" cy="37" r="3.3" fill="#8FB9A8"/><line x1="158" y1="36" x2="168" y2="36" stroke="#B9A6C9" stroke-width=".8"/><line x1="158" y1="38" x2="168" y2="38" stroke="#B9A6C9" stroke-width=".8"/><line x1="172" y1="36" x2="182" y2="36" stroke="#B9A6C9" stroke-width=".8"/><line x1="172" y1="38" x2="182" y2="38" stroke="#B9A6C9" stroke-width=".8"/><circle cx="154" cy="82" r="3.3" fill="#8FB9A8"/><circle cx="186" cy="82" r="3.3" fill="#8FB9A8"/><line x1="158" y1="81" x2="168" y2="81" stroke="#B9A6C9" stroke-width=".8"/><line x1="158" y1="83" x2="168" y2="83" stroke="#B9A6C9" stroke-width=".8"/><line x1="172" y1="81" x2="182" y2="81" stro ><circle cx="262" cy="60" r="4.5" fill="#C77DB8" stroke="var(--ink)" stroke-width=".6"/><text class="sm2" x="90" y="100" text-anchor="middle" style="font-size:9px;font-weight:400;fill:var(--ink)">高濃度</text><text class="sm2" x="262" y="100" text-anchor="middle" style="font-size:9px;font-weight:400;fill:var(--ink)">低濃度</text><text class="sm2" x="170" y="128" text-anchor="middle" style="font-size:9.5px;font-weight:700;fill:var(--ink)">濃度勾配に従って輸送（ATP不要）</text></svg>
    <p><b>・特徴</b></p>
    <p>①生体内必須物質（アミノ酸、糖、ビタミンなど）は促進拡散で膜透過する。<br>②トランスポーター介在性の輸送で、膜透過速度はMichaelis-Menten式で表される。<br>③濃度勾配に<b>従い</b>、ATPの加水分解エネルギーを<b>必要としない</b>。<br>④トランスポーターの数は有限 → 濃度が上がると<b>飽和現象</b>が見られる。<br>⑤同じトランスポーターで運ばれる物質が複数あると、互いに影響し合う（<b>競合阻害</b>）。</p>
    <p class="small muted">例）GLUT（グルコース）、セファレキシン、リボフラビン</p></section>` },

  { id:'3-2', t:'消化管吸収', sub:'消化管の構造・小腸における薬物吸収', plan:['gia','gia','gia','gia','gia'], body:()=>`
    <section class="panel"><h3>〇 消化管の構造と薬物吸収</h3>
    <p>消化管は、食道から肛門まで続く。<br>胃・小腸・大腸では、食物などの消化と吸収が行われる。<br>胃は吸収性が劣るが、酸性薬物は比較的よく吸収される。<br>小腸は十二指腸・空腸・回腸から成り、絨毛が発達しているため<b>吸収面積が大きい</b> → 多くの薬物は主に<b>小腸</b>から吸収される。<br>大腸は盲腸・結腸・直腸から成る。消化作用はほとんどなく、主に水分の吸収を行う（pH 7〜8）。</p>
    <svg class="fig" viewBox="0 0 340 288" role="img" aria-label="消化管の構造と薬物吸収。食道、胃（pH1〜3.5）、十二指腸（pH5〜7）、空腸・回腸、大腸（pH7〜8）、直腸の順。多くの薬物は小腸から吸収される"><rect x="6" y="6" width="74" height="30" rx="8" fill="#EDE3C8" stroke="var(--ink)" stroke-width="1"/><text class="sm2" x="43" y="25.0" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#222">食道</text><text class="sm2" x="90" y="20" text-anchor="start" style="font-size:9px;font-weight:400;fill:var(--ink)">・粘膜は重層扁平上皮細胞から成る</text><line x1="43" y1="36" x2="43.0" y2="40.0" stroke="var(--ink)" stroke-width="1.2"/><path d="M43 46 L40.0 40.0 L46.0 40.0 Z" fill="var(--ink)"/><rect x="6" y="46" width="74" height="50" rx="8" fill="#D7DDF0" stroke="var(--ink)" stroke-width="1"/><text class="sm2" x="43" y="69.0" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#222">胃</text><text class="sm2" x="43" y="82.0" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#D9534F">pH 1〜3.5</text><text class="sm2" x="90" y="60" text-anchor="start" style="font-size:9px;font-weight:400;fill:var(--ink)">・粘膜は単層円柱上皮細胞から成る</text><text class="sm2" x="90" y="74" text-anchor="start" style="font-size:9px;font-weight:400;fill:var(--ink)">・ペプシンでタンパク質をペプチドに分解</text><text class="sm2" x="90" y="88" text-anchor="start" style="font-size:9px;font-weight:400;fill:var(--ink)">・食後はpH 3〜5に上昇</text><line x1="43" y1="96" x2="43.0" y2="100.0" stroke="var(--ink)" stroke-width="1.2"/><path d="M43 106 L40.0 100.0 L46.0 100.0 Z" fill="var(--ink)"/><rect x="6" y="106" width="74" height="30" rx="8" fill="#E6D4E8" stroke="var(--ink)" stroke-width="1"/><text class="sm2" x="43" y="119.0" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#222">十二指腸</text><text class="sm2" x="43" y="132.0" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#D9534F">pH 5〜7</text><text class="sm2" x="90" y="120" text-anchor="start" style="font-size:9px;font-weight:400;fill:var(--ink)">・胆汁・膵液でビタミンAや油状物質の吸収を促進</text><line x1="43" y1="136" x2="43.0" y2="140.0" stroke="var(--ink)" stroke-width="1.2"/><path d="M43 146 L40.0 140.0 L46.0 140.0 Z" fill="var(--ink)"/><rect x="6" y="146" width="74" height="50" rx="8" fill="#E6D4E8" stroke="var(--ink)" stroke-width="1"/><text class="sm2" x="43" y="175.0" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#222">空腸・回腸</text><text class="sm2" x="90" y="160" text-anchor="start" style="font-size:9px;font-weight:400;fill:var(--ink)">・絨毛が発達 → 吸収面積が大きい</text><text class="sm2" x="90" y="174" text-anchor="start" style="font-size:9px;font-weight:400;fill:var(--ink)">・多くの薬物は主に小腸から吸収</text><text class="sm2" x="90" y="188" text-anchor="start" style="font-size:9px;font-weight:400;fill:var(--ink)">・抗菌薬や高分子は吸収されにくい</text><text class="sm2" x="43" y="145" text-anchor="middle" style="font-size:8px;font-weight:400;fill:var(--ink)"></text><line x1="43" y1="196" x2="43.0" y2="200.0" stroke="var(--ink)" stroke-width="1.2"/><path d="M43 206 L40.0 200.0 L46.0 200.0 Z" fill="var(--ink)"/><rect x="6" y="206" width="74" height="36" rx="8" fill="#E8DCC8" stroke="var(--ink)" stroke-width="1"/><text class="sm2" x="43" y="222.0" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#222">大腸</text><text class="sm2" x="43" y="235.0" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#D9534F">pH 7〜8</text><text class="sm2" x="90" y="220" text-anchor="start" style="font-size:9px;font-weight:400;fill:var(--ink)">・水分の吸収</text><text class="sm2" x="90" y="234" text-anchor="start" style="font-size:9px;font-weight:400;fill:var(--ink)">・輪状ひだ・絨毛がなく吸収面積が小さい</text><line x1="43" y1="242" x2="43.0" y2="246.0" stroke="var(--ink)" stroke-width="1.2"/><path d="M43 252 L40.0 246.0 L46.0 246.0 Z" fill="var(--ink)"/><rect x="6" y="252" width="74" height="30" rx="8" fill="#E8DCC8" stroke="var(--ink)" stroke-width="1"/><text class="sm2" x="43" y="271.0" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#222">直腸</text><text class="sm2" x="90" y="266" text-anchor="start" style="font-size:9px;font-weight:400;fill:var(--ink)">・中部・下部は門脈系の支配を受けない</text></svg>
    <p><b>・初回通過効果</b></p>
    <p>小腸や大腸上部から吸収された薬物は、全身循環に入る前に門脈を経由して肝臓に送られる。<br>全身循環に入る前に、消化管上皮細胞や肝臓で代謝を受ける現象＝<b>初回通過効果</b></p>
    <p><b>・胃内容排出</b></p>
    ${ktbl([['抑制する薬物','イミプラミン、モルヒネ、プロパンテリン'],['促進する薬物','メトクロプラミド']])}</section>
    <section class="panel"><h3>〇 小腸における薬物吸収</h3>
    <p>小腸には<b>輪状ひだ</b>があり、その表面は<b>絨毛</b>で覆われている。<br>絨毛の表面は1層の小腸上皮細胞で覆われ、その管腔側は<b>微絨毛</b>が密に詰まった<b>刷子縁膜</b>となっている。<br>刷子縁膜は脂質二重層から成り、さまざまな機能をもつタンパク質（トランスポーターなど）が存在する。</p>
    <img class="goro-img" src="goro/si_struct.png" alt="小腸の構造。小腸の内面には輪状ひだがあり、その表面は絨毛で覆われる。絨毛の内部には毛細血管と中心乳び管があり、表面は吸収上皮細胞（管腔側に微絨毛）で覆われる。粘膜の下には粘膜筋板・リンパ管・動脈・静脈がある" loading="lazy">
    <p class="small muted">小腸を単純な円筒としたときの内面積を1とすると、微絨毛の存在により表面積は約600倍に増加する。</p></section>` },
  { id:'3-3', t:'消化管吸収に影響する因子', sub:'非攪拌水層・胃内容排出速度（GER）・食事の影響', plan:['gfx','gfx','gfx','gfx','gfx'], body:()=>`
    <section class="panel"><h3>〇 非攪拌水層</h3>
    <p>腸管表面近傍に存在する、<b>十分に撹拌されない水の層</b>＝<b>非攪拌水層</b>。<br>薬物は非攪拌水層を拡散 → 消化管粘膜を透過 → 血管へ移行。</p>
    <svg class="fig" viewBox="0 0 340 170" role="img" aria-label="非攪拌水層拡散過程と消化管粘膜透過過程の模式図。消化管管腔、非攪拌水層、消化管粘膜、血管の順。脂溶性薬物は膜透過しやすく非攪拌水層を通りにくいため拡散律速、水溶性薬物は膜透過しにくいため膜透過律速"><rect x="112" y="24" width="50" height="140" fill="#D5E6F3"/><line x1="112" y1="24" x2="112" y2="164" stroke="#6B8FB0" stroke-width="1" stroke-dasharray="3 2"/><path d="M162 24 Q178 31 162 38 Q178 45 162 52 Q178 59 162 66 Q178 73 162 80 Q178 87 162 94 Q178 101 162 108 Q178 115 162 122 Q178 129 162 136 Q178 143 162 150 Q178 157 162 164 L252 164 L252 24 Z" fill="#F1DBC5" stroke="#8C6A4A" stroke-width="1.1"/><rect x="268" y="24" width="50" height="140" fill="#F3CACA"/><line x1="268" y1="24" x2="268" y2="164" stroke="#B04040" stroke-width="1.2"/><line x1="318" y1="24" x2="318" y2="164" stroke="#B04040" stroke-width="1.2"/><text class="sm2" x="58" y="16" text-anchor="middle" style="font-size:9px;font-weight:700;fill:var(--ink)">消化管管腔</text><text class="sm2" x="137" y="16" text-anchor="middle" style="font-size:9px;font-weight:700;fill:var(--ink)">非攪拌水層</text><text class="sm2" x="207" y="16" text-anchor="middle" style="font-size:9px;font-weight:700;fill:var(--ink)">消化管粘膜</text><text class="sm2" x="293" y="16" text-anchor="middle" style="font-size:9px;font-weight:700;fill:var(--ink)">血管</text><line x1="8" y1="94" x2="332" y2="94" stroke="var(--ink)" stroke-width=".7" stroke-dasharray="4 3" opacity=".6"/><text class="sm2" x="58" y="40" text-anchor="middle" style="font-size:9.5px;font-weight:700;fill:var(--ink)">脂溶性薬物</text><circle cx="20" cy="50" r="3" fill="#E08A3C"/><circle cx="34" cy="62" r="3" fill="#E08A3C"/><circle cx="48" cy="52" r="3" fill="#E08A3C"/><circle cx="62" cy="64" r="3" fill="#E08A3C"/><circle cx="76" cy="54" r="3" fill="#E08A3C"/><circle cx="26" cy="72" r="3" fill="#E08A3C"/><circle cx="54" cy="74" r="3" fill="#E08A3C"/><circle cx="70" cy="72" r="3" fill="#E08A3C"/><text class="sm2" x="58" y="88" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#D9534F">＝拡散律速</text><line x1="98" y1="62" x2="153.0" y2="62.0" stroke="#444" stroke-width="1.1" stroke-dasharray="3 2.5"/><path d="M160 62 L153.0 65.6 L153.0 58.4 Z" fill="#444"/><line x1="176" y1="62" x2="257.0" y2="62.0" stroke="#444" stroke-width="2.6"/><path d="M264 62 L257.0 65.6 L257.0 58.4 Z" fill="#444"/><rect x="114" y="48" width="46" height="28" rx="4" fill="none" stroke="#D9534F" stroke-width="1.6"/><text class="sm2" x="137" y="87" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#222">通りにくい</text><text class="sm2" x="214" y="54" text-anchor="middle" style="font-size:8.5px;font-weight:400;fill:#222">膜透過しやすい</text><text class="sm2" x="58" y="110" text-anchor="middle" style="font-size:9.5px;font-weight:700;fill:var(--ink)">水溶性薬物</text><circle cx="20" cy="120" r="3" fill="#4A90C8"/><circle cx="34" cy="132" r="3" fill="#4A90C8"/><circle cx="48" cy="122" r="3" fill="#4A90C8"/><circle cx="62" cy="134" r="3" fill="#4A90C8"/><circle cx="76" cy="124" r="3" fill="#4A90C8"/><circle cx="26" cy="142" r="3" fill="#4A90C8"/><circle cx="54" cy="144" r="3" fill="#4A90C8"/><circle cx="70" cy="142" r="3" fill="#4A90C8"/><text class="sm2" x="58" y="158" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#D9534F">＝膜透過律速</text><line x1="98" y1="132" x2="153.0" y2="132.0" stroke="#444" stroke-width="2.6"/><path d="M160 132 L153.0 135.6 L153.0 128.4 Z" fill="#444"/><line x1="176" y1="132" x2="257.0" y2="132.0" stroke="#444" stroke-width="1.1" stroke-dasharray="3 2.5"/><path d="M264 132 L257.0 135.6 L257.0 128.4 Z" fill="#444"/><rect x="156" y="118" width="26" height="28" rx="4" fill="none" stroke="#D9534F" stroke-width="1.6"/><text class="sm2" x="222" y="124" text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:#222">膜透過しにくい</text></svg>
    ${ktbl([['脂溶性薬物', '膜透過しやすい<br>→ 非攪拌水層を通りにくい<br>→ <b>拡散律速</b>'], ['水溶性薬物', '膜透過しにくい<br>→ <b>膜透過律速</b>']])}
    <p>非攪拌水層内の拡散は、一般に<b>分子量が小さいほど速い</b>。<br>腸管腔内に排出されたH⁺（プロトン）が非攪拌水層内に滞留<br>→ プロトン勾配を駆動力とするトランスポーターの吸収に寄与。</p></section>
    <section class="panel"><h3>〇 胃内容排出速度（GER）</h3>
    <p>経口投与した薬物が胃を通過して小腸に到達する速度＝<b>胃内容排出速度（GER）</b>。<br>多くの薬物は主に小腸で吸収 → GERは吸収に影響する。</p>
    <p><b>・GERの変動要因</b></p>
    ${tbl(['','GER⬆','GER⬇'],[['食事','空腹時（食前）','食後'],['薬物','<b>抗ドパミン薬</b><br>例）<span class="dg">メトクロプラミド</span>、<span class="dg">ドンペリドン</span><br>→ 抗ドパミン作用<br>→ 副交感神経⬆<br>→ 胃の蠕動運動⬆<br><br><b>5-HT<sub>4</sub>受容体刺激薬</b><br>例）<span class="dg">モサプリド</span><br>→ AChの遊離⬆<br>→ 胃の蠕動運動⬆','<b>抗コリン作用をもつ薬物</b><br><span class="small muted">（抗コリン薬）</span><br><span class="dg">プロパンテリン</span>、<span class="dg">アトロピン</span><br><span class="small muted">（抗ヒスタミン薬）</span><br><span class="dg">ジフェンヒドラミン</span><br><span class="small muted">（抗うつ薬）</span><br><span class="dg">イミプラミン</span>、<span class="dg">クロミプラミン</span><br>→ 抗コリン作用<br>→ 副交感神経⬇<br>→ 胃の蠕動運動⬇<br><br><b>麻薬</b><br><span class="dg">モルヒネ</span>']])}
    <p class="small muted">ドパミン：AChの遊離を抑えて胃腸運動を抑制・ACh：胃腸運動を促進</p></section>
    <section class="panel"><h3>〇 食事により吸収の影響を受ける薬物</h3>
    <p><b>・単純拡散で吸収される薬物</b></p>
    ${ktbl([['例', '<span class="dg">アセトアミノフェン</span>、<span class="dg">セファクロル</span>'], ['食後', 'GER⬇<br>→ 吸収が<b>遅延</b>']])}
    <p><b>・能動輸送で吸収される薬物</b></p>
    <p class="small muted">小腸上部の局所でトランスポーターを介して吸収</p>
    ${ktbl([['例', '<span class="dg">リボフラビン</span>'], ['空腹時', 'GER⬆<br>→ 短時間に多くの薬物が吸収部位に到達<br>→ トランスポーターが<b>飽和</b><br>→ 吸収量⬇'], ['食後', 'GER⬇<br>→ 徐々に吸収部位へ送り込まれる<br>→ 吸収量⬆']])}
    <p><b>覚え方</b></p><img class="goro-img" src="goro/absdiff.png" alt="単純拡散・能動輸送の消化管吸収の覚え方。リボの納期にアセった。リボ＝リボフラビン、納＝能動輸送、ア＝アセトアミノフェン、セ＝セファクロル、た＝単純拡散" loading="lazy">
    <p><b>・難溶性薬物</b></p>
    ${ktbl([['例', '<span class="dg">シクロスポリン</span>、<span class="dg">インドメタシン ファルネシル</span>、<span class="dg">フェニトイン</span>、<span class="dg">グリセオフルビン</span>、<span class="dg">イトラコナゾール</span>、脂溶性ビタミン、<span class="dg">イコサペント酸エチル</span>'], ['食後', '食事（特に高脂肪食）<br>→ 胆汁の分泌⬆<br>→ 胆汁酸の界面活性作用で薬物の溶解性が改善<br>→ 吸収量⬆']])}
    <p><b>・初回通過効果を大きく受ける薬物</b></p>
    ${ktbl([['例', '<span class="dg">プロプラノロール</span>'], ['食後', '食事により血流量⬆<br>→ 初回通過効果を受ける割合⬇<br>→ 吸収⬆']])}
    <p><b>・腸管局所作用を期待して使用される抗菌薬</b></p>
    ${ktbl([['例', 'アミノグリコシド系、グリコペプチド系（<span class="dg">バンコマイシン</span>）'], ['特徴', '消化管からほとんど吸収されない<br>→ 局所作用・腸内細菌の抑制を目的に経口投与']])}
    <p class="small muted">バンコマイシンの経口投与：感染性腸炎の治療目的</p></section>` },
  { id:'3-4', t:'吸収に影響する製剤的要因', sub:'溶解速度に影響する要因', plan:['gfp','gfp','gfp','gfp','gfp'], body:()=>`
    <section class="panel"><h3>〇 製剤的要因</h3>
    <p>固体の薬物は<b>溶解してはじめて吸収</b>される。<br>→ 水に難溶性の薬物などでは、<b>溶解速度</b>が吸収に影響する。</p>
    <p><b>・溶解速度に影響する要因</b></p>
    ${tbl(['要因','現象','薬物例'],[["粒子径", "粒子径が小さいほど比表面積⬆<br>→ 溶解速度⬆<br><span class=\"small muted\">比表面積：粉体の単位質量あたりの表面積</span>", "<span class=\"dg\">ジゴキシン</span><br><span class=\"dg\">クロラムフェニコール</span>"], ["結晶多形", "化学組成が同じでも結晶形が異なるもの＝<b>結晶多形</b><br>準安定形は安定形よりエネルギー状態が高い<br>→ 溶解速度が大きい<br><span class=\"small muted\">準安定形＞安定形</span>", "<span class=\"dg\">クロラムフェニコールパルミチン酸エステル</span><br><span class=\"dg\">インドメタシン</span><br><span class=\"dg\">プレドニゾロン</span>"], ["無晶形", "無晶形は結晶より溶解速度が大きい<br><span class=\"small muted\">無晶形＞結晶形</span>", "<span class=\"dg\">インスリン</span>"], ["溶媒和", "水分子を伴って結晶化したもの＝<b>水和物</b><br>一般に無水物のほうが溶解速度が大きい<br><span class=\"small muted\">無水物＞水和物</span>", "<span class=\"dg\">アンピシリン</span><br><span class=\"dg\">カフェイン</span><br><span class=\"dg\">テオフィリン</span>"], ["塩", "酸性薬物のアルカリ塩やアミン塩、塩基性薬物の無機酸塩や有機酸塩は溶解速度が大きい<br><span class=\"small muted\">酸性薬物は塩基と、塩基性薬物は酸と塩をつくる（逆になる）</span>", "<span class=\"dg\">テトラサイクリン塩酸塩</span><br><span class=\"dg\">ホスホマイシンナトリウム</span><br><span class=\"dg\">カナマイシン硫酸塩</span>"], ["固体分散体", "分散媒となる固体が速やかに溶け、薬物を分子状態で水中へ放出<br>→ 溶解速度⬆", "<span class=\"dg\">ニフェジピン</span>とポリビニルピロリドン（PVP）<br><span class=\"small muted\">アダラートL・CR錠</span>"], ["包接化合物", "シクロデキストリンなどのホスト分子中に薬物分子が包み込まれる<br>難溶性薬物の可溶化や油状物質の結晶化に利用", "<span class=\"dg\">アルプロスタジル アルファデクス</span><br><span class=\"small muted\">プロスタグランジンE₁とα-シクロデキストリン</span>"]]).replace('class="tbl"','class="tbl fpt"')}
    <p><b>固体分散体</b>：薬物を不活性な担体中に分子レベルで分散させた状態。<br>＝薬物と担体が固体状態で均一に混ざりあった状態。</p>
    <p class="small muted">例）アダラートL・CR錠：ニフェジピン（薬物）をポリビニルピロリドン（水溶性高分子の担体）中に分散</p></section>` },
  { id:'3-5', t:'非経口投与', sub:'非経口投与部位と特徴・リンパ管系への移行', plan:['gpar','gpar','gpar','gpar','gpar'], body:()=>`
    <section class="panel"><h3>〇 非経口投与</h3>
    <p>一般に、消化管以外からの薬物吸収は<b>単純拡散</b>に従い、<b>肝初回通過効果を回避</b>する。<br>ただし、<b>直腸上部</b>からの吸収は<b>門脈</b>を経由<br>→ 肝初回通過効果を受けることがある。</p>
    <p class="small muted">脳・胎盤への移行もおおむね単純拡散 → pH分配仮説が成立</p></section>
    <section class="panel"><h3>〇 非経口投与部位と特徴</h3>
    ${ktbl([["口腔粘膜", "<b>〈剤形〉</b>舌下錠（<span class=\"dg\">ニトログリセリン</span>、<span class=\"dg\">硝酸イソソルビド</span>）、バッカル錠"], ["直腸", "<b>〈剤形〉</b>坐剤<br><b>〈特徴〉</b><br>・直腸中・下部では肝初回通過効果を<b>回避</b>できる<br>・ただし、直腸<b>上部</b>からの吸収では肝初回通過効果を受けることがある"], ["鼻粘膜", "<b>〈剤形〉</b>点鼻剤（<span class=\"dg\">デスモプレシン</span>、<span class=\"dg\">ブセレリン</span>）<br><span class=\"small muted\">消化管よりもバリア能が低い</span>"], ["皮膚", "<b>〈剤形〉</b>軟膏剤、貼付剤<br><b>〈特徴〉</b><br>・<b>角質層</b>が主な経路（付属器官は有効面積が小さく、吸収の寄与は少ない）<br><span class=\"small muted\">角質層は硬いため障壁となる</span><br>・皮膚をフィルムで密封<br>→ 角質層が水和<br>→ 薬物の皮膚透過性⬆"], ["肺", "<b>〈剤形〉</b>吸入剤<br><b>〈特徴〉</b><br>・肺胞の上皮細胞（Ⅰ型肺胞上皮細胞）層は<b>薄い</b><br>→ 他の投与経路より<b>ペプチド製剤や高分子薬物</b>が吸収されやすい<br><span class=\"small muted\">表面積＝約200 m²（小腸上皮細胞に匹敵）・消化管に比べバリア能が低い</span><br>・吸収は通常、肺胞で行われる<br>・<b>最適粒子径（0.5〜1 µm）</b>が存在<br>0.5 µm以下の粒子は呼気中に排泄される"], ["注射部位<br><span class=\"small muted\">静脈内注射以外</span>", "<b>〈剤形〉</b>注射剤<br><b>〈特徴〉</b><br>・投与部位から組織内を拡散<br>→ 速やかに毛細血管に入る<br>・静注以外の注射時、<b>バイオアベイラビリティ</b>を用いて吸収性を表す"]])}</section>
    <section class="panel"><h3>〇 リンパ管系への移行</h3>
    <p>リンパ液の流速は、血流速度の<b>数百分の一</b>と遅い。</p>
    <p><b>① 筋肉内注射・皮下注射時</b></p>
    ${ktbl([['分子量<br>5,000以上','→ <b>リンパ管系</b>へ選択的に移行'],['分子量<br>5,000以下','→ <b>毛細血管</b>へ選択的に移行']])}
    <p class="small muted">分子量⬆ → リンパ系へ</p>
    <p><b>② 経口投与時</b></p>
    <p>ビタミンAなどの脂溶性物質<br>→ 細胞内で<b>キロミクロン</b>となる<br>→ <b>リンパ管系</b>へ移行<br>リンパ管系からの吸収は<b>肝初回通過効果を受けない</b>。</p></section>` },
  { id:'3-6', t:'吸収過程における相互作用', sub:'キレート形成・吸着・pH変動', plan:['gint','gint','gint','gint','gint'], body:()=>`
    <section class="panel"><h3>〇 難溶性複合体（キレート）形成</h3>
    <p>服用薬物が消化管内で併用薬物や飲食物成分と<b>難溶性複合体（キレート）</b>を形成<br>→ 薬物の吸収が阻害される場合がある。</p>
    <p class="small muted">例）テトラサイクリン系抗菌薬・ニューキノロン系抗菌薬は多価金属陽イオンとキレートを形成</p>
    <p><b>・キレート形成による吸収の変化</b></p>
    ${tbl(['薬物A','薬物B','相互作用'],[["テトラサイクリン系抗菌薬<br>ニューキノロン系抗菌薬<br>（<span class=\"dg\">ノルフロキサシン</span>、<span class=\"dg\">シプロフロキサシン</span>など）<br>ビスホスホネート製剤<br><span class=\"dg\">ペニシラミン</span>", "2価・3価金属カチオン<br><span class=\"small muted\">牛乳（Ca²⁺）、鉄剤（Fe²⁺）、制酸剤（Mg²⁺、Al³⁺）</span>", "難溶性のキレートを形成<br>→ Aの消化管吸収⬇<br>（作用減弱）"], ["<span class=\"dg\">セフジニル</span>", "鉄剤", "難溶性のキレートを形成<br>→ Aの消化管吸収⬇<br>（作用減弱）"], ["<span class=\"dg\">レボチロキシン</span>", "<span class=\"dg\">スクラルファート</span>", "金属イオンと消化管内で結合<br>→ Aの吸収阻害"], ["<span class=\"dg\">ペニシラミン</span>", "<span class=\"dg\">酢酸亜鉛</span>", "金属イオンとキレートを形成<br>→ Aの吸収阻害"]]).replace('class="tbl"','class="tbl fpt3"')}</section>
    <section class="panel"><h3>〇 吸着</h3>
    <p>吸着能を有する薬物と同時に他の薬物を服用<br>→ 消化管内で薬物が吸着剤に結合（主に<b>イオン結合</b>）<br>→ 消化管吸収⬇</p>
    <p class="small muted">例）陰イオン交換樹脂（コレスチラミン、コレスチミド）は陰イオン性薬物を吸着</p>
    <p><b>・吸着による吸収の変化</b></p>
    ${tbl(['薬物A','薬物B','相互作用'],[["アニオン性薬物<br>（<span class=\"dg\">ワルファリンカリウム</span>、<span class=\"dg\">プラバスタチンナトリウム</span>、<span class=\"dg\">レボチロキシンナトリウム</span>など）", "<span class=\"dg\">コレスチラミン</span><br><span class=\"small muted\">陰イオン交換樹脂</span>", "BがAを吸着<br>→ 吸収⬇<br>（作用減弱）"], ["Al・Mg・Ca含有製剤", "<span class=\"dg\">ポリスチレンスルホン酸ナトリウム</span><br><span class=\"small muted\">陽イオン交換樹脂</span>", "BがAを吸着<br>→ 吸収⬇<br>（作用減弱）"]]).replace('class="tbl"','class="tbl fpt3"')}
    <p class="small muted">アニオン性薬物：COOHなどをもち、O⁻・COO⁻となる</p></section>
    <section class="panel"><h3>〇 pH変動</h3>
    <p>pHの変動<br>→ 製剤（錠剤、カプセル剤、散剤など）の<b>崩壊性や溶解性</b>が変化。</p>
    <p class="small muted">例）イトラコナゾール錠：胃内pH⬆ → 胃内での錠剤の溶解性⬇ → 消化管吸収⬇</p>
    <p><b>・pHの変動による溶解性の変化</b></p>
    ${tbl(['薬物A','薬物B','相互作用'],[["<span class=\"dg\">イトラコナゾール</span><span class=\"small muted\">（錠剤など）</span><br><span class=\"dg\">ゲフィチニブ</span><span class=\"small muted\">（錠剤）</span><br><span class=\"dg\">エルロチニブ</span><span class=\"small muted\">（錠剤）</span>", "H<sub>2</sub>受容体遮断薬<br>（<span class=\"dg\">シメチジン</span>など）<br>プロトンポンプ阻害薬<br>（<span class=\"dg\">オメプラゾール</span>など）", "Bにより胃内pH⬆<br>→ Aの消化管内での溶解性⬇<br>→ 消化管吸収⬇"], ["<span class=\"dg\">イトラコナゾール</span><span class=\"small muted\">（錠剤など）</span>", "酸性飲料<br><span class=\"small muted\">ジュース、コーヒー、炭酸飲料</span>", "pH⬇<br>→ 溶解促進<br>→ 吸収⬆"]]).replace('class="tbl"','class="tbl fpt3"')}
    <p>また、<br>pHの変動<br>→ 消化液に溶解した弱酸性・弱塩基性薬物の<b>分子形とイオン形の比</b>が変化。<br>多くの薬物は消化管上皮細胞を単純拡散で通過<br>→ <b>分子形</b>の薬物が吸収されやすい。</p>
    <p><b>・pHの変動による吸収の変化</b></p>
    ${tbl(['薬物A','薬物B','相互作用'],[["<span class=\"dg\">ニコチン</span><span class=\"small muted\">（ガム剤）</span>", "酸性飲料<br><span class=\"small muted\">ジュース、コーヒー、炭酸飲料</span>", "口腔内pH⬇<br>→ ニコチン（弱塩基性）の吸収⬇"]]).replace('class="tbl"','class="tbl fpt3"')}</section>` }
];
const HS_LESSONS = [
  { id:'2-1', t:'保健統計の意義', sub:'集団の健康水準を数字でとらえる', plan:['hsmean','hsmean'], body:()=>`
    <section class="panel"><h3>なぜ保健統計が必要か</h3><p>健康を守るには、<b>地域や国などの集団</b>の健康状態を知る必要がある。<br>保健統計＝集団の<b>健康水準</b>をはかり、施策を決める土台。</p>
    ${tbl(['知りたいこと','使う統計'],[['集団の性別・年齢構成','人口静態統計、人口動態統計'],['病気や死亡の状況','死亡統計、疾病統計']])}

  { id:'col-world', col:true, t:'🍄 世界の人口の動向', sub:'先進国は減少、発展途上国は増加', plan:[], body:()=>`

    ${rule('先進国 → 人口減少　／　発展途上国 → 人口増加')}</section>` },
  { id:'2-3', t:'人口静態統計', sub:'ある時点の人口のすがた', plan:['hsstat','hsstat','hsstat','hsstat','hstype'], body:()=>`
    <section class="panel"><h3>人口静態統計とは</h3><p>ある一時点の人口の<b>規模</b>と<b>構成</b>（性・年齢・配偶関係・職業・世帯など）を調べた統計。代表は<b>国勢調査</b>。</p>

  { id:'2-4', t:'国勢調査', sub:'日本の人口静態統計', plan:['census','census','census','census'], body:()=>`
    <section class="panel"><h3>国勢調査のポイント</h3>${tbl(['項目','内容'],[['実施','総務省（統計局）'],['周期','5年ごと（西暦の末尾が0と5の年）'],['時点','10月1日午前0時現在'],['対象','日本に住むすべての人（外国人も含む）の全数調査'],['始まり','1920年（大正9年）'],['根拠','統計法（基幹統計）'],['調査項目','<b>世帯員</b>：氏名、男女の別、出生の年月、世帯主との続き柄、配偶の関係、国籍、就業状態、仕事の種類、従業地・通学地 など<br><b>世帯</b>：世帯の種類、世帯員の数、住居の種類、住宅の建て方 など'],['意義','人口と世帯の実態を明らかにする、もっとも基本的な統計。選挙区の区割り・地方交付税の算定などの行政の基礎資料や、人口推計・出生率などの分母になる']])}
    ${rule('国勢調査 ＝ 総務省・5年ごと・10月1日・全数')}</section>

  { id:'2-5', t:'人口ピラミッド・年齢三区分', sub:'ピラミッドの型・日本の人口ピラミッド・人口指数', plan:['pyr','pyr','pidx','pyr','pidx'], body:()=>`
    <section class="panel"><h3>人口ピラミッドの型</h3><p class="small muted">縦が年齢（上ほど高齢）、横が人口。左右に男女。</p><div class="ptypes"><figure><svg viewBox="0 0 100 100" aria-hidden="true"><rect class="pb" x="45.2" y="6" width="9.6" height="8" rx="1.5"/><rect class="pb" x="41.2" y="15" width="17.6" height="8" rx="1.5"/><rect class="pb" x="37.2" y="24" width="25.6" height="8" rx="1.5"/><rect class="pb" x="33.2" y="33" width="33.6" height="8" rx="1.5"/><rect class="pb" x="29.2" y="42" width="41.6" height="8" rx="1.5"/><rect class="pb" x="25.2" y="51" width="49.6" height="8" rx="1.5"/><rect class="pb" x="21.2" y="60" width="57.6" height="8" rx="1.5"/><rect class="pb" x="17.2" y="69" width="65.6" height="8" rx="1.5"/><rect class="pb" x="13.6" y="78" width="72.8" height="8" rx="1.5"/><rect class="pb" x="10.0" y="87" width="80.0" height="8" rx="1.5"/></svg><figcaption><b>ピラミッド型</b><span>多産多死。子どもが多く、人口が増える。発展途上国</span></figcaption></figure><figure><svg viewBox="0 0 100 100" aria-hidden="true"><rect class="pb" x="38.8" y="6" width="22.4" height="8" rx="1.5"/><rect class="pb" x="30.8" y="15" width="38.4" height="8" rx="1.5"/><rect class="pb" x="25.2" y="24" width="49.6" height="8" rx="1.5"/><rect class="pb" x="21.2" y="33" width="57.6" height="8" rx="1.5"/><rect class="pb" x="18.8" y="42" width="62.4" height="8" rx="1.5"/><rect class="pb" x="18.0" y="51" width="64.0" height="8" rx="1.5"/><rect class="pb" x="18.0" y="60" width="64.0" height="8" rx="1.5"/><rect class="pb" x="18.0" y="69" width="64.0" height="8" rx="1.5"/><rect class="pb" x="18.0" y="78" width="64.0" height="8" rx="1.5"/><rect class="pb" x="18.0" y="87" width="64.0" height="8" rx="1.5"/></svg><figcaption><b>釣鐘型</b><span>少産少死。人口がほぼ一定（静止型）</span></figcaption></figure><figure><svg viewBox="0 0 100 100" aria-hidden="true"><rect class="pb" x="38.8" y="6" width="22.4" height="8" rx="1.5"/><rect class="pb" x="30.8" y="15" width="38.4" height="8" rx="1.5"/><rect class="pb" x="25.2" y="24" width="49.6" height="8" rx="1.5"/><rect class="pb" x="20.4" y="33" width="59.2" height="8" rx="1.5"/><rect class="pb" x="17.2" y="42" width="65.6" height="8" rx="1.5"/><rect class="pb" x="15.6" y="51" width="68.8" height="8" rx="1.5"/><rect class="pb" x="18.0" y="60" width="64.0" height="8" rx="1.5"/><rect class="pb" x="22.8" y="69" width="54.4" height="8" rx="1.5"/><rect class="pb" x="26.8" y="78" width="46.4" height="8" rx="1.5"/><rect class="pb" x="30.0" y="87" width="40.0" height="8" rx="1.5"/></svg><figcaption><b>つぼ型</b><span>少産少死がさらに進み、子どもが少ない。人口が減る</span></figcaption></figure><figure><svg viewBox="0 0 100 100" aria-hidden="true"><rect class="pb" x="41.2" y="6" width="17.6" height="8" rx="1.5"/><rect class="pb" x="36.4" y="15" width="27.2" height="8" rx="1.5"/><rect class="pb" x="32.4" y="24" width="35.2" height="8" rx="1.5"/><rect class="pb" x="27.6" y="33" width="44.8" height="8" rx="1.5"/><rect class="pb" x="17.2" y="42" width="65.6" height="8" rx="1.5"/><rect class="pb" x="10.0" y="51" width="80.0" height="8" rx="1.5"/><rect class="pb" x="12.4" y="60" width="75.2" height="8" rx="1.5"/><rect class="pb" x="26.0" y="69" width="48.0" height="8" rx="1.5"/><rect class="pb" x="30.0" y="78" width="40.0" height="8" rx="1.5"/><rect class="pb" x="30.8" y="87" width="38.4" height="8" rx="1.5"/></svg><figcaption><b>星型</b><span>働く世代が多い。人が流れこむ都市にみられる</span></figcaption></figure></div></section>
    <section class="panel"><h3>日本の人口ピラミッド</h3><svg class="fig" viewBox="0 0 340 277" role="img" aria-label="日本の人口ピラミッド（2023年・概数）。つぼ型で、70代前半と50歳前後に2つのふくらみがある"><rect class="pm" x="95.5" y="242" width="52.5" height="11"/><rect class="pm" x="192" y="242" width="50.0" height="11"/><text class="mu" x="170" y="251" text-anchor="middle">0-4</text><rect class="pm" x="86.6" y="229" width="61.4" height="11"/><rect class="pm" x="192" y="229" width="58.6" height="11"/><rect class="pm" x="80.2" y="216" width="67.8" height="11"/><rect class="pm" x="192" y="216" width="64.7" height="11"/><text class="mu" x="170" y="225" text-anchor="middle">10-14</text><rect class="pw" x="77.6" y="203" width="70.4" height="11"/><rect class="pw" x="192" y="203" width="67.1" height="11"/><rect class="pw" x="68.6" y="190" width="79.4" height="11"/><rect class="pw" x="192" y="190" width="75.6" height="11"/><text class="mu" x="170" y="199" text-anchor="middle">20-24</text><rect class="pw" x="67.4" y="177" width="80.6" height="11"/><rect class="pw" x="192" y="177" width="76.9" height="11"/><rect class="pw" x="67.4" y="164" width="80.6" height="11"/><rect class="pw" x="192" y="164" width="76.9" height="11"/><text class="mu" x="170" y="173" text-anchor="middle">30-34</text><rect class="pw" x="58.4" y="151" width="89.6" height="11"/><rect class="pw" x="192" y="151" width="85.4" height="11"/><rect class="pw" x="48.2" y="138" width="99.8" height="11"/><rect class="pw" x="192" y="138" width="95.2" height="11"/><text class="mu" x="170" y="147" text-anchor="middle">40-44</text><rect class="pw" x="26.4" y="125" width="121.6" height="11"/><rect class="pw" x="192" y="125" width="115.9" height="11"/><rect class="pw" x="26.8" y="112" width="121.2" height="11"/><rect class="pw" x="192" y="112" width="118.8" height="11"/><text class="mu" x="170" y="121" text-anchor="middle">50-54</text><rect class="pw" x="44.2" y="99" width="103.8" height="11"/><rect class="pw" x="192" y="99" width="103.8" height="11"/><rect class="pw" x="56.4" y="86" width="91.6" height="11"/><rect class="pw" x="192" y="86" width="93.4" height="11"/><text class="mu" x="170" y="95" text-anchor="middle">60-64</text><rect class="po" x="57.1" y="73" width="90.9" height="11"/><rect class="po" x="192" y="73" width="96.6" height="11"/><rect class="po" x="42.2" y="60" width="105.8" height="11"/><rect class="po" x="192" y="60" width="119.2" height="11"/><text class="mu" x="170" y="69" text-anchor="middle">70-74</text><rect class="po" x="55.8" y="47" width="92.2" height="11"/><rect class="po" x="192" y="47" width="112.8" height="11"/><rect class="po" x="85.0" y="34" width="63.0" height="11"/><rect class="po" x="192" y="34" width="87.0" height="11"/><text class="mu" x="170" y="43" text-anchor="middle">80-84</text><rect class="po" x="112.0" y="21" width="36.0" height="11"/><rect class="po" x="192" y="21" width="64.0" height="11"/><rect class="po" x="131.8" y="8" width="16.2" height="11"/><rect class="po" x="192" y="8" width="48.8" height="11"/><text class="mu" x="170" y="17" text-anchor="middle">90+</text><text class="lb" x="316" y="69" style="font-size:12px">①</text><text class="lb" x="315" y="121" style="font-size:12px">②</text><text class="lb" x="144" y="269" text-anchor="end">男</text><text class="lb" x="196" y="269">女</text></svg><p class="small">① 第1次ベビーブーム（1947〜49年生まれ）<br>② 第2次ベビーブーム（1971〜74年生まれ）</p><div class="legend"><span><i class="pm"></i>年少人口（0〜14歳）</span><span><i class="pw"></i>生産年齢人口（15〜64歳）</span><span><i class="po"></i>老年人口（65歳以上）</span></div><p class="small muted">2023年10月1日現在の人口推計をもとにした概数のイメージ</p>
    ${tbl(['時期','形'],[['1950年ごろ','ピラミッド型（子どもが多い）'],['1970年代','釣鐘型に近づく'],['現在','つぼ型。第1次（1947〜49年生まれ）・第2次（1971〜74年生まれ）ベビーブームの2つのふくらみ']])}
    <div class="note-box panel"><p class="small"><b>※ 人口転換とは</b><br>社会の発展にともなって、人口のパターンが <b>多産多死 → 多産少死 → 少産少死</b> へと移り変わること。医療・衛生の向上でまず死亡が減り、遅れて出生も減る。日本は戦後、短期間でこの転換が進んだ。</p></div></section>
    <section class="panel"><h3>日本の人口 年次推移</h3><p>出生数は減り続け、合計特殊出生率は過去最低の水準。<br>死亡数は高齢化で増え、2005年に初めて<b>自然減</b>となり、2007年以降は自然減が続いている。</p></section>
    <section class="panel"><h3>年齢三区分と人口指数</h3>${tbl(['区分','年齢'],[['年少人口','0〜14歳'],['生産年齢人口','15〜64歳'],['老年人口','65歳以上']])}
    <div class="fx fxs"><div><span class="fn">年少人口指数</span><span>＝</span><span class="frac"><span>年少人口</span><span>生産年齢人口</span></span><span>× 100</span></div><div><span class="fn">老年人口指数</span><span>＝</span><span class="frac"><span>老年人口</span><span>生産年齢人口</span></span><span>× 100</span></div><div><span class="fn">従属人口指数</span><span>＝</span><span class="frac"><span>年少人口＋老年人口</span><span>生産年齢人口</span></span><span>× 100</span></div><div><span class="fn">老年化指数</span><span>＝</span><span class="frac"><span>老年人口</span><span>年少人口</span></span><span>× 100</span></div></div>
    <div class="rule steps"><b>高齢化率</b><span>7%　高齢化社会</span><i>⬇</i><span>14%　高齢社会</span><i>⬇</i><span>21%　超高齢社会</span></div>
    <div class="note-box panel"><p class="small"><b>※ 高齢化の原因</b><br>・老年人口の増加（寿命がのびた）<br>・年少人口の減少（出生率が下がった）</p>
    <p class="small"><b>※ 倍加年数とは</b><br>高齢化率が <b>7% から 14%</b> になるまでにかかった年数。高齢化の速さを表す。</p>
    ${tbl(['国','倍加年数'],[['日本','<b>24年</b>（1970年 → 1994年）'],['ドイツ','40年'],['スウェーデン','85年'],['フランス','115年']])}
    <p class="small muted">日本は欧米よりずっと速いスピードで高齢化が進みました。</p></div></section>` },
  { id:'2-6', t:'人口動態統計', sub:'出生・死亡・死産・婚姻・離婚', plan:['vit','vit','vit','mch','peri'], body:()=>`
    <section class="panel"><h3>人口動態統計とは</h3><p>ある<b>一定の期間内</b>（1月1日〜12月31日）に起きた事象の統計。<br><b>出生・死亡・婚姻・離婚・死産</b> の5つを、届出をもとに<b>厚生労働省</b>がまとめる。</p></section>
    <section class="panel"><h3>出生の指標</h3>
    <dl class="idx">
      <dt>出生率（粗出生率）</dt><dd>人口千人あたりの1年間の出生数。<div class="fxl">${fracHTML('出生数 ÷ 人口 × 1,000')}</div></dd>
      <dt>再生産率</dt><dd>母親の世代が、次の世代の母親をどれだけ生み出しているか（人口が置き換わる力）を表す指標のなかま。もとは年齢別出生率。<div class="fxl">年齢別出生率 ＝ <span class="frac"><span>母の年齢別出生数</span><span>年齢別女性人口</span></span></div></dd>
      <dt>合計特殊出生率</dt><dd>15〜49歳の女性の年齢別出生率を合計したもの。1人の女性が一生のあいだに産む子どもの数の平均にあたる。</dd>
      <dt>総再生産率</dt><dd>合計特殊出生率のうち、<b>女児だけ</b>について計算したもの（母親の死亡は考えない）。<div class="fxl">総再生産率 ＝ 合計特殊出生率 × <span class="frac"><span>女児出生数</span><span>総出生数</span></span></div></dd>
      <dt>純再生産率</dt><dd>総再生産率に、<b>母親の世代の死亡</b>（生命表の生存率）を考えたもの。<b>1</b>で人口が維持され、1を下回ると将来は人口が減る。</dd>
    </dl><p class="small muted">人口置換水準（人口が増えも減りもしない合計特殊出生率）はおよそ2.07。</p></section>
    <section class="panel"><h3>死亡の指標</h3>
    <dl class="idx">
      <dt>粗死亡率</dt><dd>人口千人あたりの1年間の死亡数。高齢者の多い集団ほど高く出る。<div class="fxl">${fracHTML('死亡数 ÷ 人口 × 1,000')}</div></dd>
      <dt>年齢調整死亡率</dt><dd>年齢構成のちがう集団を比べられるように、基準人口（平成27年モデル人口）の年齢構成にそろえて計算した死亡率。</dd>
      <dt>50歳以上死亡割合（PMI）</dt><dd>全死亡のうち50歳以上の死亡が占める割合。高いほど健康水準が高い。<div class="fxl">${fracHTML('50歳以上の死亡数 ÷ 全死亡数 × 100')}</div></dd>
    </dl></section>
    <section class="panel"><h3>母子保健の指標</h3>
    <dl class="idx">
      <dt>乳児死亡率</dt><dd>生後1年未満の死亡。<div class="fxl">${fracHTML('乳児死亡数 ÷ 出生数 × 1,000')}</div></dd>
      <dt>新生児死亡率</dt><dd>生後4週（28日）未満の死亡。<div class="fxl">${fracHTML('新生児死亡数 ÷ 出生数 × 1,000')}</div></dd>
      <dt>早期新生児死亡率</dt><dd>生後1週未満の死亡。<div class="fxl">${fracHTML('早期新生児死亡数 ÷ 出生数 × 1,000')}</div></dd>
    </dl>
    <div class="note-box panel"><p class="small"><b>※</b> 早期新生児 ▶ 生後〜1週未満<br>新生児 ▶ 生後〜4週未満<br>乳児 ▶ 生後〜1年未満</p></div>
    <dl class="idx">
      <dt>周産期死亡率</dt><dd>妊娠満22週以後の死産と早期新生児死亡を合わせたもの。<div class="fxl">${fracHTML('(満22週以後の死産数＋早期新生児死亡数) ÷ (出生数＋満22週以後の死産数) × 1,000')}</div></dd>
    </dl>
    <div class="note-box panel"><p class="small"><b>※</b> 周産期 ▶ 妊娠満22週以降（妊娠後期）＋ 生後1週未満（早期新生児）</p></div>
    <dl class="idx">
      <dt>死産率</dt><dd>妊娠満12週以後の死児の出産。分母は出産（出生＋死産）。<div class="fxl">${fracHTML('死産数 ÷ (出生数＋死産数) × 1,000')}</div></dd>
      <dt>妊産婦死亡率</dt><dd>妊娠中または分娩後42日未満の女性の死亡。数が少ないので10万対。<div class="fxl">${fracHTML('妊産婦死亡数 ÷ (出生数＋死産数) × 100,000')}</div></dd>
    </dl>
    <div class="note-box panel"><p class="small"><b>※</b> 妊産婦 ▶ 妊娠中 ＋ 分娩後42日未満の女性</p></div></section>
    <section class="panel"><h3>※ 母子保健統計における期間の定義</h3><svg class="fig period" viewBox="0 0 345 200" role="img" aria-label="母子保健統計の期間の定義。妊産婦は妊娠から分娩後42日未満、周産期は妊娠満22週から生後1週未満、死産は妊娠満12週以後、早期新生児は生後1週未満、新生児は4週未満、乳児は1年未満"><line x1="18" x2="18" y1="38" y2="194" stroke="var(--line)" stroke-width="1"/><line x1="66" x2="66" y1="38" y2="194" stroke="var(--line)" stroke-width="1"/><line x1="114" x2="114" y1="38" y2="194" stroke="var(--line)" stroke-width="1"/><line x1="166" x2="166" y1="38" y2="194" stroke="var(--line)" stroke-width="1"/><line x1="204" x2="204" y1="38" y2="194" stroke="var(--line)" stroke-width="1"/><line x1="246" x2="246" y1="38" y2="194" stroke="var(--line)" stroke-width="1"/><line x1="288" x2="288" y1="38" y2="194" stroke="var(--line)" stroke-width="1"/><line x1="330" x2="330" y1="38" y2="194" stroke="var(--line)" stroke-width="1"/><line class="tl" x1="10" x2="336" y1="38" y2="38"/><line class="tl" x1="18" x2="18" y1="30" y2="38"/><text class="mu" x="18" y="24" text-anchor="middle">妊娠</text><line class="tl" x1="66" x2="66" y1="30" y2="38"/><text class="mu" x="66" y="14" text-anchor="middle">満12週</text><line class="tl" x1="114" x2="114" y1="30" y2="38"/><text class="mu" x="114" y="24" text-anchor="middle">満22週</text><line class="tl" x1="166" x2="166" y1="30" y2="38"/><text class="mu" x="166" y="14" text-anchor="middle">出生</text><line class="tl" x1="204" x2="204" y1="30" y2="38"/><text class="mu" x="204" y="24" text-anchor="middle">1週</text><line class="tl" x1="246" x2="246" y1="30" y2="38"/><text class="mu" x="246" y="14" text-anchor="middle">4週</text><line class="tl" x1="288" x2="288" y1="30" y2="38"/><text class="mu" x="288" y="24" text-anchor="middle">42日</text><line class="tl" x1="330" x2="330" y1="30" y2="38"/><text class="mu" x="330" y="14" text-anchor="middle">1年</text><line class="wa" x1="18" x2="283" y1="58" y2="58"/><path class="ah wa" d="M288 58 l-7 -4 v8z"/><text class="lb" x="21" y="53" style="font-size:11px">妊産婦</text><line class="wa" x1="114" x2="199" y1="84" y2="84" style="stroke-dasharray:4 3"/><path class="ah wa" d="M204 84 l-7 -4 v8z"/><text class="lb" x="117" y="79" style="font-size:11px">周産期</text><line class="wm" x1="66" x2="161" y1="110" y2="110"/><path class="ah wm" d="M166 110 l-7 -4 v8z"/><text class="lb" x="69" y="105" style="font-size:11px">死産</text><line class="wl" x1="166" x2="199" y1="136" y2="136"/><path class="ah wl" d="M204 136 l-7 -4 v8z"/><text class="lb" x="169" y="131" style="font-size:11px">早期新生児</text><line class="wl" x1="166" x2="241" y1="162" y2="162"/><path class="ah wl" d="M246 162 l-7 -4 v8z"/><text class="lb" x="169" y="157" style="font-size:11px">新生児</text><line class="wl" x1="166" x2="325" y1="188" y2="188"/><path class="ah wl" d="M330 188 l-7 -4 v8z"/><text class="lb" x="169" y="183" style="font-size:11px">乳児</text></svg>
    ${rule('死産は「満12週以後」、周産期の死産は「満22週以後」')}</section>` },
  { id:'2-7', t:'人口予測', sub:'日本の将来推計人口', plan:['proj','proj','proj','proj','pyr'], body:()=>`
    <section class="panel"><h3>将来推計人口</h3><p><b>国立社会保障・人口問題研究所</b>が、国勢調査の人口をもとに、出生・死亡・国際人口移動について<b>中位・高位・低位</b>の仮定をおいて推計（5年ごと）。</p>

    if(P.U) y+=g(x,122,6,P.U);
    pts.push(`${x},${(BL-y).toFixed(1)}`);}
  const lab=(x,y,t)=>`<text x="${x}" y="${y}" font-size="9" font-weight="700" fill="#d9473f" text-anchor="middle">${t}</text>`;
  const extra=type==='hk'?lab(P.Tc,BL-P.Th-4,'T⬆'):type==='lk'?lab(122,BL-P.U-4,'U'):type==='hk2'?lab(24,BL-6,'P消失'):'';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:190px;margin:2px 0 6px;background:#fff;border-radius:6px" aria-hidden="true">${grid}<polyline points="${pts.join(' ')}" fill="none" stroke="#2b2f3a" stroke-width="1.6" stroke-linejoin="round"/>${extra}</svg>`;
};
const ischWave = (type) => {
  const W=150,H=80,BL=52;
  const g=(x,m,s,h)=>h*Math.exp(-0.5*((x-m)/s)**2);
  const P={qd:3,qw:3,r:30,st:0,Th:9,U:0,stShape:'flat'};
  if(type==='stup') Object.assign(P,{st:11,Th:6});
  if(type==='stdown') Object.assign(P,{st:-7,Th:4});
  if(type==='negT') Object.assign(P,{Th:-10});
  if(type==='q') Object.assign(P,{qd:15,qw:6,r:18});
  if(type==='negU') Object.assign(P,{U:-4.5});
  if(type==='bigU') Object.assign(P,{U:9,Th:5});
  if(type==='hyperT') Object.assign(P,{Th:20});
  if(type==='stupQ') Object.assign(P,{st:11,Th:6,qd:12,qw:6,r:20});
  if(type==='qnegT') Object.assign(P,{qd:15,qw:6,r:18,Th:-10});
  let grid='';for(let x=0;x<=W;x+=10)grid+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#f3d3d3" stroke-width="${x%50?0.5:1}"/>`;for(let y=2;y<=H;y+=10)grid+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#f3d3d3" stroke-width="${(y-2)%50?0.5:1}"/>`;
  const c=48, pts=[];
  for(let x=2;x<=W-2;x+=0.5){let y=g(x,24,4.5,4)+g(x,92,9,P.Th)+g(x,120,6,P.U);
    const d=x-c;
    if(d>=-P.qw-3&&d<-3) y+=-P.qd*Math.sin(Math.PI*(d+P.qw+3)/P.qw);
    else if(d>=-3&&d<0) y+=(d+3)/3*P.r;
    else if(d>=0&&d<3) y+=P.r-(d/3)*(P.r+5-P.st);
    else if(d>=3&&d<5) y+=-5+P.st+5*(d-3)/2;
    if(P.st&&d>=5&&x<106) y+=P.st*Math.min(1,(106-x)/18);
    pts.push(`${x},${(BL-y).toFixed(1)}`);}
  const base=`<line x1="0" y1="${BL}" x2="${W}" y2="${BL}" stroke="#7d8597" stroke-width=".7" stroke-dasharray="3 3"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:200px;margin:4px 0 6px;background:#fff;border-radius:6px" aria-hidden="true">${grid}${base}<polyline points="${pts.join(' ')}" fill="none" stroke="#2b2f3a" stroke-width="1.7" stroke-linejoin="round"/></svg>`;
};
const miniGrid=(W,H)=>{let s='';for(let x=0;x<=W;x+=10)s+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#f3d3d3" stroke-width="${x%50?0.5:1}"/>`;for(let y=0;y<=H;y+=10)s+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#f3d3d3" stroke-width="${y%50?0.5:1}"/>`;return s;};
const pWave = (type) => {
  const W=150,H=80,BL=56,g=(x,m,s,h)=>h*Math.exp(-0.5*((x-m)/s)**2),pts=[];
  for(let x=2;x<=W-2;x+=0.5){let y=0;
    if(type==='rap') y+=g(x,30,4,15); else if(type==='lap') y+=g(x,22,4,6)+g(x,36,4,6); else y+=g(x,30,5,5);
    const d=x-62; if(d>=-3&&d<0)y+=(d+3)/3*28; else if(d>=0&&d<3)y+=28-d/3*33; else if(d>=3&&d<5)y+=-5+5*(d-3)/2;
    y+=g(x,104,9,9); pts.push(`${x},${(BL-y).toFixed(1)}`);}
  const lab=type==='rap'?'<text x="30" y="13" font-size="9" font-weight="700" fill="#d9473f" text-anchor="middle">高く尖る</text>':type==='lap'?'<text x="34" y="13" font-size="9" font-weight="700" fill="#d9473f" text-anchor="middle">幅広く二峰性</text>':'<text x="30" y="13" font-size="9" font-weight="700" fill="#6b7285" text-anchor="middle">正常</text>';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:200px;margin:4px 0 6px;background:#fff;border-radius:6px" aria-hidden="true">${miniGrid(W,H)}<polyline points="${pts.join(' ')}" fill="none" stroke="#2b2f3a" stroke-width="1.7" stroke-linejoin="round"/>${lab}</svg>`;
};
const bbWave = (type, lead) => {
  const W=150,H=90,BL=55,g=(x,m,s,h)=>h*Math.exp(-0.5*((x-m)/s)**2);
  const Q={rV1:[[44,0],[47,7],[50,0],[54,-9],[58,0],[62,24],[67,8],[69,0]],rV6:[[44,0],[46,-2],[50,26],[54,0],[60,-10],[68,-3],[70,0]],
           lV1:[[44,0],[47,3],[52,-24],[57,-31],[63,-25],[70,0]],lV6:[[44,0],[50,22],[54,17],[59,25],[70,0]],
           nV1:[[44,0],[47,8],[51,-20],[55,0]],nV6:[[44,0],[45,-2],[49,26],[53,-4],[55,0]]}[type+lead];
  const Tsign={rV1:-1,rV6:1,lV1:1,lV6:-1,nV1:1,nV6:1}[type+lead];
  const qrs=x=>{for(let i=0;i<Q.length-1;i++){const[a,ya]=Q[i],[b,yb]=Q[i+1];if(x>=a&&x<=b)return ya+(yb-ya)*(x-a)/(b-a);}return 0;};
  const pts=[];for(let x=2;x<=W-2;x+=0.5){const y=g(x,24,4.5,4)+qrs(x)+Tsign*g(x,100,9,8);pts.push(`${x},${(BL-y).toFixed(1)}`);}
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:180px;margin:4px 0 2px;background:#fff;border-radius:6px" aria-hidden="true">${miniGrid(W,H)}<polyline points="${pts.join(' ')}" fill="none" stroke="#2b2f3a" stroke-width="1.7" stroke-linejoin="round"/><text x="6" y="12" font-size="10" font-weight="800" fill="#3a6fb8">${lead}</text></svg>`;
};
const arrStrip = (type) => {
  const W=320,H=74,BL=44,g=(x,m,s,h)=>h*Math.exp(-0.5*((x-m)/s)**2);
  const P=(x,c)=>g(x,c,3.2,4);
  const N=(x,c)=>{const d=x-c;let y=0;if(d>=-4&&d<-2)y=-(d+4);else if(d>=-2&&d<0)y=-2+(d+2)/2*28;else if(d>=0&&d<2)y=26-d/2*31;else if(d>=2&&d<4)y=-5+(d-2)/2*5;return y+g(x,c+22,5,6);};
  const Wd=(x,c,a=1)=>{const d=x-c;let y=0;if(d>=0&&d<6)y=d/6*24;else if(d>=6&&d<13)y=24-(d-6)/7*40;else if(d>=13&&d<19)y=-16+(d-13)/6*16;return a*y-a*g(x,c+33,8,8);};
  let ev=[],f=null,lab=[];
  const add=(t,x)=>ev.push([t,x]);
  if(type==='normal'){for(let k=0;k<5;k++){add('P',14+60*k);add('N',34+60*k);}}
  if(type==='stachy'){for(let x=22;x<W;x+=36){add('P',x-14);add('N',x);}}
  if(type==='sbrady'){[40,140,240].forEach(x=>{add('P',x-20);add('N',x);});}
  if(type==='apc'){[34,94].forEach(x=>{add('P',x-20);add('N',x);});add('Pa',122);add('N',136);[234,294].forEach(x=>{add('P',x-20);add('N',x);});lab=[[129,'早いP']];}
  if(type==='psvt'){for(let x=12;x<W;x+=24)add('N',x);}
  if(type==='av1'){[50,150,250].forEach(x=>{add('P',x-40);add('N',x);});}
  if(type==='arrest'){[34,94].forEach(x=>{add('P',x-20);add('N',x);});[254,314].forEach(x=>{add('P',x-20);if(x<W-4)add('N',x);});lab=[[164,'洞停止']];}
  if(type==='wpw'){[40,120,200,280].forEach(x=>{add('P',x-18);add('D',x);});lab=[[30,'Δ波']];}
  if(type==='lqt'){[34,154,274].forEach(x=>{add('P',x-20);add('L',x);});}
  if(type==='af'){[18,58,114,146,204,252,296].forEach(x=>add('N',x));f=x=>1.3*Math.sin(x*1.1)+0.9*Math.sin(x*1.9+1)+0.6*Math.sin(x*3.1);}
  if(type==='afl'){[30,78,126,174,222,270].forEach(x=>add('N',x));f=x=>{const p=((x+6)%12)/12;return 4-8*p;};}
  if(type==='pvc'){[34,94].forEach(x=>{add('P',x-20);add('N',x);});add('W',126);[214,274].forEach(x=>{add('P',x-20);add('N',x);});}
  if(type==='vt'){for(let x=8;x<W-10;x+=36)add('W',x);}
  if(type==='av2w'){const ps=[8,78,148,218,288],pr=[12,22,32,null,12];ps.forEach((x,i)=>{add('P',x);if(pr[i]!=null)add('N',x+pr[i]);});lab=[[218,'QRS脱落']];}
  if(type==='av2m'){const ps=[8,78,148,218,288];ps.forEach((x,i)=>{add('P',x);if(i!==2)add('N',x+20);});lab=[[148,'QRS脱落']];}
  if(type==='av3'){for(let x=8;x<W;x+=38)add('P',x);[44,140,236].forEach(x=>add('W',x,0.8));}
  const pts=[];
  for(let x=2;x<=W-2;x+=0.5){let y=0;
    if(type==='vf') y=9*Math.sin(x/5.2)+5*Math.sin(x/2.9+1)+3*Math.sin(x/1.7+2)*Math.sin(x/37);
    else if(type==='tdp') y=(6+15*Math.abs(Math.sin(x/46)))*Math.sin(x/4.6);
    else { for(const[t,c]of ev){ if(t==='P')y+=P(x,c); else if(t==='Pa')y-=P(x,c)*.9; else if(t==='N')y+=N(x,c); else if(t==='L')y+=N(x,c)-g(x,c+22,5,6)+g(x,c+52,9,6.5); else if(t==='D'){const d=x-c;if(d>=-12&&d<-3)y+=(d+12)/9*7;else if(d>=-3&&d<0)y+=7+(d+3)/3*19;else y+=d>=0?N(x,c):0;} else y+=Wd(x,c);} if(f)y+=f(x); }
    pts.push(`${x},${(BL-y).toFixed(1)}`);}
  let grid='';for(let x=0;x<=W;x+=10)grid+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#f3d3d3" stroke-width="${x%50?0.5:1}"/>`;for(let y=4;y<=H;y+=10)grid+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#f3d3d3" stroke-width="${(y-4)%50?0.5:1}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:460px;margin:6px auto;background:#fff;border-radius:8px" aria-hidden="true">${grid}<polyline points="${pts.join(' ')}" fill="none" stroke="#c0302a" stroke-width="1.6" stroke-linejoin="round"/>${lab.map(([x,t])=>t==='QRS脱落'?`<text x="${x}" y="${BL-10}" font-size="9" font-weight="800" fill="#3a6fb8" text-anchor="middle">P</text><text x="${x+22}" y="14" font-size="9.5" font-weight="800" fill="#3a6fb8" text-anchor="middle">${t}</text>`:`<text x="${x}" y="14" font-size="9.5" font-weight="800" fill="#3a6fb8" text-anchor="middle">${t}</text>`).join('')}</svg>`;
};

const ihdVessel = (type) => {
  const W=160,H=70;
  const wall='#f2c9cf', lum='#fbeef0';
  let mid='', top=`M0 14 H${W}`, bot=`M0 56 H${W}`;
  if(type==='spasm'){ top=`M0 14 Q${W/2} 34 ${W} 14`; bot=`M0 56 Q${W/2} 36 ${W} 56`; mid=`<path d="M60 6 l4 -4 l4 4 l4 -4 M90 6 l4 -4 l4 4 l4 -4 M60 66 l4 4 l4 -4 l4 4 M90 66 l4 4 l4 -4 l4 4" stroke="#e0a020" stroke-width="1.5" fill="none"/>`; }
  const plaque=`<path d="M48 56 Q80 30 112 56 Z" fill="#f4d77a" stroke="#d9b54a"/>`;
  const thr=(full)=>`<path d="${full?'M86 56 Q92 14 104 18 Q114 26 112 56 Z':'M84 47 Q90 28 104 30 Q113 38 111 52 Q96 54 84 47Z'}" fill="#7a2a2a"/>`;
  let flow=`<path d="M8 35 H${type==='ami'?63:150}" stroke="#c0305a" stroke-width="2.4" stroke-dasharray="${type==='ami'?'0':'6 4'}" fill="none"/>`+(type==='ami'?`<path d="M70 30 l-8 -5 v10Z" fill="#c0305a"/><path d="M74 24 l10 12 M84 24 l-10 12" stroke="#2b2f3a" stroke-width="2.4"/>`:`<path d="M150 35 l-8 -5 v10Z" fill="#c0305a"/>`);
  if(type==='stable'||type==='unstable'||type==='ami') mid+=plaque;
  if(type==='unstable') mid+=thr(false);
  if(type==='ami') mid+=thr(true);
  if(type!=='spasm') flow=flow.replace('M8 35','M8 30').replace(/35 l-8 -5 v10Z/,'30 l-8 -5 v10Z').replace('M150 35','M150 30');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:200px;margin:4px auto" aria-hidden="true">
  <rect width="${W}" height="${H}" fill="${lum}"/>
  <path d="${top} V0 H0Z" fill="${wall}"/><path d="${bot} V${H} H0Z" fill="${wall}"/>
  ${mid}${flow}</svg>`;
};
const LISCH_LESSONS = [

// 「A ÷ B × 100」のような式を分数で表示する
const FRX = /(\([^()]+\)|[^\s＝、。（）()<>]+) ÷ (\([^()]+\)|[^\s＝、。（）()×<>]+) × (100,000|100|1,000|10万)/g;
const fracHTML = s => String(s).replace(FRX, (m,a,b,k)=>`<span class="frac"><span>${a.replace(/^\((.*)\)$/,'$1')}</span><span>${b.replace(/^\((.*)\)$/,'$1')}</span></span> × ${k}`);
// 上付き数字（⁴⁰Kなど）はフォントで崩れるので<sup>に置き換える
const SUPM={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','ᵐ':'m'};
function supFix(root){
  const re=/[⁰¹²³⁴⁵⁶⁷⁸⁹][⁰¹²³⁴⁵⁶⁷⁸⁹ᵐ]*/g;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>/[⁰¹²³⁴⁵⁶⁷⁸⁹]/.test(n.nodeValue)&&!n.parentNode.closest('svg')?1:2});
  const ns=[];while(w.nextNode())ns.push(w.currentNode);
  for(const n of ns){
    const t=n.nodeValue,f=document.createDocumentFragment();let last=0;
    t.replace(re,(m,i)=>{f.append(t.slice(last,i));const s=document.createElement('sup');s.className='iso';s.textContent=[...m].map(c=>SUPM[c]).join('');f.append(s);last=i+m.length;});
    f.append(t.slice(last));n.replaceWith(f);
  }
}
// 式の表示：a／b は分数、N_A は下付き
const mfmt = s => String(s).replace(/([A-Za-z0-9_.α-ωΑ-Ω⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+)／([A-Za-z0-9_.α-ωΑ-Ω⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+)/g,'<span class="frac"><span>$1</span><span>$2</span></span>').replace(/([A-Za-zα-ωΑ-Ω])_([A-Za-z0-9]+)/g,'$1<sub>$2</sub>');

  return `<svg class="art" viewBox="0 0 360 176" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">${tr}${st}

}

function startQuiz(list){

function vQuiz(){
  const Q=S.quiz, q=Q.qs[Q.i], n=Q.qs.length, ans=Q.picked!==null, ok=ans&&Q.picked===q.answer, l=LX(S.lid);
  const longExpr = q.expr.length>14;
  return `${top(Q.retry?'間違えた問題':LN(l))}<div class="stack">
  <div class="qhead"><span class="num small muted">${Q.i+1} / ${n}</span><span class="num small muted">正解 ${Q.score}</span></div>
  <div class="meter"><i style="width:${Math.round(Q.i/n*100)}%"></i></div>
  <div class="qbox pop"><div class="prompt">${mfmt(q.prompt)}</div><div class="expr ${longExpr?'long':''}">${mfmt(q.expr)}</div></div>
  <div class="choices ${q.words||q.choices.some(c=>c.length>9)?'words':''}">${q.choices.map(c=>{ let cls=''; if(ans){ if(c===q.answer) cls='ok'; else if(c===Q.picked) cls='ng'; } return `<button class="choice ${cls}" data-act="pick" data-arg="${esc(c)}" ${ans?'disabled':''}>${fx(c)}</button>`; }).join('')}</div>

  <button class="btn wide" data-act="next">${Q.i+1<n?'次の問題 →':'結果を見る'}</button>`}</div>`;
}

function clearLeaves(){ document.querySelectorAll('.leaves').forEach(e=>e.remove()); }
function leafBurst(){
  try{
    clearLeaves();
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const cols=leafColors(), box=document.createElement('div'); box.className='leaves'+(reduce?' still':'');
    const W=window.innerWidth||400; let html='';
    for(let i=0;i<16;i++){ const c=pick(cols), w=ri(24,48);
      html+=`<div class="leaf" aria-hidden="true" style="left:${ri(-10,W-20)}px;width:${w}px;--d:${(4.5+Math.random()*3).toFixed(2)}s;--dl:${(Math.random()*2.2).toFixed(2)}s;--sw:${ri(18,60)}px;--r0:${ri(-60,60)}deg;--r1:${ri(200,420)}deg">${pick(LEAF_SHAPES)(c)}</div>`; }
    const bc=pick(cols);
    html+=`<button class="bigleaf" data-act="leafFlip" aria-label="葉っぱをめくる"><span class="bl-in"><span class="bl-f">${BIG_LEAF(bc,false)}</span><span class="bl-b">${BIG_LEAF(bc,true)}<span>${esc(pick(LEAF_MSG))}</span></span></span><span class="bl-hint">タップしてうらを見る</span></button>`;

}

  ${S.reward?rewardCard(S.reward):''}
  ${S.gotShard?`<div class="panel shardget pop">${SHARD_I}<div><b>胞子が1つたまりました</b><br><span class="small muted">もっている胞子 ${R.sky.shards}　育てているきのこにあげよう</span></div><button class="btn" data-act="toSky">あげる →</button></div>`:''}
  ${Q.wrong.length?`<button class="btn warm wide" data-act="retry">間違えた ${Q.wrong.length}問 をもう一度</button>`:''}
  ${nx&&!Q.retry?`<button class="btn wide" data-act="lessonNext" data-arg="${nx.id}">次へ　${nx.id} ${nx.t} →</button>`:''}
  <button class="btn again wide" data-act="again">新しい問題でもう一度</button>
  <button class="btn ghost wide" data-act="tounit">胞子の一覧へ</button></div>`;
}
function vRecord(){
  const acc=R.answered?Math.round(R.correct/R.answered*100):0, set=new Set(R.days); let cells='';
  for(let i=27;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); cells+=`<div class="day ${set.has(dkey(d))?'on':''}">${d.getDate()}</div>`; }
  const has=new Set([...R.cards, ...PREVIEW_KEYS, ...(PREVIEW_OPEN?KINOKO_CARDS.filter(c=>c.t==='a').map(c=>c.src):[])]);
  const coll = `<div class="panel stack"><h3>きのこカード　<span class="num">${ALLC.filter(c=>has.has(c.key)).length} / ${ALLC.length}</span></h3>${Object.keys(CTYPE).map(t=>{ const idx=ALLC.map((c,i)=>c.t===t?i:-1).filter(i=>i>=0); if(!idx.length) return ''; const got=idx.filter(i=>has.has(ALLC[i].key)).length;
    return `<div class="stack" style="gap:6px"><p class="small"><b>${CTYPE[t]}</b>　<span class="muted num">${got} / ${idx.length}</span></p><div class="coll">${idx.map(i=>has.has(ALLC[i].key)?`<button data-act="viewCard" data-arg="${i}" aria-label="${esc(cardLabel(i)+'　'+ALLC[i].name)}">${cardFace(i,true)}</button>`:`<div class="num">${cardNo(i)}</div>`).join('')}</div></div>`; }).join('')}<p class="small muted">1つの単元の胞子をぜんぶクリアすると、カードを1まいめくれます。まだ持っていないカードから出てきます。集めたカードはタップで大きく見られます。</p></div>`;
  const vc = S.viewCard!=null && ALLC[S.viewCard] && has.has(ALLC[S.viewCard].key) ? ALLC[S.viewCard] : null;
  const viewer = vc ? `<div class="viewer" data-act="closeCard" role="dialog" aria-label="${esc(vc.name)}"><figure>${vc.t==='i'?`<div class="vsvg">${illusSVG(vc.id)}</div>`:`<img src="${esc(vc.src)}" alt="${esc(vc.name)}">`}<figcaption><span class="rno">${cardLabel(S.viewCard)}</span><b class="rname">${esc(vc.name)}</b>${vc.note?`<span class="rnote">${esc(vc.note)}</span>`:''}</figcaption></figure><button class="btn ghost" data-act="closeCard">閉じる</button></div>` : '';
  const units = Object.entries(UNITS).filter(([uid])=>doneCount(uid)>0);
  return `<div class="stack"><div class="hello"><div class="eyebrow">記録</div><h1>学習の記録</h1></div>
  <div class="panel stack"><h3>この4週間</h3><div class="days">${cells}</div></div>
  <div class="panel"><div class="kv"><span>解いた問題</span><b class="num">${R.answered}問</b></div><div class="kv"><span>正答率</span><b class="num">${acc}%</b></div><div class="kv"><span>連続した日</span><b class="num">${streak()}日</b></div></div>
  ${coll}${viewer}
  ${units.length?units.map(([uid,u])=>`<div class="panel"><h3 style="margin-bottom:6px">${u.subject}　${u.no}　${u.title}</h3>${QL(uid).map(l=>`<div class="kv"><span>${LN(l)}</span>${lTag(uid,l.id)}</div>`).join('')}</div>`).join(''):'<p class="small muted">胞子（5分の学習）を終えると、ここに記録が並びます。</p>'}</div>`;
}
function vSky(){
  const s=skyInit(), g=growOf(s.fed), got=new Set(s.born.map(t=>t.sp)), b=S.born?spOf(S.born):null, nextG=GROW.find(x=>x.at>s.fed);
  return `<div class="stack"><div class="hello"><div class="eyebrow">森</div><h1>胞子を飛ばして蕈を育てよう</h1></div>
  <div class="skybox">${nightSVG(s.born)}<div class="skycount"><span>森のきのこ <b class="num">${s.born.length}</b> 本</span><span>きのこ図鑑 <b class="num">${got.size}</b> / ${SP.length}</span></div></div>
  ${b?`<div class="panel born pop"><svg viewBox="0 0 120 120" class="bsv">${mushG(b,60,104,2.6)}</svg><div><p class="small muted">きのこが生えました！</p><h3>${b.name}</h3><p class="small">${b.note}</p></div></div>`:''}
  <div class="panel grow"><div class="growtop"><div><p class="small muted">いま育てているきのこ</p><h3>${g.n}</h3><p class="small">${g.d}</p></div>${stageSVG(s.fed)}</div>
    <div class="meter"><i style="width:${s.fed/SKY_NEED*100}%"></i></div>
    <p class="small muted">${nextG?`あと <b class="num">${nextG.at-s.fed}</b> 胞子で${nextG.n}、`:''}あと <b class="num">${SKY_NEED-s.fed}</b> 胞子できのこが生えます。どのきのこになるかは、お楽しみ。</p>
    <div class="shardbal">${SHARD_I}<span>もっている胞子 <b class="num">${s.shards}</b></span></div>
    ${S.skyMsg?`<p class="skymsg pop">${S.skyMsg}</p>`:''}
    <div class="two"><button class="btn" data-act="feed" data-arg="1" ${s.shards?'':'disabled'}>1つあげる</button><button class="btn ghost" data-act="feed" data-arg="all" ${s.shards?'':'disabled'}>まとめてあげる</button></div>
    ${s.shards?'':'<p class="small muted">まだクリアしていない小単元（5分の学習）を1つクリアすると、胞子が1つたまります。</p>'}</div>
  <div class="panel"><h3>きのこ図鑑</h3><div class="zukan" style="margin-top:10px">${SP.map(sp=>got.has(sp.id)?`<div class="zk"><svg viewBox="0 0 60 60">${mushG(sp,30,54,1.3)}</svg><b>${sp.name}</b><span>${sp.note}</span></div>`:`<div class="zk no"><svg viewBox="0 0 60 60"><path d="M14 34 C14 14 46 14 46 34 Z M26 34 L25 50 L35 50 L34 34Z" fill="currentColor" opacity=".18"/></svg><b>？？？</b></div>`).join('')}</div></div></div>`;
}
function vSettings(){
  return `<div class="stack"><div class="hello"><div class="eyebrow">設定</div><h1>呼び名</h1></div>
  <div class="panel stack"><label for="st-name"><b>呼び名</b></label><input type="text" id="st-name" value="${esc(R.name)}" maxlength="12" autocomplete="off"></div></div>`;
}
function vInstall(){
  return `${top('ホーム画面に追加')}<div class="stack">
  <div class="panel stack"><h3>iPhone・iPad（Safari）</h3><ol class="steps"><li>下の共有ボタン（□に↑）をタップ</li><li>「ホーム画面に追加」を選ぶ</li><li>右上の「追加」をタップ</li></ol></div>
  <div class="panel stack"><h3>Android（Chrome）</h3><ol class="steps"><li>右上の「︙」メニューをタップ</li><li>「ホーム画面に追加」または「アプリをインストール」を選ぶ</li></ol></div></div>`;
}

/* ===== 演習問題（PDF） ===== */
const STAGES = [
  { lv:1, name:'胞子', desc:'基礎問題', icon:'<circle cx="24" cy="24" r="6"/><circle cx="12" cy="14" r="2.5"/><circle cx="36" cy="16" r="2"/><circle cx="34" cy="36" r="2.4"/>' },
  { lv:2, name:'菌糸', desc:'標準問題', icon:'<path d="M24 24 q-8 6 -16 8 M24 24 q8 6 16 9 M24 24 q-2 8 -6 14 M24 24 q4 8 10 13"/><circle cx="24" cy="22" r="3"/>' },
  { lv:3, name:'幼菌', desc:'定期試験対策', icon:'<path d="M14 28 C14 16 34 16 34 28 Z"/><path d="M21 28 v12 h6 v-12"/>' },
  { lv:4, name:'成菌', desc:'国家試験レベル', icon:'<path d="M6 24 C6 6 42 6 42 24 Z"/><path d="M20 24 v16 h8 v-16"/>' },
  { lv:5, name:'光るきのこ', desc:'国家試験・応用', icon:'<path d="M8 24 C8 8 40 8 40 24 Z"/><path d="M20 24 v16 h8 v-16"/><path d="M4 10 l4 3 M44 10 l-4 3 M24 2 v4"/>' },
];
function vDrill(){
  const u=CU();
  return `${top(u.no+'　'+u.title+'　演習問題')}<div class="stack"><p class="small muted">この単元の演習問題（PDF）です。印刷しても、画面で解いても大丈夫です。きのこが育つのと同じように、Lv1から順にレベルが上がります。</p>
  <div class="ladder">${STAGES.map(s=>{ const p=PDF[u.drill+'-lv'+s.lv]||{};
    return `<div class="rung"><svg class="stage" viewBox="0 0 48 48" aria-hidden="true">${s.icon}</svg><div class="body"><div class="row" style="gap:8px"><span class="tag">Lv${s.lv}</span><b class="sname">${s.name}</b></div><p class="small">${s.desc}</p>
    ${p.q?`<div class="row"><button class="btn pdfbtn" data-act="pdf" data-arg="${s.lv}|0">問題を開く</button><button class="btn ghost pdfbtn" data-act="pdf" data-arg="${s.lv}|1">解答・解説</button></div>`:'<span class="small muted">準備中</span>'}</div></div>`; }).join('')}</div></div>`;
}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfLibP=null;
const loadScript = src => new Promise((ok,ng)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=ng; document.head.appendChild(s); });
function pdfLib(){ if(!pdfLibP) pdfLibP=loadScript(PDFJS+'pdf.min.js').then(()=>{ pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js'; return pdfjsLib; }).catch(e=>{ pdfLibP=null; throw e; }); return pdfLibP; }
function openPdf(arg){ const [lv,i]=arg.split('|'), u=CU(), st=STAGES.find(s=>s.lv===+lv), p=PDF[u.drill+'-lv'+lv]||{};
  S.pdf={ title:`Lv${lv} ${st.name}`, list:[{label:'問題',url:p.q},{label:'解答・解説',url:p.a}], i:+i, z:1, tok:0 }; go('pdf'); }
function vPdf(){ const P=S.pdf;
  return `${top(CU().title+'　'+P.title)}<div class="stack"><div class="pdfbar"><div class="pdfseg">${P.list.map((x,i)=>`<button class="${i===P.i?'on':''}" data-act="pdfTab" data-arg="${i}">${x.label}</button>`).join('')}</div>
  <button class="pdfzoom" data-act="pdfZoom">${P.z>1?'－ 縮小':'＋ 拡大'}</button></div><div id="pdfpages" class="pdfpages"><p class="small muted" style="padding:24px;text-align:center">読みこみ中…</p></div>
  <a class="btn ghost wide pdfbtn" style="text-align:center;text-decoration:none" href="${esc(P.list[P.i].url||'')}" target="_blank" rel="noopener">PDFを別の画面で開く（印刷用）</a></div>`; }
async function renderPdf(){ const P=S.pdf, box=document.getElementById('pdfpages'); if(!box) return; const tok=++P.tok;
  try{ const lib=await pdfLib(), r=await fetch(P.list[P.i].url); if(!r.ok) throw 0; const data=await r.arrayBuffer(); if(tok!==P.tok) return;
    const doc=await lib.getDocument({ data, isEvalSupported:false }).promise; if(tok!==P.tok) return; box.innerHTML='';
    const W=Math.floor(box.clientWidth*P.z), dpr=Math.min(Math.max(window.devicePixelRatio||1,2)*1.5,4);
    for(let n=1;n<=doc.numPages;n++){ const pg=await doc.getPage(n); if(tok!==P.tok) return; const v0=pg.getViewport({scale:1}), vp=pg.getViewport({scale:W/v0.width*dpr}), cv=document.createElement('canvas');
      cv.width=vp.width; cv.height=vp.height; cv.className='pdfpage'; cv.style.width=W+'px'; box.appendChild(cv); await pg.render({ canvasContext:cv.getContext('2d'), viewport:vp }).promise; } }
  catch(e){ if(tok===P.tok) box.innerHTML='<p class="small muted" style="padding:24px;text-align:center">PDFを読みこめませんでした。下のボタンから開いてください。</p>'; } }

const VIEWS={ setup:vSetup, home:vHome, course:vCourse, subject:vSubject, unit:vUnit, lesson:vLesson, cards:vCards, quiz:vQuiz, result:vResult, record:vRecord, settings:vSettings, install:vInstall, drill:vDrill, pdf:vPdf, sky:vSky };
function render(){
  if(S.view!=='result') clearLeaves();
  app.innerHTML=VIEWS[S.view]();
  supFix(app);
  tabs.hidden = S.view==='setup';
  const tabFor={record:'record',settings:'settings',sky:'sky'}[S.view]||'home';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tabFor));
  const n=document.getElementById('st-name');
  if(n) n.addEventListener('input',e=>{ R.name=e.target.value.trim(); save(); });
  if (S.view==='pdf') renderPdf();
}
function answerQ(picked){
  const Q=S.quiz, q=Q.qs[Q.i], ok=picked===q.answer; Q.picked=picked; R.answered++;
  if(ok){ Q.score++; R.correct++; } else Q.wrong.push(q);
  markDay(); save(); render();
}

document.addEventListener('click', e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){ S.stack=[]; S.viewCard=null; S.born=null; S.skyMsg=''; S.view=tab.dataset.tab; render(); window.scrollTo(0,0); return; }
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, arg=b.dataset.arg;
  if(a==='back') back();
  else if(a==='leafFlip'){ if(!b.classList.contains('open')){ b.classList.add('open'); const h=b.querySelector('.bl-hint'); if(h) h.textContent='タップでとじる'; } else { b.classList.add('bye'); setTimeout(clearLeaves,500); } }
  else if(a==='openReward'){ const rc=b.closest('.rcard'); if(rc) rc.classList.add('open'); b.disabled=true; }
  else if(a==='viewCard'){ S.viewCard=+arg; render(); }
  else if(a==='closeCard'){ S.viewCard=null; render(); }
  else if(a==='go') go(arg);
  else if(a==='pdf') openPdf(arg);
  else if(a==='pdfTab'){ S.pdf.i=+arg; render(); }
  else if(a==='pdfZoom'){ S.pdf.z=S.pdf.z>1?1:1.8; render(); }
  else if(a==='course'){ S.course=arg; go('course'); }
  else if(a==='subject'){ S.subj=+arg; go('subject'); }
  else if(a==='unit'){ S.uid=arg; go('unit'); }
  else if(a==='setupDone'){ const nm=document.getElementById('su-name').value.trim(); if(!nm){ document.getElementById('su-err').hidden=false; return; }
    R.done=true; R.name=nm; save(); S.stack=[]; S.view='home'; render(); }
  else if(a==='lesson'){ if(b.dataset.uid) S.uid=b.dataset.uid; S.lid=arg; go('lesson'); }
  else if(a==='lessonNext'){ const u=CU(); S.lid=arg; S.course=u.course; S.subj=u.subj; S.stack=['home','course','subject','unit']; S.view='lesson'; render(); window.scrollTo(0,0); }
  else if(a==='quiz') startQuiz();
  else if(a==='cards'){ S.deck={cur:deckNext()}; S.flipped=false; markDay(); go('cards'); }
  else if(a==='flip'){ S.flipped=!S.flipped; render(); }
  else if(a==='cardKnown'){ const k=knownList(); if(!k.includes(S.deck.cur)) k.push(S.deck.cur); save(); S.deck.cur=deckNext(); S.flipped=false; render(); }
  else if(a==='cardLater'){ const left=terms().map((_,i)=>i).filter(i=>!knownList().includes(i)); S.deck.cur=left[(left.indexOf(S.deck.cur)+1)%left.length]; S.flipped=false; render(); }
  else if(a==='cardsReset'){ R.known[S.uid]=[]; save(); S.deck.cur=deckNext(); S.flipped=false; render(); }
  else if(a==='hint'){ S.quiz.hint=true; render(); }
  else if(a==='pick') answerQ(arg);
  else if(a==='next'){ const Q=S.quiz;
    if(Q.i+1<Q.qs.length){ Q.i++; Q.picked=null; Q.hint=false; render(); window.scrollTo(0,0); return; }
    S.reward=null; S.gotShard=false; let leafNow=false;
    if(!Q.retry){ skyInit(); const u=CU(), l=LX(S.lid), k=lkey(S.uid,l.id), first=!R.lessons[k], wasDone=unitDone(S.uid), wasItem=itemDone(S.uid), n=Q.qs.length, s=R.lessons[k]||{best:0,tries:0,total:n};
      s.tries++; s.best=Math.max(s.best,Q.score); s.total=n; R.lessons[k]=s; R.lastUnit=S.uid; save();
      // 項目（章をぜんぶ）クリアできのこカード
      if(!wasItem&&itemDone(S.uid)){ const sb=courseById(u.course).subjects[u.subj]; S.reward=drawReward(); S.reward.title=sb.name; }
      if(first){ R.sky.shards++; R.sky.total++; S.gotShard=true; save(); }
      // 章クリアで木の葉のメッセージ
      leafNow = !wasDone && unitDone(S.uid); }
    S.view='result'; render(); window.scrollTo(0,0); if(leafNow) leafBurst(); }
  else if(a==='retry'){ const list=S.quiz.wrong.map(q=>Object.assign({},q,{choices:shuffle([...q.choices])})); S.view=S.stack.pop()||'lesson'; startQuiz(list); }
  else if(a==='again'){ S.view=S.stack.pop()||'lesson'; startQuiz(); }
  else if(a==='feed'){ skyFeed(arg); render(); }
  else if(a==='toSky'){ S.stack=[]; S.born=null; S.skyMsg=''; S.view='sky'; render(); window.scrollTo(0,0); }
  else if(a==='tounit'){ const u=CU(); S.course=u.course; S.subj=u.subj; S.stack=['home','course','subject']; S.view='unit'; render(); window.scrollTo(0,0); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.viewCard!=null){ S.viewCard=null; render(); } });

render();
if('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body></html>
