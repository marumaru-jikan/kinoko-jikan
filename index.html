<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3A2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="蕈時間">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>蕈時間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: one calm phone-width column in a night forest, views swapped in place, a fixed bottom tab bar (海月時間シリーズと同じ骨組み) */
:root{
  --bg:#EEF2EA; --bg-top:#D9E5D2; --surface:#FFFFFF; --sunk:#E3EADD; --ink:#16231A; --muted:#55665A; --line:#C9D5C3;
  --teal:#2E6A45; --teal-soft:#DCEBDF; --accent:#B98A3E; --accent-soft:#F5EAD6; --accent-ink:#4A3410;
  --good:#23845A; --good-bg:#DCF1E6; --bad:#B9503A; --bad-bg:#F8E1DA;
  --night1:#1F3A2A; --night2:#122219; --night3:#07100B; --star:#C6F28A; --night-ink:#E7F0DC; --night-muted:#A9BFAE;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A120D; --bg-top:#142319; --surface:#111C15; --sunk:#0D1711; --ink:#E4EFE0; --muted:#9DB2A1; --line:#22342A;
  --teal:#9DD3A9; --teal-soft:#1A2F22; --accent:#D9A86C; --accent-soft:#3A2B14; --accent-ink:#F4DDB5;
  --good:#6CCB94; --good-bg:#14332A; --bad:#E8826A; --bad-bg:#3A201A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A120D; --bg-top:#142319; --surface:#111C15; --sunk:#0D1711; --ink:#E4EFE0; --muted:#9DB2A1; --line:#22342A;
  --teal:#9DD3A9; --teal-soft:#1A2F22; --accent:#D9A86C; --accent-soft:#3A2B14; --accent-ink:#F4DDB5;
  --good:#6CCB94; --good-bg:#14332A; --bad:#E8826A; --bad-bg:#3A201A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg) linear-gradient(180deg,var(--bg-top) 0,var(--bg) 360px) no-repeat;min-height:100%;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:1.6rem;font-weight:900}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;gap:10px;min-height:52px}
.back{border:0;background:none;padding:8px 10px 8px 0;font-size:1rem;color:var(--teal);font-weight:700;white-space:nowrap;flex:none}
.top .ttl{font-family:var(--f-display);font-weight:700;font-size:1.05rem;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.hello{padding-block:10px 4px}
.hello .eyebrow{font-size:.8rem;letter-spacing:.08em;color:var(--teal);font-weight:700}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.78rem;color:var(--muted)}

.continue{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(120deg,var(--night1),var(--night2));color:var(--night-ink);border:0;border-radius:14px;padding:16px 18px}
.continue small{display:block;opacity:.85;font-size:.8rem}
.continue strong{font-family:var(--f-display);font-size:1.1rem}
.continue .go{font-size:1.4rem;color:var(--star)}

.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.subjects .subj:last-child:nth-child(odd){grid-column:1/-1}
.subj{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:92px}
.subj .k{font-family:var(--f-display);font-size:1.6rem;font-weight:900;line-height:1;color:var(--teal)}
.subj b{font-family:var(--f-display);font-size:1.05rem}
.subj .small{line-height:1.45}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item[disabled]{opacity:.5;cursor:default}
.item .body{flex:1;min-width:0}
.item .chev{color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.done{background:var(--good-bg);color:var(--good)}
.tag.mid{background:var(--accent-soft);color:var(--accent-ink)}
.lid{flex:none;min-width:44px;height:30px;padding:0 8px;border-radius:99px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal);font-weight:700;font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:.9rem}
.lid.col{background:var(--accent-soft);color:var(--accent-ink);font-size:.78rem}
.lid.done{background:var(--teal);color:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:var(--teal);color:var(--surface)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.warm{background:var(--accent);color:#2B1F00}
.btn.wide{width:100%}
.btn.again{background:var(--teal-soft);color:var(--teal);border:2px solid var(--teal)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.item:focus-visible,.subj:focus-visible,.choice:focus-visible,.card:focus-visible,.tab:focus-visible,.rflip:focus-visible,.continue:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* lesson */
.lesson section{display:flex;flex-direction:column;gap:10px}
.rule{background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:12px 14px;font-weight:700;line-height:1.75}
.ex{font-family:var(--f-display);font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums}
.fx{background:var(--sunk);border-radius:10px;padding:10px 14px;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.8}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chain span{background:var(--teal-soft);color:var(--teal);border-radius:8px;padding:4px 10px;font-weight:700;font-size:.92rem}
.chain i{font-style:normal;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-top:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.tbl th{font-weight:700;color:var(--muted);font-size:.8rem}
.tbl td:first-child{min-width:6.5em}
.tbl tr:first-child th,.tbl tr:first-child td{border-top:0}
.scroll{overflow-x:auto}
.fig{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.fig text{font-family:var(--f-body);font-size:12px;fill:var(--ink)}
.fig .lb{font-weight:700}
.fig .ch{fill:var(--teal-soft);stroke:var(--teal);stroke-width:1.5}
.fig .chL{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.fig .wl{fill:none;stroke:var(--teal);stroke-width:2}
.fig .mu{fill:var(--muted);font-size:10.5px}
.fig .ac{fill:var(--accent)}
.fig .tl{fill:none;stroke:var(--muted);stroke-width:1.6}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.note-box{background:var(--sunk);border-color:transparent;display:flex;flex-direction:column;gap:10px}
.ptypes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ptypes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--sunk);border-radius:12px;padding:10px 8px;min-width:0}
.ptypes svg{width:84px;height:84px}.ptypes .pb{fill:var(--teal)}
.ptypes figcaption{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}.ptypes figcaption span{font-size:.76rem;line-height:1.5;color:var(--muted)}
.fig .pm,.legend i.pm{fill:#7FBF6E;background:#7FBF6E}.fig .pw,.legend i.pw{fill:#3F7FB0;background:#3F7FB0}.fig .po,.legend i.po{fill:#D9A86C;background:#D9A86C}
.frac{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle;line-height:1.35;font-size:.92em}
.frac>span{display:block;text-align:center;padding:0 .3em;white-space:nowrap}.frac>span:first-child{border-bottom:1.5px solid currentColor}
.fxs{display:flex;flex-direction:column;gap:12px;font-size:.92rem;overflow-x:auto}.fxs>div{display:flex;align-items:center;gap:5px;white-space:nowrap}.fxs .fn{min-width:6em}
.rule.steps{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}.rule.steps b{margin-bottom:4px}.rule.steps i{font-style:normal;line-height:1.2}
.fig .grid{stroke:var(--line);stroke-width:1}
.note{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:.9rem}

/* cards */
.card{position:relative;width:100%;min-height:230px;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:24px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center}
.card .side{font-size:.75rem;letter-spacing:.1em;color:var(--teal);font-weight:700}
.card .term{font-family:var(--f-display);font-size:1.7rem;font-weight:900}
.card .def{font-size:1.02rem;line-height:1.8;max-width:30em}
.card.flipped{background:var(--teal-soft)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px;text-align:center}
.qbox .prompt{color:var(--muted);font-size:.92rem}
.qbox .expr{font-family:var(--f-display);font-size:1.6rem;font-weight:900;margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.5}
.qbox .expr.long{font-size:1.12rem;font-weight:700;line-height:1.7;text-align:left}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 8px;font-family:var(--f-display);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.choices.words{grid-template-columns:1fr}
.choices.words .choice{font-size:1.02rem;padding:12px;text-align:left}
.choice.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.choice.ng{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.choice[disabled]{cursor:default}
.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feedback.ok{background:var(--good-bg)}
.feedback.ng{background:var(--bad-bg)}
.feedback .verdict{font-family:var(--f-display);font-weight:900;font-size:1.15rem}
.feedback.ok .verdict{color:var(--good)} .feedback.ng .verdict{color:var(--bad)}
.hint{background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:12px 14px;font-size:.95rem}
.linkbtn{border:0;background:none;color:var(--teal);font-weight:700;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.result{text-align:center;padding:24px 16px}
.result .big{font-family:var(--f-display);font-size:3rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--teal);line-height:1.1}

/* record */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.day.on{background:var(--teal);color:var(--surface);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input[type=text]:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok::before{background:var(--good)}
.status.wait::before{background:var(--accent)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted);font-weight:700}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}
.tab.on{color:var(--teal)}

@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}
.pop{animation:pop .25s ease-out}

/* night sky hero */
.sky{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(175deg,var(--night1) 0%,var(--night2) 55%,var(--night3) 100%);color:var(--night-ink);padding:22px 18px 20px;min-height:176px;display:flex;align-items:flex-end}
.sky .art{position:absolute;inset:0;width:100%;height:100%}
.sky .txt{position:relative;z-index:1;max-width:64%;display:flex;flex-direction:column;gap:4px}
.sky .name{font-family:var(--f-display);font-weight:900;font-size:1.05rem;letter-spacing:.2em;color:var(--star)}
.sky h1{color:#F1F8EC;font-size:1.45rem}
.sky p{color:var(--night-muted);font-size:.88rem}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes shoot{0%,78%{opacity:0;transform:translate(0,0)}82%{opacity:1}100%{opacity:0;transform:translate(-120px,60px)}}
.shoot{animation:shoot 9s ease-in infinite}

/* reward card */
.rcard{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0 4px}
.rlead{font-family:var(--f-display);font-weight:700;color:var(--teal);text-align:center}
.rflip{border:0;padding:0;background:none;width:min(100%,300px);max-width:100%;aspect-ratio:3/4;perspective:1200px;cursor:pointer}
.rflip[disabled]{cursor:default}
.rinner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.rcard.open .rinner{transform:rotateY(180deg)}
.rback,.rfront{position:absolute;inset:0;border-radius:18px;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 12px 30px rgba(5,15,10,.35)}
.rback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(120% 80% at 50% 0%,#2E5A3C 0%,#15281D 55%,#08120D 100%);border:3px solid #D9B26A;color:#F2E7C6}
.rback svg{width:56%;height:auto}
.rhint{font-family:var(--f-display);font-weight:700;letter-spacing:.12em;font-size:.95rem;padding:6px 14px;border-radius:99px;background:rgba(217,178,106,.18)}
.rcard:not(.open) .rflip{animation:nudge 2.6s ease-in-out 1s infinite}
@keyframes nudge{0%,86%,100%{transform:none}90%{transform:rotate(-2deg)}94%{transform:rotate(2deg)}}
.rfront{transform:rotateY(180deg);background:#0A1510;border:3px solid #9DD3A9}
.rfront img,.rfront svg{display:block;width:100%;height:100%;object-fit:cover}
.rcap,.viewer figcaption{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.rcap{transition:opacity .4s ease .55s}
.rcard:not(.open) .rcap{opacity:0;visibility:hidden}
.rno{font-size:.8rem;letter-spacing:.06em;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.rno em{font-style:normal;background:var(--accent);color:#2B1F00;border-radius:99px;padding:0 9px;font-size:.72rem;font-weight:700;letter-spacing:.08em}
.rname{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.rnote{font-size:.9rem;color:var(--muted)}
.rcount{font-size:.76rem;color:var(--muted);margin-top:4px}
.coll{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.coll>*{aspect-ratio:3/4;max-width:100%;border-radius:8px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.8rem;border:0;padding:0}
.coll button{cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.coll img,.coll svg{width:100%;height:100%;object-fit:cover;display:block}
.rfront img.zimg,.coll img.zimg{object-fit:contain;background:#2B2019}
.viewer{position:fixed;inset:0;z-index:20;background:rgba(4,10,7,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));color:#E7F0DC}
.viewer figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px;width:100%}
.viewer img,.viewer .vsvg{max-width:100%;max-height:66vh;border-radius:14px;object-fit:contain;display:block}
.viewer .vsvg{width:min(100%,46vh)}
.viewer .vsvg svg{width:100%;height:auto;display:block;border-radius:14px}
.viewer .rno,.viewer .rnote{color:#A9BFAE}

/* grow a star */
.skybox{border-radius:22px;overflow:hidden;background:linear-gradient(175deg,#1F3A2A 0%,#122219 58%,#07100B 100%);color:#E7F0DC}
.skybox .night{display:block;width:100%;height:auto}
.skycount{display:flex;justify-content:space-between;padding:8px 16px 12px;font-size:.82rem;color:#B5C9B9}
.skycount b{color:#fff;font-size:1rem}
.night .tw{animation-duration:4s}
.stg{width:150px;max-width:42%;height:auto;flex:none;background:linear-gradient(175deg,#1F3A2A,#122219);border-radius:16px}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.stg .bob{animation:breathe 4s ease-in-out infinite;transform-origin:110px 85px}
.growtop{display:flex;gap:12px;align-items:center;justify-content:space-between}
.growtop>div{min-width:0}
.grow{display:flex;flex-direction:column;gap:10px}
.shard{width:20px;height:20px;fill:var(--accent);stroke:var(--accent-ink);stroke-width:1;flex:none}
.shardbal{display:flex;align-items:center;gap:6px;font-weight:700}
.shardbal b{font-size:1.15rem;color:var(--teal)}
.skymsg{margin:0;color:var(--teal);font-weight:700}
.born{display:flex;gap:12px;align-items:center;background:linear-gradient(175deg,#1F3A2A,#122219);color:#E7F0DC;border:0}
.born h3{color:#fff;margin:2px 0}.born .muted{color:#B5C9B9}
.bsv{width:104px;height:104px;flex:none}
.zukan{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.zk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:8px 4px;border-radius:12px;background:linear-gradient(175deg,#1F3A2A,#122219);color:#E7F0DC;min-width:0}
.zk svg{width:56px;height:56px}.zk b{font-size:.8rem}.zk span{font-size:.66rem;line-height:1.4;color:#B5C9B9}

.shardget{display:flex;align-items:center;gap:10px}.shardget>div{flex:1;min-width:0}.shardget .shard{width:28px;height:28px}

/* PDF */
.ladder{display:flex;flex-direction:column;gap:10px}
.rung{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.rung .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.stage{flex:none;width:46px;height:46px;fill:var(--accent-soft);stroke:var(--teal);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sname{font-family:var(--f-display);font-size:1.1rem}
.pdfbar{display:flex;gap:8px;align-items:center}
.pdfseg{display:flex;flex:1;background:var(--surface);border-radius:999px;padding:3px;border:1px solid var(--line)}
.pdfseg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:999px;font-size:.9rem}
.pdfseg button.on{background:var(--teal);color:var(--surface);font-weight:700}
.pdfzoom{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:.85rem;white-space:nowrap}
.pdfpages{display:flex;flex-direction:column;gap:12px;overflow-x:auto;min-height:200px}
.pdfpage{background:#fff;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.15);flex:none}
.pdfbtn{padding:9px 14px;font-size:.9rem}


.goro{display:flex;flex-direction:column;gap:8px}.goro>div{background:var(--accent-soft);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}.goro b{color:var(--accent-ink);font-family:var(--f-display);font-size:1rem}.goro span{font-size:.86rem;color:var(--ink)}
/* clear: 木の葉が降ってきて、裏にメッセージ */
.leaves{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.leaf{position:absolute;top:-90px;opacity:0;will-change:transform,opacity;animation:leafdown var(--d) linear var(--dl) forwards}
.leaf svg{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.18))}
@keyframes leafdown{0%{transform:translate(0,0) rotate(var(--r0));opacity:0}8%{opacity:1}25%{transform:translate(var(--sw),28vh) rotate(calc(var(--r0) + 60deg))}50%{transform:translate(calc(var(--sw) * -1),56vh) rotate(calc(var(--r0) + 140deg))}75%{transform:translate(var(--sw),84vh) rotate(calc(var(--r0) + 220deg));opacity:1}100%{transform:translate(0,118vh) rotate(var(--r1));opacity:.85}}
.bigleaf{position:fixed;left:50%;top:0;width:min(74vw,280px);margin-left:calc(min(74vw,280px) / -2);pointer-events:auto;border:0;background:none;padding:0;cursor:pointer;z-index:31;perspective:900px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:bigfall 3s ease-out forwards;color:inherit;font:inherit}
@keyframes bigfall{0%{transform:translate(-40px,-30vh) rotate(-24deg)}28%{transform:translate(46px,10vh) rotate(16deg)}52%{transform:translate(-34px,22vh) rotate(-11deg)}76%{transform:translate(14px,30vh) rotate(5deg)}100%{transform:translate(0,33vh) rotate(0)}}
.bl-in{display:block;position:relative;width:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.bigleaf.open .bl-in{transform:rotateY(180deg)}
.bl-f,.bl-b{display:block;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.bl-f svg,.bl-b svg{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))}
.bl-b{position:absolute;inset:0;transform:rotateY(180deg)}
.bl-b span{position:absolute;inset:0;display:grid;place-items:center;padding:0 13% 0 15%;text-align:center;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere;font-family:var(--f-display);font-weight:900;font-size:clamp(1rem,4.6vw,1.2rem);line-height:1.5;color:#2A3424}
.bl-hint{font-size:.8rem;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 12px;opacity:0;animation:hintin .4s ease 2.8s forwards}
@keyframes hintin{to{opacity:1}}
.bigleaf:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:12px}
.bigleaf.bye{transition:opacity .5s, transform .5s;opacity:0}
.leaves.still .leaf{display:none}
.leaves.still .bigleaf{animation:none;transform:translateY(33vh)}
.leaves.still .bl-hint{animation:none;opacity:1}
@media (prefers-reduced-motion: reduce){.pop,.tw,.shoot,.stg .bob,.rcard .rflip{animation:none!important}.rinner,.rcap,.meter i{transition:none}}

/* ===== 計算問題（薬物動態） ===== */
const r1 = x => Math.round(x*10)/10, r3 = x => Math.round(x*1000)/1000;
const G = {
  kel(){ const t=pick([2,3,4,5,6,7,8,10,12]), k=r3(0.693/t);
    return nq('消失速度定数を求めよう', `消失半減期 ${t} 時間の薬物。消失速度定数 k は？（ln2 ＝ 0.693）`, k, [r3(t/0.693),r3(0.693*t),r3(1/t)], ' /h', 'k ＝ 0.693 ÷ t½', `0.693 ÷ ${t} ＝ ${nf(k)} /h です。`); },
  half(){ const C=pick([40,80,120,160,200,320]), t=pick([2,4,6,8]), n=pick([2,3,4]), a=C/2**n;
    return nq('残っている濃度は？', `血中濃度 ${C} μg/mL の薬物（t½ ${t} 時間）。一次消失で ${t*n} 時間後の濃度は？`, a, [C/(2*n),C/n,C/2**(n+1)], ' μg/mL', `${t*n} 時間は半減期の何回分かを考えよう`, `${t*n} ÷ ${t} ＝ ${n} 回半分になるので、${C} ÷ ${2**n} ＝ ${nf(a)} μg/mL です。`); },
  vd(){ const C=pick([2,4,5,10,20]), V=pick([10,20,25,40,50]), D=C*V;
    return nq('分布容積を求めよう', `${D} mg を静注した直後の血中濃度（C₀）が ${C} μg/mL。分布容積は？`, V, [D*C,V*10,V/10], ' L', 'Vd ＝ 投与量 ÷ C₀（1 μg/mL ＝ 1 mg/L）', `${C} μg/mL ＝ ${C} mg/L。${D} ÷ ${C} ＝ ${V} L です。`); },
  dose0(){ const V=pick([20,30,40,50]), C=pick([2,5,10,15]);
    return nq('投与量を求めよう', `分布容積 ${V} L の薬物。静注直後の血中濃度を ${C} μg/mL にするには何 mg？`, V*C, [V/C,V*C*10,V+C], ' mg', '投与量 ＝ C₀ × Vd', `${C} mg/L × ${V} L ＝ ${V*C} mg です。`); },
  cl(){ const k=pick([0.05,0.1,0.2,0.25]), V=pick([20,40,50,60]), c=r3(k*V);
    return nq('クリアランスを求めよう', `消失速度定数 ${nf(k)} /h、分布容積 ${V} L の薬物。全身クリアランスは？`, c, [r3(V/k),r3(k/V),r3(k*V*60)], ' L/h', 'CL ＝ k × Vd', `${nf(k)} × ${V} ＝ ${nf(c)} L/h です。`); },
  thalf(){ const V=pick([20,30,40,50,60,70]), C=pick([2,3,4,5,7]), t=r1(0.693*V/C);

  css(){ const C=pick([2,4,5,8,10]), Cs=pick([2,3,4,5,10]), R=C*Cs;

  load(){ const Cs=pick([5,10,15,20]), V=pick([20,30,40,50]);
    return nq('負荷投与量を求めよう', `目標の血中濃度 ${Cs} μg/mL、分布容積 ${V} L。負荷投与量は？`, Cs*V, [Cs/V*1000,Cs+V,Cs*V*10], ' mg', '負荷投与量 ＝ 目標濃度 × Vd', `${Cs} mg/L × ${V} L ＝ ${Cs*V} mg です。`); },
  cg(){ const age=pick([40,50,60,70,80]), wt=pick([45,50,54,60,72]), scr=pick([0.8,1,1.2,1.5,2]), fem=Math.random()<.4, raw=(140-age)*wt/(72*scr)*(fem?.85:1), a=Math.round(raw);

function kdQ(key){
  const d=pick(KD[key].drugs), cls=[...new Set(KD_ALL.map(x=>x[2]))].filter(c=>c!==d[2]), others=KD_ALL.filter(x=>x[2]!==d[2]), same=KD_ALL.filter(x=>x!==d);
  const t=ri(0,3), wq=a=>shuffle([...a]).slice(0,3);
  if(t===0) return { prompt:'分類は？', expr:`${d[0]}（${d[1]}）`, answer:d[2], choices:shuffle([d[2],...wq(cls)]), words:true, hint:'作用のしくみを思い出そう。', explain:`${d[0]}は${d[2]}。${d[3]}。` };
  if(t===1) return { prompt:'当てはまる薬は？', expr:`${d[2]}`, answer:d[0], choices:shuffle([d[0],...wq(others).map(x=>x[0])]), words:true, hint:'語尾の形（〜プリル、〜サルタン、〜ジピン、〜ロール）がヒント。', explain:`${d[0]}（${d[1]}）は${d[2]}です。` };
  if(t===2) return { prompt:'一般名は？', expr:`商品名「${d[1]}」`, answer:d[0], choices:shuffle([d[0],...wq(same).map(x=>x[0])]), words:true, hint:'表の商品名を思い出そう。', explain:`${d[1]}の一般名は${d[0]}（${d[2]}）。` };
  return { prompt:'特徴として正しいのは？', expr:`${d[0]}（${d[1]}）`, answer:d[3], choices:shuffle([d[3],...wq(same).map(x=>x[3])]), words:true, hint:`${d[0]}は${d[2]}です。`, explain:`${d[0]}：${d[3]}。` };
}

Object.assign(G, {

    const c=pick([1,2,5,10,20]); return nq('単位をそろえよう', `${c} μg/mL ＝ □ mg/L`, c, [c*1000,c/1000,c*10], ' mg/L', '1 μg/mL ＝ 1 mg/L', `μg→mg で ÷1,000、mL→L で ×1,000。だから ${c} μg/mL ＝ ${c} mg/L です。`); },
  cpct(){ if(Math.random()<.5){ const c=pick([0.1,0.5,1,2,5,10]); return nq('％を mg/mL に', `${nf(c)}%（w/v）の液 1 mL に含まれる薬は？`, c*10, [c,c*100,c/10], ' mg', '1%（w/v）＝ 100 mL に 1 g ＝ 1 mL に 10 mg', `${nf(c)} × 10 ＝ ${nf(c*10)} mg です。`); }
    const [c,lab]=pick([[0.9,'生理食塩液（0.9%）'],[5,'5% ブドウ糖液'],[10,'10% ブドウ糖液'],[50,'50% ブドウ糖液'],[8.4,'8.4% 炭酸水素ナトリウム液']]), V=pick([20,100,250,500]), a=Math.round(c*V/100*1000)/1000;

  cdil(){ const [C1,C2]=pick([[10,2],[10,1],[20,5],[50,10],[5,1],[70,50],[25,5]]), V2=pick([100,200,250,500,1000]), V1=C2*V2/C1;
    return nq('うすめる量を求めよう', `${C1}% の液から ${C2}% の液を ${V2} mL 作る。${C1}% の液は何 mL 必要？`, V1, [C1*V2/C2,V2-V1,V1*2], ' mL', 'C₁ × V₁ ＝ C₂ × V₂（薬の量は変わらない）', `${C1} × V₁ ＝ ${C2} × ${V2} → V₁ ＝ ${nf(V1)} mL。残り ${nf(V2-V1)} mL は水などでうすめます。`); },
  cbai(){ const r=pick([10,100]), dose=pick(r===10?[5,10,20,30,50]:[0.5,1,2,3]), times=pick([2,3]), days=pick([5,7,14]), total=dose*times*days, g=total*r/1000;
    if(Math.random()<.4){ const want=pick(r===10?[50,100,200]:[5,10,20]); return nq('倍散の量は？', `${r}倍散で、主薬 ${want} mg を量るには倍散を何 g？`, want*r/1000, [want/r/1000,want*r,want/1000], ' g', `${r}倍散 ＝ 1 g の中に主薬 ${1000/r} mg`, `主薬 ${want} mg × ${r} ＝ ${want*r} mg ＝ ${nf(want*r/1000)} g です。`); }

/* きのこを1本描く。sp：cap（傘の色）・stem（柄の色）・shape（dome/flat/cone/spot）・glow（光る） */
function mushG(sp,x,y,k){
  x=+x; y=+y; const c=sp.cap, st=sp.stem||'#EDE6D6', h=24*k, w=(sp.shape==='flat'?24:sp.shape==='cone'?13:19)*k, top=y-h;
  let cap;
  if(sp.shape==='flat') cap=`<path d="M${x-w} ${top+2*k} Q${x} ${top-11*k} ${x+w} ${top+2*k} Q${x} ${top+6*k} ${x-w} ${top+2*k}Z" fill="${c}"/>`;
  else if(sp.shape==='cone') cap=`<path d="M${x-w} ${top+3*k} Q${x-w*.6} ${top-20*k} ${x} ${top-24*k} Q${x+w*.6} ${top-20*k} ${x+w} ${top+3*k}Z" fill="${c}"/>`+(sp.net?`<path d="M${x-w*.5} ${top-4*k} L${x+w*.5} ${top-14*k} M${x-w*.5} ${top-14*k} L${x+w*.5} ${top-4*k}" stroke="rgba(0,0,0,.25)" stroke-width="${1.4*k}"/>`:'');
  else cap=`<path d="M${x-w} ${top+3*k} C${x-w} ${top-17*k} ${x+w} ${top-17*k} ${x+w} ${top+3*k}Z" fill="${c}"/>`;
  const spots = sp.shape==='spot' ? [[-9,-6],[2,-10],[10,-3],[-2,-2]].map(([dx,dy])=>`<circle cx="${x+dx*k}" cy="${top+dy*k}" r="${2*k}" fill="#FFF8EC"/>`).join('') : '';
  const glow = sp.glow ? `<ellipse cx="${x}" cy="${top-2*k}" rx="${w*1.9}" ry="${16*k}" fill="${sp.glowC||c}" opacity=".18"/><ellipse cx="${x}" cy="${top}" rx="${w*1.3}" ry="${10*k}" fill="${sp.glowC||c}" opacity=".22"/>` : '';
  const gills = sp.gills ? `<path d="M${x-w*.8} ${top+3*k} Q${x} ${top+7*k} ${x+w*.8} ${top+3*k}" stroke="${sp.gills}" stroke-width="${2*k}" fill="none"/>` : '';
  return `${glow}<path d="M${x-3.4*k} ${y} Q${x-4*k} ${top+12*k} ${x-3*k} ${top+2*k} L${x+3*k} ${top+2*k} Q${x+4*k} ${top+12*k} ${x+3.4*k} ${y}Z" fill="${st}"/>${cap}${gills}${spots}`;
}

}
function skyNextSp(){ const got=new Set((R.sky&&R.sky.born||[]).map(t=>t.sp)); const rest=SP.filter(x=>!got.has(x.id)); return pick(rest.length?rest:SP).id; }
const growOf = fed => { let g=GROW[0]; for(const s of GROW) if(fed>=s.at) g=s; return g; };

  const g=growOf(fed).n, x=110, y=132, rnd=seeded(5); let s='';

function leafColors(){ const m=new Date().getMonth()+1;
  if(m>=3&&m<=5) return ['#A8D46F','#C2E07E','#8CC45E','#D7EBA0'];
  if(m>=6&&m<=8) return ['#4E9B5A','#6DB36A','#3F8650','#7FBF6E'];
  if(m>=9&&m<=11) return ['#D9542E','#E8A33A','#C7402B','#E6C04A'];
  return ['#9A6B44','#B8865A','#7E5A3A','#C9A06E']; }
const LEAF_SHAPES = [
  (c)=>`<svg viewBox="0 0 100 60"><path d="M3 30 C22 2 70 -2 97 30 C70 62 22 58 3 30Z" fill="${c}"/><path d="M3 30 L92 30 M30 30 L44 14 M30 30 L44 46 M55 30 L68 14 M55 30 L68 46" stroke="rgba(0,0,0,.18)" stroke-width="1.6" fill="none"/></svg>`,
  (c)=>`<svg viewBox="0 0 100 100"><path d="M50 96 L50 70 L20 80 L28 62 L4 52 L26 44 L16 22 L38 30 L50 4 L62 30 L84 22 L74 44 L96 52 L72 62 L80 80 L50 70Z" fill="${c}"/><path d="M50 96 L50 30 M50 66 L26 46 M50 66 L74 46" stroke="rgba(0,0,0,.18)" stroke-width="1.6" fill="none"/></svg>`,
  (c)=>`<svg viewBox="0 0 100 90"><path d="M50 86 L50 60 C20 62 4 36 10 12 C26 22 40 18 50 6 C60 18 74 22 90 12 C96 36 80 62 50 60Z" fill="${c}"/><path d="M50 86 L50 14 M50 50 L22 26 M50 50 L78 26" stroke="rgba(0,0,0,.16)" stroke-width="1.6" fill="none"/></svg>`,
];
const BIG_LEAF = (c, back) => `<svg viewBox="0 0 120 70"><path d="M0 35 L10 35" stroke="${c}" stroke-width="3" stroke-linecap="round"/><path d="M8 35 C28 3 84 -1 117 35 C84 71 28 67 8 35Z" fill="${c}"/>${back?`<path d="M8 35 C28 3 84 -1 117 35 C84 71 28 67 8 35Z" fill="#FFF9EC" opacity=".72"/>`:`<path d="M10 35 L110 35 M36 35 L52 16 M36 35 L52 54 M64 35 L80 17 M64 35 L80 53" stroke="rgba(0,0,0,.18)" stroke-width="1.8" fill="none"/>`}</svg>`;
// 項目（例：薬理の「神経系」）の章がぜんぶ終わったか
function itemDone(uid){ const u=UNITS[uid], c=courseById(u.course), sb=c&&c.subjects[u.subj]; return !!sb && sb.units.every(x=>x.ready&&UNITS[x.ready]&&unitDone(x.ready)); }
function clearLeaves(){ document.querySelectorAll('.leaves').forEach(e=>e.remove()); }
function leafBurst(){
  try{
    clearLeaves();
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const cols=leafColors(), box=document.createElement('div'); box.className='leaves'+(reduce?' still':'');
    const W=window.innerWidth||400; let html='';
    for(let i=0;i<16;i++){ const c=pick(cols), w=ri(24,48);
      html+=`<div class="leaf" aria-hidden="true" style="left:${ri(-10,W-20)}px;width:${w}px;--d:${(4.5+Math.random()*3).toFixed(2)}s;--dl:${(Math.random()*2.2).toFixed(2)}s;--sw:${ri(18,60)}px;--r0:${ri(-60,60)}deg;--r1:${ri(200,420)}deg">${pick(LEAF_SHAPES)(c)}</div>`; }
    const bc=pick(cols);
    html+=`<button class="bigleaf" data-act="leafFlip" aria-label="葉っぱをめくる"><span class="bl-in"><span class="bl-f">${BIG_LEAF(bc,false)}</span><span class="bl-b">${BIG_LEAF(bc,true)}<span>${esc(pick(LEAF_MSG))}</span></span></span><span class="bl-hint">タップしてうらを見る</span></button>`;
    box.innerHTML=html; document.body.appendChild(box);
    setTimeout(()=>box.querySelectorAll('.leaf').forEach(l=>l.remove()), 10000);
  }catch(e){}
}
function vResult(){
  const Q=S.quiz, n=Q.qs.length, u=CU(), l=LX(S.lid), idx=u.lessons.indexOf(l), nx=u.lessons[idx+1];
  const msg = Q.score===n?'全問正解。よく頑張りました。':Q.score>=n*0.6?'あと少し。間違えた問題を見直せば完璧です。':'大丈夫。間違えた問題こそ、伸びるところです。';
  return `${top('結果')}<div class="stack">
  <div class="panel result pop"><div class="big">${Q.score}/${n}</div><h2>${Q.retry?'見直し完了':LN(l)}</h2><p class="muted">${msg}</p></div>
  ${S.reward?rewardCard(S.reward):''}
  ${S.gotShard?`<div class="panel shardget pop">${SHARD_I}<div><b>胞子が1つたまりました</b><br><span class="small muted">もっている胞子 ${R.sky.shards}　育てているきのこにあげよう</span></div><button class="btn" data-act="toSky">あげる →</button></div>`:''}
  ${Q.wrong.length?`<button class="btn warm wide" data-act="retry">間違えた ${Q.wrong.length}問 をもう一度</button>`:''}
  ${nx&&!Q.retry?`<button class="btn wide" data-act="lessonNext" data-arg="${nx.id}">次へ　${nx.id} ${nx.t} →</button>`:''}
  <button class="btn again wide" data-act="again">新しい問題でもう一度</button>
  <button class="btn ghost wide" data-act="tounit">胞子の一覧へ</button></div>`;
}
function vRecord(){
  const acc=R.answered?Math.round(R.correct/R.answered*100):0, set=new Set(R.days); let cells='';
  for(let i=27;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); cells+=`<div class="day ${set.has(dkey(d))?'on':''}">${d.getDate()}</div>`; }
  const has=new Set([...R.cards, ...PREVIEW_KEYS, ...(PREVIEW_OPEN?KINOKO_CARDS.filter(c=>c.t==='a').map(c=>c.src):[])]);
  const coll = `<div class="panel stack"><h3>きのこカード　<span class="num">${ALLC.filter(c=>has.has(c.key)).length} / ${ALLC.length}</span></h3>${Object.keys(CTYPE).map(t=>{ const idx=ALLC.map((c,i)=>c.t===t?i:-1).filter(i=>i>=0); if(!idx.length) return ''; const got=idx.filter(i=>has.has(ALLC[i].key)).length;
    return `<div class="stack" style="gap:6px"><p class="small"><b>${CTYPE[t]}</b>　<span class="muted num">${got} / ${idx.length}</span></p><div class="coll">${idx.map(i=>has.has(ALLC[i].key)?`<button data-act="viewCard" data-arg="${i}" aria-label="${esc(cardLabel(i)+'　'+ALLC[i].name)}">${cardFace(i,true)}</button>`:`<div class="num">${cardNo(i)}</div>`).join('')}</div></div>`; }).join('')}<p class="small muted">1つの単元の胞子をぜんぶクリアすると、カードを1まいめくれます。まだ持っていないカードから出てきます。集めたカードはタップで大きく見られます。</p></div>`;
  const vc = S.viewCard!=null && ALLC[S.viewCard] && has.has(ALLC[S.viewCard].key) ? ALLC[S.viewCard] : null;
  const viewer = vc ? `<div class="viewer" data-act="closeCard" role="dialog" aria-label="${esc(vc.name)}"><figure>${vc.t==='i'?`<div class="vsvg">${illusSVG(vc.id)}</div>`:`<img src="${esc(vc.src)}" alt="${esc(vc.name)}">`}<figcaption><span class="rno">${cardLabel(S.viewCard)}</span><b class="rname">${esc(vc.name)}</b>${vc.note?`<span class="rnote">${esc(vc.note)}</span>`:''}</figcaption></figure><button class="btn ghost" data-act="closeCard">閉じる</button></div>` : '';
  const units = Object.entries(UNITS).filter(([uid])=>doneCount(uid)>0);
  return `<div class="stack"><div class="hello"><div class="eyebrow">記録</div><h1>学習の記録</h1></div>
  <div class="panel stack"><h3>この4週間</h3><div class="days">${cells}</div></div>
  <div class="panel"><div class="kv"><span>解いた問題</span><b class="num">${R.answered}問</b></div><div class="kv"><span>正答率</span><b class="num">${acc}%</b></div><div class="kv"><span>連続した日</span><b class="num">${streak()}日</b></div></div>
  ${coll}${viewer}
  ${units.length?units.map(([uid,u])=>`<div class="panel"><h3 style="margin-bottom:6px">${u.subject}　${u.no}　${u.title}</h3>${QL(uid).map(l=>`<div class="kv"><span>${LN(l)}</span>${lTag(uid,l.id)}</div>`).join('')}</div>`).join(''):'<p class="small muted">胞子（5分の学習）を終えると、ここに記録が並びます。</p>'}</div>`;
}
function vSky(){
  const s=skyInit(), g=growOf(s.fed), got=new Set(s.born.map(t=>t.sp)), b=S.born?spOf(S.born):null, nextG=GROW.find(x=>x.at>s.fed);
  return `<div class="stack"><div class="hello"><div class="eyebrow">森</div><h1>胞子を飛ばして蕈を育てよう</h1></div>
  <div class="skybox">${nightSVG(s.born)}<div class="skycount"><span>森のきのこ <b class="num">${s.born.length}</b> 本</span><span>きのこ図鑑 <b class="num">${got.size}</b> / ${SP.length}</span></div></div>
  ${b?`<div class="panel born pop"><svg viewBox="0 0 120 120" class="bsv">${mushG(b,60,104,2.6)}</svg><div><p class="small muted">きのこが生えました！</p><h3>${b.name}</h3><p class="small">${b.note}</p></div></div>`:''}
  <div class="panel grow"><div class="growtop"><div><p class="small muted">いま育てているきのこ</p><h3>${g.n}</h3><p class="small">${g.d}</p></div>${stageSVG(s.fed)}</div>
    <div class="meter"><i style="width:${s.fed/SKY_NEED*100}%"></i></div>
    <p class="small muted">${nextG?`あと <b class="num">${nextG.at-s.fed}</b> 胞子で${nextG.n}、`:''}あと <b class="num">${SKY_NEED-s.fed}</b> 胞子できのこが生えます。どのきのこになるかは、お楽しみ。</p>
    <div class="shardbal">${SHARD_I}<span>もっている胞子 <b class="num">${s.shards}</b></span></div>
    ${S.skyMsg?`<p class="skymsg pop">${S.skyMsg}</p>`:''}
    <div class="two"><button class="btn" data-act="feed" data-arg="1" ${s.shards?'':'disabled'}>1つあげる</button><button class="btn ghost" data-act="feed" data-arg="all" ${s.shards?'':'disabled'}>まとめてあげる</button></div>
    ${s.shards?'':'<p class="small muted">まだクリアしていない小単元（5分の学習）を1つクリアすると、胞子が1つたまります。</p>'}</div>
  <div class="panel"><h3>きのこ図鑑</h3><div class="zukan" style="margin-top:10px">${SP.map(sp=>got.has(sp.id)?`<div class="zk"><svg viewBox="0 0 60 60">${mushG(sp,30,54,1.3)}</svg><b>${sp.name}</b><span>${sp.note}</span></div>`:`<div class="zk no"><svg viewBox="0 0 60 60"><path d="M14 34 C14 14 46 14 46 34 Z M26 34 L25 50 L35 50 L34 34Z" fill="currentColor" opacity=".18"/></svg><b>？？？</b></div>`).join('')}</div></div></div>`;
}
function vSettings(){
  return `<div class="stack"><div class="hello"><div class="eyebrow">設定</div><h1>呼び名</h1></div>
  <div class="panel stack"><label for="st-name"><b>呼び名</b></label><input type="text" id="st-name" value="${esc(R.name)}" maxlength="12" autocomplete="off"></div></div>`;
}
function vInstall(){
  return `${top('ホーム画面に追加')}<div class="stack">
  <div class="panel stack"><h3>iPhone・iPad（Safari）</h3><ol class="steps"><li>下の共有ボタン（□に↑）をタップ</li><li>「ホーム画面に追加」を選ぶ</li><li>右上の「追加」をタップ</li></ol></div>
  <div class="panel stack"><h3>Android（Chrome）</h3><ol class="steps"><li>右上の「︙」メニューをタップ</li><li>「ホーム画面に追加」または「アプリをインストール」を選ぶ</li></ol></div></div>`;
}

/* ===== 演習問題（PDF） ===== */
const STAGES = [
  { lv:1, name:'胞子', desc:'基礎問題', icon:'<circle cx="24" cy="24" r="6"/><circle cx="12" cy="14" r="2.5"/><circle cx="36" cy="16" r="2"/><circle cx="34" cy="36" r="2.4"/>' },
  { lv:2, name:'菌糸', desc:'標準問題', icon:'<path d="M24 24 q-8 6 -16 8 M24 24 q8 6 16 9 M24 24 q-2 8 -6 14 M24 24 q4 8 10 13"/><circle cx="24" cy="22" r="3"/>' },
  { lv:3, name:'幼菌', desc:'定期試験対策', icon:'<path d="M14 28 C14 16 34 16 34 28 Z"/><path d="M21 28 v12 h6 v-12"/>' },
  { lv:4, name:'成菌', desc:'国家試験レベル', icon:'<path d="M6 24 C6 6 42 6 42 24 Z"/><path d="M20 24 v16 h8 v-16"/>' },
  { lv:5, name:'光るきのこ', desc:'国家試験・応用', icon:'<path d="M8 24 C8 8 40 8 40 24 Z"/><path d="M20 24 v16 h8 v-16"/><path d="M4 10 l4 3 M44 10 l-4 3 M24 2 v4"/>' },
];
function vDrill(){
  const u=CU();
  return `${top(u.no+'　'+u.title+'　演習問題')}<div class="stack"><p class="small muted">この単元の演習問題（PDF）です。印刷しても、画面で解いても大丈夫です。きのこが育つのと同じように、Lv1から順にレベルが上がります。</p>
  <div class="ladder">${STAGES.map(s=>{ const p=PDF[u.drill+'-lv'+s.lv]||{};
    return `<div class="rung"><svg class="stage" viewBox="0 0 48 48" aria-hidden="true">${s.icon}</svg><div class="body"><div class="row" style="gap:8px"><span class="tag">Lv${s.lv}</span><b class="sname">${s.name}</b></div><p class="small">${s.desc}</p>
    ${p.q?`<div class="row"><button class="btn pdfbtn" data-act="pdf" data-arg="${s.lv}|0">問題を開く</button><button class="btn ghost pdfbtn" data-act="pdf" data-arg="${s.lv}|1">解答・解説</button></div>`:'<span class="small muted">準備中</span>'}</div></div>`; }).join('')}</div></div>`;
}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfLibP=null;
const loadScript = src => new Promise((ok,ng)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=ng; document.head.appendChild(s); });
function pdfLib(){ if(!pdfLibP) pdfLibP=loadScript(PDFJS+'pdf.min.js').then(()=>{ pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js'; return pdfjsLib; }).catch(e=>{ pdfLibP=null; throw e; }); return pdfLibP; }
function openPdf(arg){ const [lv,i]=arg.split('|'), u=CU(), st=STAGES.find(s=>s.lv===+lv), p=PDF[u.drill+'-lv'+lv]||{};
  S.pdf={ title:`Lv${lv} ${st.name}`, list:[{label:'問題',url:p.q},{label:'解答・解説',url:p.a}], i:+i, z:1, tok:0 }; go('pdf'); }
function vPdf(){ const P=S.pdf;
  return `${top(CU().title+'　'+P.title)}<div class="stack"><div class="pdfbar"><div class="pdfseg">${P.list.map((x,i)=>`<button class="${i===P.i?'on':''}" data-act="pdfTab" data-arg="${i}">${x.label}</button>`).join('')}</div>
  <button class="pdfzoom" data-act="pdfZoom">${P.z>1?'－ 縮小':'＋ 拡大'}</button></div><div id="pdfpages" class="pdfpages"><p class="small muted" style="padding:24px;text-align:center">読みこみ中…</p></div>
  <a class="btn ghost wide pdfbtn" style="text-align:center;text-decoration:none" href="${esc(P.list[P.i].url||'')}" target="_blank" rel="noopener">PDFを別の画面で開く（印刷用）</a></div>`; }
async function renderPdf(){ const P=S.pdf, box=document.getElementById('pdfpages'); if(!box) return; const tok=++P.tok;
  try{ const lib=await pdfLib(), r=await fetch(P.list[P.i].url); if(!r.ok) throw 0; const data=await r.arrayBuffer(); if(tok!==P.tok) return;
    const doc=await lib.getDocument({ data, isEvalSupported:false }).promise; if(tok!==P.tok) return; box.innerHTML='';
    const W=Math.floor(box.clientWidth*P.z), dpr=Math.min(Math.max(window.devicePixelRatio||1,2)*1.5,4);
    for(let n=1;n<=doc.numPages;n++){ const pg=await doc.getPage(n); if(tok!==P.tok) return; const v0=pg.getViewport({scale:1}), vp=pg.getViewport({scale:W/v0.width*dpr}), cv=document.createElement('canvas');
      cv.width=vp.width; cv.height=vp.height; cv.className='pdfpage'; cv.style.width=W+'px'; box.appendChild(cv); await pg.render({ canvasContext:cv.getContext('2d'), viewport:vp }).promise; } }
  catch(e){ if(tok===P.tok) box.innerHTML='<p class="small muted" style="padding:24px;text-align:center">PDFを読みこめませんでした。下のボタンから開いてください。</p>'; } }

const VIEWS={ setup:vSetup, home:vHome, course:vCourse, subject:vSubject, unit:vUnit, lesson:vLesson, cards:vCards, quiz:vQuiz, result:vResult, record:vRecord, settings:vSettings, install:vInstall, drill:vDrill, pdf:vPdf, sky:vSky };
function render(){
  if(S.view!=='result') clearLeaves();
  app.innerHTML=VIEWS[S.view]();
  tabs.hidden = S.view==='setup';
  const tabFor={record:'record',settings:'settings',sky:'sky'}[S.view]||'home';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tabFor));
  const n=document.getElementById('st-name');
  if(n) n.addEventListener('input',e=>{ R.name=e.target.value.trim(); save(); });
  if (S.view==='pdf') renderPdf();
}
function answerQ(picked){
  const Q=S.quiz, q=Q.qs[Q.i], ok=picked===q.answer; Q.picked=picked; R.answered++;
  if(ok){ Q.score++; R.correct++; } else Q.wrong.push(q);
  markDay(); save(); render();
}

document.addEventListener('click', e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){ S.stack=[]; S.viewCard=null; S.born=null; S.skyMsg=''; S.view=tab.dataset.tab; render(); window.scrollTo(0,0); return; }
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, arg=b.dataset.arg;
  if(a==='back') back();
  else if(a==='leafFlip'){ if(!b.classList.contains('open')){ b.classList.add('open'); const h=b.querySelector('.bl-hint'); if(h) h.textContent='タップでとじる'; } else { b.classList.add('bye'); setTimeout(clearLeaves,500); } }
  else if(a==='openReward'){ const rc=b.closest('.rcard'); if(rc) rc.classList.add('open'); b.disabled=true; }
  else if(a==='viewCard'){ S.viewCard=+arg; render(); }
  else if(a==='closeCard'){ S.viewCard=null; render(); }
  else if(a==='go') go(arg);
  else if(a==='pdf') openPdf(arg);
  else if(a==='pdfTab'){ S.pdf.i=+arg; render(); }
  else if(a==='pdfZoom'){ S.pdf.z=S.pdf.z>1?1:1.8; render(); }
  else if(a==='course'){ S.course=arg; go('course'); }
  else if(a==='subject'){ S.subj=+arg; go('subject'); }
  else if(a==='unit'){ S.uid=arg; go('unit'); }
  else if(a==='setupDone'){ const nm=document.getElementById('su-name').value.trim(); if(!nm){ document.getElementById('su-err').hidden=false; return; }
    R.done=true; R.name=nm; save(); S.stack=[]; S.view='home'; render(); }
  else if(a==='lesson'){ if(b.dataset.uid) S.uid=b.dataset.uid; S.lid=arg; go('lesson'); }
  else if(a==='lessonNext'){ const u=CU(); S.lid=arg; S.course=u.course; S.subj=u.subj; S.stack=['home','course','subject','unit']; S.view='lesson'; render(); window.scrollTo(0,0); }
  else if(a==='quiz') startQuiz();
  else if(a==='cards'){ S.deck={cur:deckNext()}; S.flipped=false; markDay(); go('cards'); }
  else if(a==='flip'){ S.flipped=!S.flipped; render(); }
  else if(a==='cardKnown'){ const k=knownList(); if(!k.includes(S.deck.cur)) k.push(S.deck.cur); save(); S.deck.cur=deckNext(); S.flipped=false; render(); }
  else if(a==='cardLater'){ const left=terms().map((_,i)=>i).filter(i=>!knownList().includes(i)); S.deck.cur=left[(left.indexOf(S.deck.cur)+1)%left.length]; S.flipped=false; render(); }
  else if(a==='cardsReset'){ R.known[S.uid]=[]; save(); S.deck.cur=deckNext(); S.flipped=false; render(); }
  else if(a==='hint'){ S.quiz.hint=true; render(); }
  else if(a==='pick') answerQ(arg);
  else if(a==='next'){ const Q=S.quiz;
    if(Q.i+1<Q.qs.length){ Q.i++; Q.picked=null; Q.hint=false; render(); window.scrollTo(0,0); return; }
    S.reward=null; S.gotShard=false; let leafNow=false;
    if(!Q.retry){ skyInit(); const u=CU(), l=LX(S.lid), k=lkey(S.uid,l.id), first=!R.lessons[k], wasDone=unitDone(S.uid), wasItem=itemDone(S.uid), n=Q.qs.length, s=R.lessons[k]||{best:0,tries:0,total:n};
      s.tries++; s.best=Math.max(s.best,Q.score); s.total=n; R.lessons[k]=s; R.lastUnit=S.uid; save();
      if(!wasDone&&unitDone(S.uid)){ S.reward=drawReward(); S.reward.title=u.title; }
      if(first){ R.sky.shards++; R.sky.total++; S.gotShard=true; save(); }
      leafNow = !wasItem && itemDone(S.uid); }
    S.view='result'; render(); window.scrollTo(0,0); if(leafNow) leafBurst(); }
  else if(a==='retry'){ const list=S.quiz.wrong.map(q=>Object.assign({},q,{choices:shuffle([...q.choices])})); S.view=S.stack.pop()||'lesson'; startQuiz(list); }
  else if(a==='again'){ S.view=S.stack.pop()||'lesson'; startQuiz(); }
  else if(a==='feed'){ skyFeed(arg); render(); }
  else if(a==='toSky'){ S.stack=[]; S.born=null; S.skyMsg=''; S.view='sky'; render(); window.scrollTo(0,0); }
  else if(a==='tounit'){ const u=CU(); S.course=u.course; S.subj=u.subj; S.stack=['home','course','subject']; S.view='unit'; render(); window.scrollTo(0,0); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.viewCard!=null){ S.viewCard=null; render(); } });

render();
if('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body></html>
